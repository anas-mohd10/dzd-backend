<div class="coupon-page-container">
   <div class="page-header">
      <div class="page-title">
         <h1 class="fw-bolder">Help Center</h1>
      </div>
      <div class="row align-items-center">
         <div class="col d-flex flex-row justify-content-between">
            <ul class="breadcrumb fw-bolder">
               <li class="breadcrumb-item fs-5">
                  <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
               </li>
               <li class="breadcrumb-item active fs-5">
                  <a routerLink="{{ appRoute.helpcenter.HELPCENTER }}">Help Center</a>
               </li>
            </ul>
         </div>
      </div>
   </div>
   <div class="row mt-10">
      <div class="col-sm-12 fs-5">
         <div class="card">
            <div class="card-body">
               <div class="about-form-container">
                  <div class="col-12">
                     <form [formGroup]="helpcenterForm">
                        <div class="form-group">
                           <label class="fs-5 mb-3 form-title required">Description</label>
                           <angular-editor class="form-control fs-5 about-textarea" formControlName="description"
                              [config]="editorConfig" (click)="showButton()"></angular-editor>
                           <div class="errorMessage"
                              *ngIf="(hf.description.touched || isSubmitted) && hf.description.errors?.required">
                              Help center is required
                           </div>
                        </div>
                        <div class="col-12 col-sm-6">
                           <div class="form-group">
                              <label class="fs-5 mb-3 form-title required">Phone</label>
                              <input type="text" class="form-control fs-5" formControlName="phone"
                                 [ngClass]="{'is-invalid': (hf.phone.touched || isSubmitted) && hf.phone.errors?.required}"
                                 (click)="showButton()" />
                           </div>
                           <div class="text-danger" *ngIf="hf.phone.errors?.pattern">Please Enter Valid Phone Number
                           </div>
                        </div>
                        <div class="col-12 col-sm-6">
                           <div class="form-group">
                              <label class="fs-5 mb-3 form-title required">Email</label>
                              <input type="text" class="form-control fs-5" formControlName="email"
                                 [ngClass]="{'is-invalid': (hf.email.touched || isSubmitted) && hf.email.errors?.required}"
                                 (click)="showButton()" />
                           </div>
                           <div class="text-danger" *ngIf="hf.email.errors?.pattern">Please Enter Valid Email</div>
                        </div>
                        <ng-container *ngIf="!isHidden">
                           <div class="col-12 d-flex justify-content-end">
                              <a (click)="reloadPage()" class=" btn btn-secondary fs-5 text-dark"
                                 style="width: 200px; margin-right: 20px;">
                                 Cancel
                              </a>
                              <button (click)="onSubmit()" class="btn btn-primary  fs-5"
                                 style="width: 200px">Update</button>
                           </div>
                        </ng-container>
                     </form>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </div>
</div>
