<div class="coupon-page-container">
   <div class="page-header">
      <div class="page-title">
         <h1 class="fw-bolder">Terms And Conditions</h1>
      </div>
      <div class="row align-items-center">
         <div class="col d-flex flex-row justify-content-between">
            <ul class="breadcrumb fw-bolder">
               <li class="breadcrumb-item fs-5">
                  <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
               </li>
               <li class="breadcrumb-item active fs-5">
                  <a routerLink="{{ appRoute.termsconditions.TERMSCONDITIONS }}">Terms And Conditions</a>
               </li>
            </ul>
         </div>
      </div>
   </div>
   <div class="row mt-10">
      <div class="col-sm-12 fs-5">
         <div class="card">
            <div class="card-body">
               <div class="about-form-container">
                  <div class="col-12">
                     <form [formGroup]="termsconditionsForm">
                        <div class="form-group">
                           <angular-editor class="form-control fs-5 about-textarea" formControlName="description"
                              [config]="editorConfig" (click)="showButton()"></angular-editor>
                           <div class="errorMessage"
                              *ngIf="(tf.description.touched || isSubmitted) && tf.description.errors?.required">
                              Terms and Condtions is required
                           </div>
                        </div>
                        <ng-container *ngIf="!isHidden">
                           <div class="col-12 d-flex justify-content-end">
                              <a (click)="reloadPage()" class=" btn btn-secondary fs-5 text-dark"
                                 style="width: 200px; margin-right: 20px;">
                                 Cancel
                              </a>
                              <button (click)="onSubmit()" class="btn btn-primary  fs-5"
                                 style="width: 200px">Update</button>
                           </div>
                        </ng-container>
                     </form>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </div>
</div>
