<div class="content container-fluid">
  <!-- Page Header -->
  <div class="page-header">
    <div class="row align-items-center">
      <div class="col">
        <h3 class="page-title fw-bolder fs-2">
          {{ editMode ? "Update Role" : "Add Role" }}
        </h3>
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-5">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item fs-5">
            <a routerLink="{{ appRoute.roles.ROLES_LIST }}">Roles</a>
          </li>
          <li class="breadcrumb-item active fs-5">
            <a routerLink="{{ appRoute.roles.UPDATE_ROLES }}" [queryParams]="{ role: role}">
              {{ editMode ? "Update Role" : "Add Role"}}
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <div class="row mt-10">
    <div class="col-sm-12 fs-5">
      <div class="card">
        <div class="card-body">
          <form (ngSubmit)="onSubmit()" [formGroup]="roleForm">
            <div class="row">
              <div style="display: none;">{{permissionsData.length}}</div>
              <div class="col-12">
                <h5 class="form-title fs-4"><span>Role Details</span></h5>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3 form-title required"> Name</label>
                  <input type="text" class="form-control fs-5" formControlName="name" [ngClass]="{
                      'is-invalid':
                      (rf.name.touched || isSubmitted) &&
                      rf.name.errors?.required
                    }" />
                  <span class="text-danger error-msg fs-5" *ngIf="
                      (rf.name.touched || isSubmitted) &&
                      rf.name.errors?.required
                  ">Name is required
                  </span>
                </div>
              </div>
              <div class="col-12 col-sm-6"></div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Description</label>
                  <textarea class="form-control fs-5" formControlName="description" style="resize: none"
                    rows="5"></textarea>
                </div>
              </div>
              <div class="col-12 col-sm-6"></div>

              <div class="col-12">
                <label class="fs-5 mb-3">Select Permissions</label>
                <div class="form-group mt-10">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="selected" id="selectAllCheck"
                      (change)="checkAllPermission($event)" formControlName="selectall">
                    <label class="form-check-label" for="selectAllCheck">
                      Select All / Deselect All
                    </label>
                  </div>
                </div>
                <div class="permissions-input">
                  <div class="form-group mt-10" *ngFor="let permission of permissionsData">
                    <div class="form-check form-check-inline">
                      <input class="form-check-input fs-5" type="checkbox" id="{{permission.name}}"
                        value="{{permission._id}}" (change)="checkPermission(permission._id, $event)"
                        formControlName="permission">
                      <span class="text-danger error-msg fs-5"
                        *ngIf="(rf.permission.touched || isSubmitted) && rf.permission.errors?.required">
                        Permission is required
                      </span>
                      <label class="form-check-label" for="{{permission.name}}">{{permission.name}}</label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary fs-4">
                  Submit
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
