<div class="brand-page-container">
     <div class="page-header">
          <div class="page-title">
               <h1 class="fw-bolder">Roles</h1>
          </div>
          <div class="row align-items-center">
               <div class="col d-flex flex-row justify-content-between">
                    <ul class="breadcrumb">
                         <li class="breadcrumb-item fs-6"><a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a></li>
                         <li class="breadcrumb-item active fs-6"><a
                                   routerLink="{{ appRoute.roles.ROLES_LIST}}">Roles</a></li>
                    </ul>
                    <button class="btn btn-primary cursor-pointer fs-6" color="primary"
                         routerLink="{{ appRoute.roles.ADD_ROLES }}" style="width: 200px;">
                         Add Roles
                    </button>
               </div>
          </div>
     </div>
     <div class="row">
          <div class="col-sm-12">
               <div class="card card-table">
                    <div class="card-body">
                         <div style="display: none"> {{rolesData.length}}</div>
                         <div class="table-responsive" *ngIf="displayTable">
                              <table datatable [dtOptions]="dtOptions"
                                   class="datatable table table-borderless table-center table-row-dashed mb-0">
                                   <thead class="thead mt-100">
                                        <tr class="fs-7 text-uppercase">
                                             <th class="text-gray-400 col-md-2">Sl No.</th>
                                             <th class="text-gray-400 col-md-2">Role</th>
                                             <th class="text-gray-400 col-md-2">Description</th>
                                             <th class="text-gray-400 col-md-2">Action</th>
                                        </tr>
                                   </thead>
                                   <tbody>
                                        <tr *ngFor="let role of rolesData; let i = index">
                                             <td>
                                                  <h2 class="table-avatar fs-6">{{ i + 1 }}</h2>
                                             </td>
                                             <td>
                                                  <h2 class="table-avatar fs-6">{{role.name}}</h2>
                                             </td>
                                             <td>
                                                  <h2 class="table-avatar fs-6">{{ role.description }}</h2>
                                             </td>
                                             <td>
                                                  <a routerLink="{{ appRoute.roles.UPDATE_ROLES }}"
                                                       [queryParams]="{ role: role?.slug }"
                                                       class="fs-6 cursor-pointer text-darker">
                                                       <i class="bi bi-pen"></i>
                                                       Edit
                                                  </a>
                                             </td>
                                        </tr>
                                   </tbody>
                              </table>
                         </div>
                    </div>
               </div>
          </div>
     </div>
</div>
