<div class="coupon-page-container">
   <div class="page-header">
      <div class="page-title">
         <h1 class="fw-bolder">Customer Report</h1>
      </div>
      <div class="row">
         <div class="col d-flex align-items-start justify-content-between">
            <ul class="breadcrumb">
               <li class="breadcrumb-item fs-6">
                  <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
               </li>
               <li class="breadcrumb-item active fs-6">
                  <a routerLink="{{ appRoute.reports.CUSTOMER_REPORT }}">Customer Reports</a>
               </li>
            </ul>
            <button class="btn btn-primary cursor-pointer fs-6" color="primary">Export</button>
         </div>
      </div>
   </div>

   <div class="row d-flex align-items-start justify-content-end">
      <div class="col-lg-4">
         <label class="fs-6 mb-1">&nbsp;</label>
         <input type="text" placeholder="Search customers here..." class="form-control fs-6" formControlName="customer"
            (ngModelChange)="getCustomers()">
      </div>
      <div class="col-lg-2">
         <label class="fs-6 mb-1">&nbsp;</label>
         <input type="button" class="form-control btn-secondary fs-6 text-dark" value="Clear filters"
            (click)="clearFilters()">
      </div>
   </div>

   <div class="row">
      <div class="col-sm-12">
         <div class="card card-table">
            <div class="card-body">
               <div class="table-responsive">
                  <table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" class="table table-center">
                     <thead>
                        <tr class="fs-5 text-gray-400">
                           <th class="col">Sl No.</th>
                           <th class="col">Customer</th>
                           <th class="col">No. of orders</th>
                           <th class="col">Email</th>
                           <th class="col">Mobile</th>
                           <th class="col">City</th>
                           <th class="col">Pincode</th>
                           <th class="col">State</th>
                        </tr>
                     </thead>
                     <tbody>
                        <tr *ngFor="let data of customerreports; let i = index">
                           <td>
                              <h2 class="table-avatar fs-5">{{ i + 1 }}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar fs-5">{{data?.customer}}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar fs-5">{{data?.orders}}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar fs-5">{{data?.email}}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar fs-5">{{data?.mobile}}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar fs-5">{{data?.city}}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar fs-5">{{data?.pincode}}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar fs-5">{{data?.state}}</h2>
                           </td>
                        </tr>
                     </tbody>
                  </table>
               </div>
            </div>
         </div>
      </div>
   </div>
</div>
