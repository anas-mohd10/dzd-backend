<div class="coupon-page-container">
   <div class="page-header">
      <div class="page-title">
         <h1 class="fw-bolder">Customer Report</h1>
      </div>
      <div class="row align-items-center">
         <div class="col d-flex flex-row justify-content-between">
            <ul class="breadcrumb">
               <li class="breadcrumb-item fs-5">
                  <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
               </li>
               <li class="breadcrumb-item active fs-5">
                  <a routerLink="{{ appRoute.reports.ORDER_REPORT }}">Customer Report</a>
               </li>
            </ul>
            <button class="btn btn-dark cursor-pointer fs-5" color="text-white" style="width: 200px"
               (click)="downloadCsvFile()">Export</button>
         </div>
      </div>
   </div>
   <div class="row col-12 d-flex justify-content-end align-items-end">
      <div class="col-sm-2 align-items-center justify-content-evenly fs-5">
         <label class="col-sm-2 col-form-label">Customers</label>
         <ng-select [items]="customers" bindLabel="name" bindValue="_id" [(ngModel)]="customer"
            placeholder="--Select customer--" [multiple]=false [ngModelOptions]="{standalone: true}"
            (change)="filterReport()">
         </ng-select>
      </div>
      <div class="col-sm-2">
         <a (click)="reloadPage()" class=" btn btn-secondary fs-5 text-dark" style="width: 200px; margin-right: 20px;">
            Reset
         </a>
      </div>
   </div>
   <div class="row">
      <div class="col-sm-12">
         <div class="card card-table">
            <div class="card-body">
               <div class="table-responsive">
                  <table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger"
                     class="table table-borderless table-center mb-0">
                     <thead class="thead mt-100">
                        <tr class="fs-5">
                           <th class="text-gray-400 col-md-2">Sl No.</th>
                           <th class="text-gray-400 col-md-2">Customer</th>
                           <th class="text-gray-400 col-md-2">No. of orders</th>
                           <th class="text-gray-400 col-md-2">Email</th>
                           <th class="text-gray-400 col-md-2">Mobile</th>
                           <th class="text-gray-400 col-md-2">City</th>
                           <th class="text-gray-400 col-md-2">Pincode</th>
                           <th class="text-gray-400 col-md-2">State</th>
                        </tr>
                     </thead>
                     <tbody>
                        <tr *ngFor="let data of customerreports; let i = index">
                           <td>
                              <h2 class="table-avatar fs-5">{{ i + 1 }}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar fs-5">{{data?.customer}}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar fs-5">{{data?.orders}}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar fs-5">{{data?.email}}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar fs-5">{{data?.mobile}}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar fs-5">{{data?.city}}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar fs-5">{{data?.pincode}}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar fs-5">{{data?.state}}</h2>
                           </td>
                        </tr>
                     </tbody>
                  </table>
               </div>
            </div>
         </div>
      </div>
   </div>
</div>
