<div class="coupon-page-container">
   <div class="page-header">
      <div class="page-title">
         <h1 class="fw-bolder">Customer Report</h1>
      </div>
      <div class="row align-items-center">
         <div class="col d-flex flex-row justify-content-between">
            <ul class="breadcrumb">
               <li class="breadcrumb-item fs-6">
                  <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
               </li>
               <li class="breadcrumb-item active fs-6">
                  <a routerLink="{{ appRoute.reports.ORDER_REPORT }}">Customer Report</a>
               </li>
            </ul>
            <button class="btn btn-dark cursor-pointer fs-6" color="text-white" style="width: 200px"
               (click)="downloadCsvFile()">Export</button>
         </div>
      </div>
   </div>
   <form action="" (ngSubmit)="onSubmit()" [formGroup]="customerReportForm">
      <div class="row align-items-end">
         <div class="col-12 col-sm-2 align-items-center justify-content-evenly">
            <label class="col-sm-2 col-form-label">From</label>
            <div class="form-group">
               <input type="date" class="form-control fs-7" formControlName="fromDate" id="">
            </div>
         </div>
         <div class="col-12 col-sm-2 align-items-center justify-content-evenly">
            <label class="col-sm-2 col-form-label">To</label>
            <div class="form-group">
               <input type="date" class="form-control fs-7" formControlName="toDate" id="" (change)="checkToDate()">
            </div>
         </div>
         <div class="col-12 col-sm-2 align-items-center justify-content-evenly">
            <label class="col-sm-2 col-form-label">Customers</label>
            <div class="form-group">
               <select class="form-select form-select-lg fs-7" aria-label=".form-select-lg"
                  formControlName="customerId">
                  <option value="check" disabled>
                     -- Select An Option --
                  </option>
                  <option *ngFor="let customer of customersData" value="{{customer?._id}}">{{customer?.firstname}}
                  </option>
               </select>
            </div>
         </div>
         <div class="col-12 col-sm-2">
            <a (click)="reloadPage()" class=" btn btn-secondary fs-6 text-dark"
               style="width: 200px; margin-right: 20px;">
               Reset
            </a>
         </div>
         <div class="col-12 col-sm-2">
            <button type="submit" class="btn btn-primary btn-submit fs-6" style="width: 200px;">
               Apply
            </button>
         </div>
      </div>
   </form>
   <div class="row">
      <div class="col-sm-12">
         <div class="card card-table">
            <div class="card-body">
               <div style="display: none"> {{customerReportsData.length}}</div>
               <div class="table-responsive">
                  <table datatable [dtOptions]="dtOptions"
                     class="datatable table table-borderless table-center table-row-dashed mb-0">
                     <thead class="thead mt-100">
                        <tr class="fs-7 text-uppercase">
                           <th class="text-gray-400 col-md-2">Sl No.</th>
                           <th class="text-gray-400 col-md-2">Customer</th>
                           <th class="text-gray-400 col-md-2">No. of orders</th>
                           <th class="text-gray-400 col-md-2">Email</th>
                           <th class="text-gray-400 col-md-2">Mobile</th>
                           <th class="text-gray-400 col-md-2">City</th>
                           <th class="text-gray-400 col-md-2">Pincode</th>
                           <th class="text-gray-400 col-md-2">State</th>
                        </tr>
                     </thead>
                     <tbody>
                        <tr *ngFor="let data of customerReportsData; let i = index">
                           <td>
                              <h2 class="table-avatar">{{ i + 1 }}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar fs-6">{{data?.customer}}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar">{{data?.orders}}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar">{{data?.email}}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar">{{data?.mobile}}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar">{{data?.city}}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar">{{data?.pincode}}</h2>
                           </td>
                           <td>
                              <h2 class="table-avatar">{{data?.state}}</h2>
                           </td>
                        </tr>
                     </tbody>
                  </table>
               </div>
            </div>
         </div>
      </div>
   </div>
</div>
