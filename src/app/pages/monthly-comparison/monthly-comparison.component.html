<div class="profilePageContainer">
    <div class="page-header">
        <div class="page-title">
            <h1 class="fw-bolder">Monthly Comparison</h1>
        </div>
        <div class="row">
            <div class="col d-flex align-items-start justify-content-between">
                <ul class="breadcrumb">
                    <li class="breadcrumb-item fs-6">
                        <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item active fs-6">
                        <a routerLink="{{ appRoute.monthlyComparison }}">Monthly Comparison</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <div>
                <form [formGroup]="form">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <div class="fs-5 mb-2 text-primary">Start</div>
                            <div class="d-flex align-items-center justify-content-start">
                                <div class="me-2 form-group">
                                    <label for="start" class="form-label">Month</label>
                                    <select name="start" id="start" formControlName="startMonth" class="form-select">
                                        <option value="" disabled>-- Select an option --</option>
                                        <option *ngFor="let month of months" value="{{month}}">{{month}}</option>
                                    </select>
                                </div>
                                <div class="ms-2 form-group">
                                    <label for="start" class="form-label">Year</label>
                                    <select name="start" id="start" formControlName="startYear" class="form-select">
                                        <option value="" disabled>-- Select an option --</option>
                                        <option *ngFor="let year of years" value="{{year}}">{{year}}</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div>
                            <div class="fs-5 mb-2 text-primary">End</div>
                            <div class="d-flex align-items-center justify-content-start">
                                <div class="me-2 form-group">
                                    <label for="start" class="form-label">Month</label>
                                    <select name="start" id="start" formControlName="endMonth" class="form-select">
                                        <option value="" disabled>-- Select an option --</option>
                                        <option *ngFor="let month of months" value="{{month}}">{{month}}</option>
                                    </select>
                                </div>
                                <div class="ms-2 form-group">
                                    <label for="start" class="form-label">Year</label>
                                    <select name="start" id="start" formControlName="endYear" class="form-select">
                                        <option value="" disabled>-- Select an option --</option>
                                        <option *ngFor="let year of years" value="{{year}}">{{year}}</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
