<div class="design-topbar">
    <div class="w-100 d-flex align-items-center justify-content-between">
        <div class="fs-3 fw-bolder">Design your store</div>

        <div class="d-flex align-items-center justify-content-start" *ngIf="!hideTopbarDetails">
            <div class="device rounded cursor-pointer me-1 d-flex align-items-center justify-content-center border border-secondary"
                [ngClass]="{'bg-primary text-white border-none': deviceType == 'desktop'}"
                (click)="toggleDevice('desktop')">
                <svg height="24" width="24" data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor"
                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 12V5.25">
                    </path>
                </svg>
            </div>
            <div class="device rounded cursor-pointer ms-1 d-flex align-items-center justify-content-center border border-secondary"
                (click)="toggleDevice('mobile')"
                [ngClass]="{'bg-primary text-white border-none': deviceType == 'mobile'}">
                <svg height="24" width="24" data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor"
                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M10.5 1.5H8.25A2.25 2.25 0 0 0 6 3.75v16.5a2.25 2.25 0 0 0 2.25 2.25h7.5A2.25 2.25 0 0 0 18 20.25V3.75a2.25 2.25 0 0 0-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3">
                    </path>
                </svg>
            </div>
        </div>

        <div class="d-flex align-items-center justify-content-end" *ngIf="!hideTopbarDetails">
            <a class="btn btn-secondary me-2 d-flex align-items-center justify-content-center" placement="bottom"
                target="_blank" tooltip="Preview your store in new tab or on your mobile"
                href="{{domain}}">
                <div class="me-2">Preview</div>
                <img src="assets/widgets/assets/preview.svg" alt="Design" class="ms-1">
            </a>
            <button class="btn btn-secondary me-2 d-flex align-items-center justify-content-center" placement="bottom"
                [ngClass]="{'disabled': !isDraft}" (click)="saveDraft()" tooltip="Save as draft">
                <div class="me-2">Save as draft</div>
                <img src="assets/widgets/assets/save-dark.svg" alt="Design" class="ms-1">
            </button>
            <button class="btn btn-primary d-flex align-items-center justify-content-center" placement="bottom"
                [ngClass]="{'disabled': !isDraft}" (click)="publishWidgets()"
                tooltip="Publish your draft changes to live">
                <div class="me-2">Publish</div>
                <img src="assets/widgets/assets/publish.svg" alt="Design" class="ms-1">
            </button>
        </div>
    </div>
</div>
