<app-design-topbar [page]="'contact-us'"></app-design-topbar>
<app-design-sidebar></app-design-sidebar>

<div class="storedesign-wrapper p-6">
    <h4 class="fs-2 fw-bold">Contact Us</h4>
    <div class="row">
        <div class="col-lg-4 form-group">
            <label for="thumbnail" class="form-label required">Thumbnail</label>
            <div class="ratio ratio-1x1">
                <app-assets (mediaClicked)="getThumbnail($event)" [previewDetails]="thumbnailPreview"></app-assets>
            </div>
        </div>
        <div class="col-lg-8">
            <form [formGroup]="form">
                <div class="form-group mb-3">
                    <label for="title" class="form-label required">Title</label>
                    <input type="text"
                        [ngClass]="{'is-invalid': (formControls.title.touched || isSubmitted) && formControls.title.errors?.required}"
                        id="title" placeholder="Here goes your contact page title" class="form-control"
                        formControlName="title">
                </div>
                <div class="form-group mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea id="description"
                        placeholder="Our features timeless furniture, with natural fabrics, curved lines, plenty of mirrors and classic design, which can be incorporated into any decor project."
                        class="form-control" formControlName="description"></textarea>
                </div>
                <div class="form-group mb-3">
                    <label for="address" class="form-label required">Address</label>
                    <textarea id="description"
                        [ngClass]="{'is-invalid': (formControls.address.touched || isSubmitted) && formControls.address.errors?.required}"
                        placeholder="Input your store contact address here" class="form-control"
                        formControlName="address"></textarea>
                </div>
                <div class="form-group mb-3">
                    <label for="mobile" class="form-label required">Mobile</label>
                    <input id="mobile"
                        [ngClass]="{'is-invalid': (formControls.mobile.touched || isSubmitted) && formControls.mobile.errors?.required || formControls.mobile.errors?.pattern}"
                        placeholder="+971-XXXXX" class="form-control" formControlName="mobile">
                </div>
                <div class="form-group mb-3">
                    <label for="email" class="form-label required">Email</label>
                    <input id="email"
                        [ngClass]="{'is-invalid': (formControls.email.touched || isSubmitted) && formControls.email.errors?.required || formControls.email.errors?.pattern}"
                        placeholder="info@storedada.com" class="form-control" formControlName="email">
                </div>

                <div class="d-flex align-items-center justify-content-end gap-3">
                    <button class="btn btn-secondary" (click)="cancelChanges()">Cancel</button>
                    <button class="btn btn-primary" (click)="saveChanges()">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
