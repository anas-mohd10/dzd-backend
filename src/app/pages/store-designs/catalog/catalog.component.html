<app-design-topbar></app-design-topbar>
<app-design-sidebar></app-design-sidebar>

<div class="storedesign-container">
    <div class="row mx-0">
        <div class="col-lg-9">
            <iframe src="http://demo.storedada.com" style="width:100%;" frameborder="0">
            </iframe>
        </div>
        <div class="col-lg-3 bg-white rounded p-5 widget-container">
            <div class="fs-3 fw-bolder mb-2">Catalog Pages</div>
            <p class="text-muted fs-6">Design special pages for catalog</p>
            <div>
                <div class="accordion" id="catalogAccordion">
                    <div class="accordion-item">
                        <h2 class="accordion-header m-0">
                            <button class="accordion-button p-2" type="button" data-bs-toggle="collapse"
                                data-bs-target="#createCatalog" aria-expanded="true" aria-controls="createCatalog">
                                Create catalog
                            </button>
                        </h2>
                        <div id="createCatalog" class="accordion-collapse collapse show"
                            data-bs-parent="#catalogAccordion">
                            <div class="accordion-body p-2">
                                <button class="d-flex align-items-center justify-content-center btn btn-secondary w-100"
                                    (click)="openCreate(createTemplate)">
                                    <svg height="20" width="20" data-slot="icon" fill="none" stroke-width="2"
                                        stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                        aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15">
                                        </path>
                                    </svg>
                                    <div class="ms-1">Create catalog</div>
                                </button>
                                <div class="my-5">
                                    <div class="mb-2">
                                        <div class="form-group">
                                            <label for="catalogPage" class="form-label">Title</label>
                                            <input type="text" id="catalogPage" [formControl]="catalogTitle"
                                                (change)="updateCatalog()" placeholder="{{catalogPageDetails?.title}}"
                                                class="form-control">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label for="catalogPage" class="form-label">Catalog pages</label>
                                        <select [formControl]="catalogPage" id="catalogPage" class="form-select"
                                            (change)="getCatalogDetails()">
                                            <option value="" disabled>-- Select an option --</option>
                                            <option *ngFor="let catalogPage of catalogPages"
                                                value="{{catalogPage?.slug}}">{{catalogPage?.title}}
                                            </option>
                                        </select>
                                    </div>
                                </div>
                                <button class="d-flex align-items-center justify-content-center btn btn-danger w-100">
                                    <svg height="20" width="20" data-slot="icon" fill="none" stroke-width="1.5"
                                        stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                        aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0">
                                        </path>
                                    </svg>
                                    <div class="ms-1">Delete catalog</div>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="accordion-item">
                        <h2 class="accordion-header m-0">
                            <button class="accordion-button p-2 collapsed" type="button" data-bs-toggle="collapse"
                                data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                                Catalog widgets
                            </button>
                        </h2>
                        <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#catalogAccordion">
                            <div class="accordion-body p-2">
                                <div>
                                    <button
                                        class="d-flex align-items-center justify-content-center btn btn-secondary w-100">
                                        <svg height="20px" width="20px" data-slot="icon" fill="none" stroke-width="2"
                                            stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                            aria-hidden="true">
                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                d="M12 4.5v15m7.5-7.5h-15"></path>
                                        </svg>
                                        <div class="ms-1">Add new widgets</div>
                                    </button>
                                </div>
                                <div class="my-5">
                                    <div class="mb-2">
                                        <div class="fs-3 fw-bolder">Widgets</div>
                                        <div class="fs-6 text-muted">Manage section order, design, data.</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="accordion-item">
                        <h2 class="accordion-header m-0">
                            <button class="accordion-button p-2 collapsed" type="button" data-bs-toggle="collapse"
                                data-bs-target="#catalogSeo" aria-expanded="false" aria-controls="catalogSeo">
                                SEO Details
                            </button>
                        </h2>
                        <div id="catalogSeo" class="accordion-collapse collapse" data-bs-parent="#catalogAccordion">
                            <div class="accordion-body p-2">
                                <form [formGroup]="metaForm">
                                    <div class="form-group mb-3">
                                        <label for="seoTitle" class="form-label">Meta title</label>
                                        <input type="text" formControlName="seoTitle" id="seoTitle"
                                            placeholder="Meta title" class="form-control">
                                    </div>
                                    <div class="form-group mb-3">
                                        <label for="seoDescription" class="form-label">Meta description</label>
                                        <input type="text" id="seoDescription" formControlName="seoDescription"
                                            placeholder="Meta description" class="form-control">
                                    </div>
                                    <div class="form-group mb-3">
                                        <label for="seoKeywords" id="seoKeywords" class="form-label">Meta title</label>
                                        <input type="text" formControlName="seoKeywords" placeholder="Meta keywords"
                                            class="form-control">
                                    </div>
                                    <button type="button" class="btn btn-primary w-100"
                                        (click)="updateCatalogSeo()">Save</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #createTemplate>
    <div class="modal-header">
        <h4 class="modal-title pull-left">Catalog Pages</h4>
        <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="closeCreate()">
            <span aria-hidden="true" class="visually-hidden">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <form [formGroup]="catalogForm">
            <div class="form-group mb-3">
                <label for="title" class="form-label required">Title</label>
                <input type="text" formControlName="title" id="title" placeholder="Catalog page title"
                    class="form-control">
            </div>
            <div class="form-group mb-3">
                <label for="description" class="form-label">Description</label>
                <input type="text" formControlName="description" id="description" placeholder="Catalog page description"
                    class="form-control">
            </div>
            <div class="my-2">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <p class="m-0"> Would you like to obtain a copy of any other catalog page? </p>
                    <div class="form-group">
                        <label for="isCopy" class="d-none form-label">&nbsp;</label>
                        <select formControlName="isCopy" id="isCopy" class="form-select">
                            <option value="" disabled>-- Select an option --</option>
                            <option *ngFor="let item of [true, false]" value="{{item}}">
                                {{item == true ? 'Yes' : 'No'}}
                            </option>
                        </select>
                    </div>
                </div>
                <div class="form-group" *ngIf="catalogForm.get('isCopy')?.value == 'true'">
                    <label for="catalogPage" class="form-label">Select catalog</label>
                    <select [formControl]="catalogPage" id="catalogPage" class="form-select">
                        <option value="" disabled>-- Select an option --</option>
                        <option *ngFor="let catalogPage of catalogPages" value="{{catalogPage?.slug}}">
                            {{catalogPage?.title}}
                        </option>
                    </select>
                </div>
            </div>
            <div class="d-flex align-items-center justify-content-end">
                <button class="btn btn-secondary me-1" (click)="closeCreate()">Cancel</button>
                <button class="btn btn-primary ms-1" (click)="createCatalog()">Continue</button>
            </div>
        </form>
    </div>
</ng-template>
