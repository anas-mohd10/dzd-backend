<div class="collection-page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="page-title">
      <h1 class="fw-bolder">Collections</h1>
    </div>
    <div class="row align-items-center">
      <div class="col d-flex flex-row justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-5">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item active fs-5">
            <a routerLink="{{ appRoute.collection.COLLECTION_LIST }}"
              >Collections</a
            >
          </li>
        </ul>
        <button
          class="btn btn-primary cursor-pointer"
          color="primary"
          routerLink="{{ appRoute.collection.ADD_COLLECTION }}"
        >
          Add Collection
        </button>
      </div>
    </div>
  </div>
  <!-- Page Header -->
  <!-- Page Content -->
  <div class="row">
    <div class="col-sm-12">
      <div class="card card-table">
        <div class="card-body">
          <div class="table-responsive" *ngIf="displayTable">
            <table
              datatable
              [dtOptions]="dtOptions"
              class="table table-center table-striped mb-0 datatable table-borderless"
            >
              <thead class="thead">
                <tr>
                  <th class="text-dark fw-bolder fs-4 col-md-2">Sl No.</th>
                  <th class="text-dark fw-bolder fs-4 col-md-2">Collection</th>
                  <th class="text-dark fw-bolder fs-4 col-md-2">Image</th>
                  <th class="text-dark fw-bolder fs-4 col-md-2">Featured</th>
                  <th class="text-dark fw-bolder fs-4 col-md-2">Status</th>
                  <th class="text-dark fw-bolder fs-4 col-md-2">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let collection of collectionData; let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>
                    <h2 class="table-avatar fs-5">{{ collection?.name }}</h2>
                  </td>
                  <td>
                    <img
                      class="collection-logo"
                      src="http://localhost:3000/{{collection?.file}}"
                      alt="collection"
                    />
                  </td>
                  <td>
                    <ng-container *ngIf="collection?.isFeatured == true">
                      <h2 class="table-avatar fs-5">Yes</h2>
                    </ng-container>
                    <ng-container *ngIf="collection?.isFeatured == false">
                      <h2 class="table-avatar fs-5">No</h2>
                    </ng-container>
                  </td>
                  <td>
                    <ng-container *ngIf="collection?.isActive == true">
                      <div class="active-text-view">
                        <span class="active-text">
                          active
                        </span>
                      </div>
                    </ng-container>
                    <ng-container *ngIf="collection?.isActive == false">
                      <div class="inactive-text-view">
                        <span class="inactive-text">
                          inactive
                        </span>
                      </div>
                    </ng-container>
                  </td>
                  <td>
                    <ng-container>
                      <a
                        routerLink="{{ appRoute.collection.UPDATE_COLLECTION }}"
                        [queryParams]="{ collection: collection?.slug }"
                        class="fs-5 cursor-pointer text-darker"
                        ><i class="bi bi-pen"></i> Edit
                      </a>
                    </ng-container>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Page Content -->
</div>
