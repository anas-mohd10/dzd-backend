<div>

  <div class="page-header">
    <div class="page-title">
      <h1 class="fw-bold">Add Brands</h1>
    </div>
    <div class="row align-items-center">
      <div class="d-flex align-items-start justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.brand.BRAND_LIST }}">Brands</a>
          </li>
          <li class="breadcrumb-item active fs-6">
            <a routerLink="{{ appRoute.brand.ADD_BRAND }}">Add Brands</a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <div class="my-4">

    <div class="card">
      <div class="card-body">
        <form (ngSubmit)="onSubmit()" [formGroup]="form">

          <div class="row">
            <div class="col-md-6">
              <label for="cover" class="fs-6 mb-3">Cover</label>
              <div id="cover" class="ratio ratio-21x9 position-relative">
                <app-assets [previewDetails]="cover" (mediaClicked)="onCoverTriggered($event)"></app-assets>
                <div *ngIf="cover">
                  <div class="position-absolute bottom-0 end-0 m-4">
                    <button class="btn btn-danger" (click)="onRemove('cover')">Remove</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <label for="mobileCover" class="fs-6 mb-3">Mobile Cover</label>
              <div id="mobileCover" class="ratio ratio-21x9 position-relative">
                <app-assets [previewDetails]="mobileCover" (mediaClicked)="onMobileCoverTriggered($event)"></app-assets>
                <div *ngIf="mobileCover">
                  <div class="position-absolute bottom-0 end-0 m-4">
                    <button class="btn btn-danger" (click)="onRemove('mobileCover')">Remove</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="row my-2">
              <div class="col-lg-3">
                <label for="thumbnail" class="fs-6 mb-3">Thumbnail</label>
                <div id="thumbnail" class="ratio ratio-1x1">
                  <app-assets [previewDetails]="thumbnail" (mediaClicked)="onThumbnailTriggered($event)"></app-assets>
                </div>
                <div *ngIf="thumbnail">
                  <button class="btn mt-2 btn-danger w-100" (click)="onRemove('thumbnail')">Remove</button>
                </div>
              </div>
              <div class="col-lg-9">
                <div class="row">

                  <div class="form-group mb-3">
                    <label class="required fs-6 mb-3">Name</label>
                    <input type="text" class="form-control fs-6" formControlName="name" [ngClass]="{
                        'is-invalid':
                        (formControls.name.touched || isSubmitted) &&
                        formControls.name.errors?.required
                      }" />
                  </div>

                  <div class="form-group mb-3">
                    <label class="fs-6 mb-3">Description</label>
                    <textarea type="text" class="form-control fs-6" formControlName="description"></textarea>
                  </div>

                  <div class="mb-3">
                    <div class="form-group mb-3">
                      <label class="fs-6 mb-3">Meta Title</label>
                      <input type="text" class="form-control fs-6" formControlName="metaTitle" />
                    </div>

                    <div class="form-group mb-3">
                      <label class="fs-6 mb-3">Meta Description</label>
                      <textarea type="text" class="form-control fs-6" formControlName="metaDescription"></textarea>
                    </div>

                    <div class="form-group mb-3">
                      <label class="fs-6 mb-3">Meta Keywords</label>
                      <input type="text" class="form-control fs-6" formControlName="metaKeywords" />
                    </div>
                  </div>

                  <div class="col-lg-6">
                    <div class="form-group">
                      <label class="fs-6 mb-3">Status</label>
                      <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg"
                        formControlName="isActive">
                        <option value="false">Inactive</option>
                        <option value="true">Active</option>
                      </select>
                    </div>
                  </div>
                  <div class="col-lg-6">
                    <div class="form-group">
                      <label class="fs-6 mb-3">Featured Brand?</label>
                      <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg"
                        formControlName="isFeatured">
                        <option value="false" selected>No</option>
                        <option value="true">Yes</option>
                      </select>
                    </div>
                  </div>
                  <div class="col-lg-6">
                    <div class="form-group">
                      <label class="fs-6 mb-3">Archive Brand?</label>
                      <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg"
                        formControlName="isArchive">
                        <option value="false" selected>No</option>
                        <option value="true">Yes</option>
                      </select>
                    </div>
                  </div>

                  <div class="d-flex align-items-center justify-content-end gap-2">
                    <a routerLink="{{ appRoute.brand.BRAND_LIST}}" class="btn btn-secondary">
                      Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                      Save changes
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
