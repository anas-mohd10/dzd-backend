<div class="brand-page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="row align-items-center">
      <div class="col d-flex flex-row justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-5">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item active fs-5">Brand</li>
        </ul>
        <button
          class="btn btn-primary cursor-pointer"
          color="primary"
          routerLink="{{ appRoute.brand.ADD_BRAND }}"
        >
          Add Brand
        </button>
      </div>
    </div>
  </div>
  <!-- /Page Header -->

  <!-- Table start -->
  <div class="row">
    <div class="col-sm-12">
      <div class="card card-table">
        <div class="card-body">
          <div class="table-responsive">
            <table
              datatable
              [dtOptions]="dtOptions"
              [dtTrigger]="dtTrigger"
              class="table table-center table-striped mb-0 datatable"
            >
              <thead class="thead">
                <tr>
                  <th class="text-dark fw-bolder fs-5">Sl No.</th>
                  <th class="text-dark fw-bolder fs-5">Brand</th>
                  <th class="text-dark fw-bolder fs-5">Logo</th>
                  <th class="text-dark fw-bolder fs-5">Status</th>
                  <th class="text-dark fw-bolder fs-5">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let brand of brandData; let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>
                    <h2 class="table-avatar fs-5">{{ brand?.name }}</h2>
                  </td>
                  <td><img src="{{ brand?.logo }}" alt="Brand Logo" /></td>
                  <td>
                    <ng-container *ngIf="brand?.isActive == true">
                      <h2 class="table-avatar fs-5">Active</h2>
                    </ng-container>
                  </td>
                  <td>
                    <a class="fs-5 cursor-pointer text-darker"> Edit </a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Table end -->
</div>
