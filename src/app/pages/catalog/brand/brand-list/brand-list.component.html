<div class="brand-page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="page-title">
      <h1 class="fw-bolder">Brands</h1>
    </div>
    <div class="row align-items-center">
      <div class="col d-flex flex-row justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-5">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item active fs-5">
            <a routerLink="{{ appRoute.brand.BRAND_LIST }}">Brands</a>
          </li>
        </ul>
        <button
          class="btn btn-primary cursor-pointer fs-5"
          color="primary"
          routerLink="{{ appRoute.brand.ADD_BRAND }}"
        >
          <i class="bi bi-plus-lg fs-6"></i> Add Brand
        </button>
      </div>
    </div>
  </div>
  <!-- /Page Header -->

  <!-- Table start -->
  <div class="row">
    <div class="col-sm-12">
      <div class="card card-table">
        <div class="card-body">
          <div class="table-responsive">
            <table
              datatable
              [dtOptions]="dtOptions"
              [dtTrigger]="dtTrigger"
              class="table table-bordered table-center table-striped mb-0 datatable"
            >
              <thead class="thead">
                <tr>
                  <th class="text-dark fw-bolder fs-4">Sl No.</th>
                  <th class="text-dark fw-bolder fs-4">Brand</th>
                  <th class="text-dark fw-bolder fs-4">Logo</th>
                  <th class="text-dark fw-bolder fs-4">Featured</th>
                  <th class="text-dark fw-bolder fs-4">Status</th>
                  <th class="text-dark fw-bolder fs-4">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let brand of brandData; let i = index">
                  <td>
                    <h2 class="table-avatar fs-5">{{ i + 1 }}</h2>
                  </td>
                  <td>
                    <h2 class="table-avatar fs-5">{{ brand?.name }}</h2>
                  </td>
                  <td>
                    <img
                      class="brand-logo"
                      src="../../../../../assets/media/products/11.png"
                      alt="Brand Logo"
                    />
                  </td>
                  <td>
                    <ng-container *ngIf="brand?.isFeatured == true">
                      <h2 class="table-avatar fs-5">Yes</h2>
                    </ng-container>
                    <ng-container *ngIf="brand?.isFeatured == false">
                      <h2 class="table-avatar fs-5">No</h2>
                    </ng-container>
                  </td>
                  <td>
                    <ng-container *ngIf="brand?.isActive == true">
                      <h2 class="table-avatar fs-5">Active</h2>
                    </ng-container>
                    <ng-container *ngIf="brand?.isActive == false">
                      <h2 class="table-avatar fs-5">Inactive</h2>
                    </ng-container>
                  </td>
                  <td>
                    <a
                      routerLink="{{ appRoute.brand.UPDATE_BRAND }}"
                      [queryParams]="{brand: brand?.slug}"
                      class="fs-5 cursor-pointer text-darker"
                      ><i class="bi bi-pen"></i> Edit
                    </a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Table end -->
</div>
