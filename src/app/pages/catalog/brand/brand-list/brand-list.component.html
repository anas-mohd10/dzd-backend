<div class="brand-page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="page-title">
      <h1 class="fw-bold fs-1">Brands</h1>
    </div>
    <div class="row align-items-center">
      <div class="col d-flex flex-row justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-5">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item active fs-5">
            <a routerLink="{{ appRoute.brand.BRAND_LIST }}">Brands</a>
          </li>
        </ul>
        <button
          class="btn btn-primary cursor-pointer fs-5"
          color="primary"
          routerLink="{{ appRoute.brand.ADD_BRAND }}"
        >
          Add Brand
        </button>
      </div>
    </div>
  </div>
  <!-- /Page Header -->

  <!-- Table start -->
  <div class="row">
    <div class="col-sm-12">
      <div class="card card-table">
        <div class="card-body">
          <div class="table-responsive" *ngIf="displayTable">
            <table
              datatable
              [dtOptions]="dtOptions"
              class="datatable table table-borderless table-center table-striped mb-0"
            >
              <thead class="thead mt-100">
                <tr>
                  <th class="text-dark fs-4 col-md-2">Sl No.</th>
                  <th class="text-dark fs-4 col-md-2">Brand</th>
                  <th class="text-dark fs-4 col-md-2">Logo</th>
                  <th class="text-dark fs-4 col-md-2">Featured</th>
                  <th class="text-dark fs-4 col-md-2">Status</th>
                  <th class="text-dark fs-4 col-md-2">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let brand of brandData; let i = index">
                  <td>
                    <h2 class="table-avatar fs-5">{{ i + 1 }}</h2>
                  </td>
                  <td>
                    <h2 class="table-avatar fs-5">{{ brand?.name }}</h2>
                  </td>
                  <td>
                    <img
                      class="brand-logo"
                      src="http://localhost:3000/{{ brand?.file }}"
                      alt="brand"
                    />
                  </td>
                  <td>
                    <ng-container *ngIf="brand?.isFeatured == true">
                      <h2 class="table-avatar fs-5">Yes</h2>
                    </ng-container>
                    <ng-container *ngIf="brand?.isFeatured == false">
                      <h2 class="table-avatar fs-5">No</h2>
                    </ng-container>
                  </td>
                  <td>
                    <ng-container *ngIf="brand?.isActive == true">
                      <div class="active-text-view">
                        <span class="active-text"> active </span>
                      </div>
                    </ng-container>
                    <ng-container *ngIf="brand?.isActive == false">
                      <div class="inactive-text-view">
                        <span class="inactive-text"> inactive </span>
                      </div>
                    </ng-container>
                  </td>
                  <td>
                    <a
                      routerLink="{{ appRoute.brand.UPDATE_BRAND }}"
                      [queryParams]="{ brand: brand?.slug }"
                      class="fs-5 cursor-pointer text-darker"
                      ><i class="bi bi-pen"></i> Edit
                    </a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Table end -->
</div>
