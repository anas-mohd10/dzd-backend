<div>

  <div class="page-header d-flex align-items-start justify-content-between">
    <div>
      <div class="page-title">
        <h1 class="fw-bold">Update Brands</h1>
      </div>
      <ul class="breadcrumb">
        <li class="breadcrumb-item fs-6">
          <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
        </li>
        <li class="breadcrumb-item fs-6">
          <a routerLink="{{ appRoute.brand.BRAND_LIST }}">Brands</a>
        </li>
        <li class="breadcrumb-item active fs-6">
          <a routerLink="{{ appRoute.brand.UPDATE_BRAND }}" [queryParams]="{'brand': slug}">Update Brands</a>
        </li>
      </ul>
    </div>

    <div class="d-flex align-items-start justify-content-end gap-2">
      <button type="button" (click)="onRestore()" class="btn btn-secondary" *ngIf="brandDetails?.isArchive == true">
        Restore brand
      </button>
      <button type="button" (click)="onDelete()" class="btn btn-danger">
        Delete brand
      </button>
    </div>
    <ng-template #deleteConfirmation let-c="close" let-d="dismiss">
      <div class="modal-header align-items-center justify-content-center">
        <h4 class="modal-title">Confirm Delete</h4>
      </div>
      <div class="modal-footer align-items-center justify-content-center">
        <button type="button" class="btn btn-primary" (click)="d()">Cancel</button>
        <button type="button" class="btn btn-secondary" (click)="confirmDelete()">Delete</button>
      </div>
    </ng-template>
  </div>

  <div class="my-4" [ngClass]="{'pe-none opacity-50': brandDetails?.isArchive == true}">

    <div class="card">
      <div class="card-body">

        <div class="mb-4 fs-5 text-muted">
          Created on {{formatDate(brandDetails?.createdAt)}}
        </div>

        <form [formGroup]="form">

          <div class="row">
            <div>
              <label for="cover" class="fs-6 mb-3">Cover</label>
              <div id="cover" class="default-banner position-relative">
                <app-assets [previewDetails]="cover" (mediaClicked)="onCoverTriggered($event)"></app-assets>
                <div *ngIf="cover">
                  <div class="position-absolute bottom-0 end-0 m-4">
                    <button class="btn btn-danger" (click)="onRemove('cover')">Remove</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="my-3">
              <label for="mobileCover" class="fs-6 mb-3">Mobile Cover</label>
              <div id="mobileCover" class="default-banner position-relative">
                <app-assets [previewDetails]="mobileCover" (mediaClicked)="onMobileCoverTriggered($event)"></app-assets>
                <div *ngIf="mobileCover">
                  <div class="position-absolute bottom-0 end-0 m-4">
                    <button class="btn btn-danger" (click)="onRemove('mobileCover')">Remove</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="row my-2">
              <div class="col-lg-3">
                <label for="thumbnail" class="fs-6 mb-3">Thumbnail</label>
                <div id="thumbnail" class="ratio ratio-1x1 position-relative">
                  <app-assets [previewDetails]="thumbnail" (mediaClicked)="onThumbnailTriggered($event)"></app-assets>
                </div>
                <div *ngIf="thumbnail">
                  <button class="btn mt-2 btn-danger w-100" (click)="onRemove('thumbnail')">Remove</button>
                </div>
              </div>
              <div class="col-lg-9">
                <div class="row">

                  <div class="form-group mb-3">
                    <label class="required fs-6 mb-3">Brand Name</label>
                    <input type="text" class="form-control fs-6" formControlName="name" placeholder="Brand name"
                      [ngClass]="{
                        'is-invalid':
                        (formControls.name.touched || isSubmitted) &&
                        formControls.name.errors?.required
                      }" />
                  </div>

                  <div class="form-group mb-3">
                    <label class="required fs-6 mb-3">Slug</label>
                    <input type="text" class="form-control fs-6" formControlName="slug" [ngClass]="{
                        'is-invalid': 
                        (formControls.slug.touched || isSubmitted) && 
                        (formControls.slug.errors?.required || formControls.slug.errors?.pattern)
                      }" />
                    <div *ngIf="(formControls.slug.touched || isSubmitted) && formControls.slug.errors?.required"
                      class="invalid-feedback">
                      Slug is required.
                    </div>
                    <div *ngIf="(formControls.slug.touched || isSubmitted) && formControls.slug.errors?.pattern"
                      class="invalid-feedback">
                      Slug must contain only lowercase letters, numbers, and hyphens (no spaces or special characters).
                    </div>
                  </div>

                  <div class="form-group mb-3">
                    <label class="fs-6 mb-3">Description</label>
                    <textarea type="text" class="form-control fs-6" formControlName="description"></textarea>
                  </div>

                  <div class="mb-3">
                    <div class="form-group mb-3">
                      <label class="fs-6 mb-3">Meta Title</label>
                      <input type="text" class="form-control fs-6" formControlName="metaTitle" />
                    </div>

                    <div class="form-group mb-3">
                      <label class="fs-6 mb-3">Meta Description</label>
                      <textarea type="text" class="form-control fs-6" formControlName="metaDescription"></textarea>
                    </div>

                    <div class="form-group mb-3">
                      <label class="fs-6 mb-3">Meta Keywords</label>
                      <input type="text" class="form-control fs-6" formControlName="metaKeywords" />
                    </div>
                  </div>

                  <div class="col-lg-6">
                    <div class="form-group">
                      <label class="fs-6 mb-3">Status</label>
                      <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg"
                        formControlName="isActive">
                        <option value="false">Inactive</option>
                        <option value="true">Active</option>
                      </select>
                    </div>
                  </div>
                  <div class="col-lg-6">
                    <div class="form-group">
                      <label class="fs-6 mb-3">Featured Brand?</label>
                      <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg"
                        formControlName="isFeatured">
                        <option value="false" selected>No</option>
                        <option value="true">Yes</option>
                      </select>
                    </div>
                  </div>
                  <div class="col-lg-6">
                    <div class="form-group">
                      <label class="fs-6 mb-3">Archive Brand?</label>
                      <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg"
                        formControlName="isArchive">
                        <option value="false" selected>No</option>
                        <option value="true">Yes</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Previous template code remains the same until the brand categories section -->

          <div *ngFor="let category of brandCategories; let i = index" class="mb-4">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Brand Category {{ i + 1 }} Title</label>
              <input type="text" class="form-control fs-6" [value]="category.title"
                (input)="updateCategoryTitle(i, $event)" placeholder="Enter category title" />
            </div>

            <label class="fs-6 mb-2">Brand Category {{ i + 1 }} Images</label>
            <div class="row" id="brand-category-images-{{i}}">
              <!-- Existing Images -->
              <div class="col-lg-3 mb-3" *ngFor="let img of category.brandCategoryImages; let j = index">
                <div class="card h-100">
                  <div class="ratio border ratio-1x1 h-auto w-100 rounded-top position-relative">
                    <div class="close-icon rounded bg-danger text-white"
                      style="position: absolute; top: 2px; right: 2px; cursor: pointer; z-index: 2; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; padding: 0;"
                      (click)="removeBrandCategoryImage(i, img.url)">
                      <svg height="18" width="18" fill="none" stroke-width="1.5" stroke="currentColor"
                        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"></path>
                      </svg>
                    </div>
                    <img [src]="img.url" class="rounded-top object-fit-cover h-100 w-100" />
                  </div>
                  <div class="card-body p-2">
                    <input type="text" class="form-control form-control-sm" [value]="img.title"
                      (input)="updateImageTitle(i, j, $event)" placeholder="Image title" />
                  </div>
                </div>
              </div>

              <!-- Add New Image -->
              <div class="col-lg-3 mb-3">
                <div class="ratio ratio-1x1 h-auto w-100 rounded">
                  <app-assets (mediaClicked)="addBrandCategoryImage(i, $event)" [previewEnabled]="false"></app-assets>
                </div>
              </div>
            </div>
          </div>

        </form>
      </div>
    </div>

    <div class="d-flex align-items-center justify-content-end gap-2 my-4">
      <a routerLink="{{ appRoute.brand.BRAND_LIST}}" class="btn btn-secondary">
        Cancel
      </a>
      <button type="submit" class="btn btn-primary" (click)="onSubmit()">
        Save changes
      </button>
    </div>
  </div>
</div>
