<div class="content container-fluid">
  <!-- Page Header -->
  <div class="page-header">
    <div class="row align-items-center">
      <div class="col">
        <h3 class="page-title fs-1 fw-bolder">
          {{ editMode ? "Update Brand" : "Add Brand" }}
        </h3>
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.brand.BRAND_LIST }}">Brands</a>
          </li>
          <li class="breadcrumb-item active fs-6">
            <a routerLink="{{ appRoute.brand.UPDATE_BRAND }}" [queryParams]="{ brand: brand }">
              {{ editMode ? "Update Brand" : "Add Brand" }}</a>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <!-- Page Header -->
  <!-- Page Body -->
  <div class="row mt-10">
    <div class="col-sm-12 fs-6">
      <div class="card">
        <div class="card-body">
          <form (ngSubmit)="onSubmit()" [formGroup]="brandForm">
            <div class="row">
              <div class="col-12">
                <h3 class="form-title"><span>Brand Details</span></h3>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="required fs-6 mb-3">Brand Name</label>
                  <input type="text" class="form-control fs-6" formControlName="name" />
                  <div class="fs-7 mt-3">A brand name is required and recommended to be unique.</div>
                </div>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-6 mb-3">Status</label>
                  <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg"
                    formControlName="isActive">
                    <option value="true">Active</option>
                    <option value="false">Inactive</option>
                  </select>
                </div>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-6 mb-3">Featured Brand ?</label>
                  <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg"
                    formControlName="isFeatured">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                  </select>
                </div>
              </div>
              <div class="col-12 col-sm-6"></div>
              <div class="col-12 col-sm-6">
                <div class="col-12">
                  <h3 class="form-title required"><span>Media</span></h3>
                </div>
                <div class="form-group">
                  <div class="image-upload">
                    <input type="file" class="form-control fs-6" name="image" accept="image/*"
                      (change)="handleInputChange($event)"
                      onchange="document.getElementById('previewImage').src = window.URL.createObjectURL(this.files[0])"
                      style="height: 100px;" required>
                    <div class="image-upload-div">
                      <div class="left-img"><img src="../../../../../assets/media/svg/files/upload.svg" alt=""
                          srcset=""></div>
                      <div class="right-text d-flex flex-column"><span class="right-text-title fs-4 fw-bolder">Click to
                          upload</span> <span class="right-text-note fs-7 text-gray-400" style="font-weight: 500">Upload
                          up to 1
                          file</span></div>
                    </div>
                  </div>
                  <div class="uploads uploaded">
                    <img id="previewImage" src="http://localhost:3000/{{ brandData.file }}">
                  </div>
                </div>
              </div>
              <div class="col-12">
                <a routerLink="{{ appRoute.brand.BRAND_LIST}}" class=" btn btn-secondary btn-sm fs-6 text-dark"
                  style="width: 200px; margin-right: 20px;">
                  Cancel
                </a>
                <button type="submit" class="btn btn-primary btn-sm fs-6" style="width: 200px">
                  Update
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <!-- Page Body -->
</div>
