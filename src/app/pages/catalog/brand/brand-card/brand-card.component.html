<div class="brand-page-container">
  <div class="page-header">
    <div class="page-title">
      <h1 class="fw-bolder">Brands</h1>
    </div>
    <div class="row align-items-center">
      <div class="col d-flex flex-row justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item active fs-6">
            <a routerLink="{{ appRoute.brand.BRAND_LIST }}">Brands</a>
          </li>
        </ul>
        <button class="btn btn-primary cursor-pointer fs-6" color="primary" routerLink="{{ appRoute.brand.ADD_BRAND }}"
          style="width: 200px">Add Brand</button>
      </div>
    </div>
  </div>
  <div class="brand-form-container">
    <form [formGroup]="brandForm">
      <div class="col-12 row" style="display: flex; align-items: flex-end;">
        <div class="search-input col-sm-4">
          <label class="fs-6">Search</label>
          <input type="text" placeholder="Search for brands here..." class="form-control fs-6" formControlName="name"
            (ngModelChange)="onChange()">
        </div>
        <div class="search-status col-sm-2">
          <label class="fs-6">Status</label>
          <select name="" id="" class="form-select fs-6" formControlName="isActive" (change)="onChange()">
            <option value="">-- Select an option --</option>
            <option value=true>Active</option>
            <option value=false>Inactive</option>
          </select>
        </div>
        <div class="search-featured col-sm-2">
          <label class="fs-6 form-title">Featured</label>
          <select name="" id="" class="form-select fs-6" formControlName="isFeatured" (change)="onChange()">
            <option value="">-- Select an option --</option>
            <option value=true>Featured</option>
            <option value=false>Non featured</option>
          </select>
        </div>
        <div class="search-submit col-sm-2">
          <button type="button" class="form-control fs-6 bg-secondary text-dark" (click)="onReload()"
            style="outline: none; border: none;">Clear</button>
        </div>
      </div>
    </form>
  </div>
  <div class="pagelength-container col-12 row" *ngIf="isData">
    <div class="col-sm-2 page-length-container">
      <label class="fs-6 form-title">Show</label>
      <select name="" id="" class="form-select fs-6" (change)="fetchByLimit($event.target)">
        <option value=3>3</option>
        <option value=4 selected>4</option>
        <option value=25>25</option>
        <option value=50>50</option>
      </select>
      <label class="fs-6 form-title">entries</label>
    </div>
  </div>
  <div class="brand-card-container view-container">
    <ng-container *ngFor="let brand of brands">
      <div class="brand-card">
        <div class="brand-details">
          <div class="brand-image">
            <img src='{{base}}/{{brand?.file}}' alt="brand image" srcset="" />
          </div>
          <div class="flex-1">
            <div class="brand-name">{{brand?.name}}</div>
            <div class="brand-featured-{{brand?.isFeatured}}">
              <ng-container *ngIf="brand?.isFeatured == true">Featured</ng-container>
              <ng-container *ngIf="brand?.isFeatured == false">Not Featured</ng-container>
            </div>
          </div>
        </div>
        <div class="flex-21">
          <div class="brand-status-{{brand?.isActive}}">
            <ng-container *ngIf="brand?.isActive == true">Active</ng-container>
            <ng-container *ngIf="brand?.isActive == false">Inactive</ng-container>
          </div>
          <div class="card-edit-btn">
            <button routerLink="{{ appRoute.brand.UPDATE_BRAND }}" [queryParams]="{ brand: brand?.slug }"
              class="fs-5 cursor-pointer text-darker">
              Edit
            </button>
          </div>
        </div>
      </div>
    </ng-container>
    <ng-container *ngIf="!isData">
      <div class="no-data-container">
        <h2>Sorry, we haven't found any data</h2>
      </div>
    </ng-container>
  </div>
  <div class="pagination-conatiner col-12" *ngIf="isData">
    <ul class="pagination justify-content-end">
      <ng-container *ngFor="let key of pages">
        <li *ngIf="selectedPage == key.key" class="page-item active" (click)="fetchByPage(key.key)">{{key.key}}</li>
        <li *ngIf="selectedPage != key.key" class="page-item" (click)="fetchByPage(key.key)">{{key.key}}</li>
      </ng-container>
    </ul>
  </div>
</div>
