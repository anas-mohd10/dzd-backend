<div class="brand-page-container">
  <div class="page-header">
    <div class="page-title">
      <h1 class="fw-bolder">Brands</h1>
    </div>
    <div class="row">
      <div class="col d-flex align-items-start justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item active fs-6">
            <a routerLink="{{ appRoute.brand.BRAND_LIST }}">Brands</a>
          </li>
        </ul>
        <button class="btn btn-primary cursor-pointer fs-6" color="primary"
          routerLink="{{ appRoute.brand.ADD_BRAND }}">Add brand</button>
      </div>
    </div>
  </div>

  <div class="brand-form-container">
    <form [formGroup]="brandform">
      <div class="col-12 row align-items-end justify-content-end">
        <div class="search-input col-sm-4" style="padding: 0;">
          <input type="text" placeholder="Search for brands here..." class="form-control fs-6" formControlName="name"
            (ngModelChange)="searchBrand()">
        </div>
        <div class="search-status col-sm-2">
          <select name="" id="" class="form-select fs-6" formControlName="isActive" (change)="searchBrand()">
            <option value="" disabled>Brand Status Filter</option>
            <option value=true>Active</option>
            <option value=false>Inactive</option>
          </select>
        </div>
        <div class="search-featured col-sm-2">
          <select name="" id="" class="form-select fs-6" formControlName="isFeatured" (change)="searchBrand()">
            <option value="" disabled>Featured Brand Filter</option>
            <option value=true>Featured</option>
            <option value=false>Non featured</option>
          </select>
        </div>
        <div class="search-submit col-sm-2">
          <button type="button" class="form-control fw-bolder fs-6 bg-secondary text-dark" (click)="onReload()"
            style="outline: none; border: none;">Clear</button>
        </div>
      </div>
    </form>
  </div>

  <div class="col-12 d-flex justify-content-between">
    <div class="total-count-container col-sm-3 bg-dark">
      <h4 class="text-white fs-6">Total {{totalcount ? totalcount : 0}} brands</h4>
    </div>
    <div>
      <button class="btn btn-secondary cursor-pointer fs-6" color="primary"
        routerLink="{{ appRoute.brand.ARCHIVED_BRAND }}">Archived Brands</button>
    </div>
  </div>

  <div class="brand-card-container view-container col-12">
    <ng-container *ngFor="let brand of brands">
      <div class="brand-card card-hover">
        <div class="editButton">
          <div routerLink="{{ appRoute.brand.UPDATE_BRAND }}" [queryParams]="{ brand: brand?.slug }">
            <img src="../../../../../assets/icons/editPen.svg" alt="Icon">
          </div>
        </div>

        <div class="brand-image">
          <img src='{{base}}/{{brand?.file}}' alt="brand image" srcset="" />
        </div>

        <div class="brand-details">
          <div class="brand-name fs-4 fw-bolder mb-3">{{brand?.name}}</div>
          <div class="fs-6 brand-featured-{{brand?.isFeatured}}">
            {{brand?.isFeatured ? 'Featured' : 'Not featured'}}
          </div>
          <div class="fs-6 brand-status-{{brand?.isActive}}">
            {{brand?.isActive ? 'Active' : 'Inactive'}}
          </div>
        </div>
      </div>
    </ng-container>
    <ng-container *ngIf="count == 0">
      <div class="emptyNote">
        <div class="fs-3 fw-bolder">No result found</div>
        <div class="fs-6 note">We couldn't find any item based on your search</div>
      </div>
    </ng-container>
  </div>
  <nav aria-label="Page navigation example" *ngIf="count != 0">
    <ul class="pagination-container">
      <div class="page-change-icon" *ngIf="selectedpage != 1 &&  selectedpage > 0">
        <a class="page-link" (click)="loadPrevious()" aria-label="Previous">
          <i class="bi bi-arrow-left-circle"></i>
        </a>
      </div>
      <div class="page-change-icon" *ngIf="selectedpage == 1">
        <a class="page-link page-link-disabled" aria-label="Previous">
          <i class="bi bi-arrow-left-circle"></i>
        </a>
      </div>
      <li class="page-item" *ngFor="let key of pages">
        <a *ngIf="selectedpage != key" class="page-link" (click)="fetchBrand(key, limit)">{{key}}</a>
        <a *ngIf="selectedpage == key" class="page-link page-active" (click)="fetchBrand(key, limit)">{{key}}</a>
      </li>
      <div class="page-change-icon" *ngIf="selectedpage != totaldata">
        <a class="page-link" (click)="loadNext()" aria-label="Next">
          <i class="bi bi-arrow-right-circle"></i>
        </a>
      </div>
      <div class="page-change-icon" *ngIf="selectedpage == totaldata">
        <a class="page-link page-link-disabled" aria-label="Next">
          <i class="bi bi-arrow-right-circle"></i>
        </a>
      </div>
    </ul>
  </nav>
</div>
