<div class="brand-page-container">
  <div class="page-header">
    <div class="page-title">
      <h1 class="fw-bolder">Brands</h1>
    </div>
    <div class="row">
      <div class="col d-flex align-items-start justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item active fs-6">
            <a routerLink="{{ appRoute.brand.BRAND_LIST }}">Brands</a>
          </li>
        </ul>
        <button class="btn btn-primary cursor-pointer fs-6" color="primary"
          routerLink="{{ appRoute.brand.ADD_BRAND }}">Add brand</button>
      </div>
    </div>
  </div>

  <div class="brand-form-container">
    <form [formGroup]="form">
      <div class="col-12 row align-items-end justify-content-end">
        <div class="search-input col-sm-4" style="padding: 0;">
          <input type="text" placeholder="Search for brands here..." class="form-control fs-6" formControlName="keyword"
            (ngModelChange)="getBrands()">
        </div>
        <div class="search-status col-sm-2">
          <label for="isActive" class="fs-6 mb-1">Status</label>
          <select name="isActive" id="isActive" class="form-select fs-6" formControlName="isActive"
            (change)="getBrands()">
            <option value="" disabled>-- Select an option --</option>
            <option value=true>Active</option>
            <option value=false>Inactive</option>
          </select>
        </div>
        <div class="search-featured col-sm-2">
          <label for="isFeatured" class="fs-6 mb-1">Featured</label>
          <select name="isFeatured" id="isFeatured" class="form-select fs-6" formControlName="isFeatured"
            (change)="getBrands()">
            <option value="" disabled>-- Select an option --</option>
            <option value=true>Featured</option>
            <option value=false>Non featured</option>
          </select>
        </div>
        <div class="search-submit col-sm-2">
          <label class="fs-6 mb-1">&nbsp;</label>
          <input type="button" class="form-control btn-secondary fs-6 text-dark" value="Clear filters"
            (click)="onReload()">
        </div>
      </div>
    </form>
  </div>

  <div class="col-12 d-flex justify-content-between">
    <div class="total-count-container col-sm-3 bg-dark">
      <h4 class="text-white fs-6">Total {{totalCount}} brands</h4>
    </div>
    <div>
      <button class="btn btn-secondary cursor-pointer fs-6" color="primary"
        routerLink="{{ appRoute.brand.ARCHIVED_BRAND }}">Archived Brands</button>
    </div>
  </div>

  <div class="brand-card-container view-container col-12">
    <ng-container *ngFor="let brand of brands">
      <div class="brand-card card-hover">
        <div class="editButton">
          <div routerLink="{{ appRoute.brand.UPDATE_BRAND }}" [queryParams]="{ brand: brand?.slug }">
            <img src="../../../../../assets/icons/editPen.svg" alt="Icon">
          </div>
        </div>

        <div class="brand-image">
          <img src='{{base}}/{{brand?.file}}' alt="brand image" srcset="" />
        </div>

        <div class="brand-details">
          <div class="brand-name fs-4 fw-bolder mb-3">{{brand?.name}}</div>
          <div class="fs-6 brand-featured-{{brand?.isFeatured}}">
            {{brand?.isFeatured ? 'Featured' : 'Not featured'}}
          </div>
          <div class="fs-6 brand-status-{{brand?.isActive}}">
            {{brand?.isActive ? 'Active' : 'Inactive'}}
          </div>
        </div>
      </div>
    </ng-container>
    <ng-container *ngIf="brands.length == 0">
      <div class="emptyNote">
        <div class="fs-3 fw-bolder">No result found</div>
        <div class="fs-6 note">We couldn't find any item based on your search</div>
      </div>
    </ng-container>
  </div>

  <div class="filteringWrapper d-flex align-items-center justify-content-between col-12">
    <div class="filtering">
      <span class="fs-6 text-dark">Show</span>
      <select [formControl]="limit" (change)="getBrands()">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="15">15</option>
        <option value="20">20</option>
        <option value="25">25</option>
      </select>
      <span class="fs-6 text-dark">entries</span>
    </div>
    <div class="pagination">
      <div class="paginationBefore" [ngClass]="{'disabled': page == 1}" (click)="getPreviousPage()">
        <img src="../../../../../assets/icons/navigateBefore.svg" alt="Icon">
      </div>
      <div class="paginationPage">{{page}}</div>
      <div class="paginationNext" [ngClass]="{'disabled': lastPage}" (click)="getNextPage()">
        <img src="../../../../../assets/icons/navigateNext.svg" alt="Icon">
      </div>
    </div>
  </div>

</div>
