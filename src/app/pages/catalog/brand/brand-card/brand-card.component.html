<div>
  <div class="page-header d-flex align-items-start justify-content-between">
    <div>
      <div class="page-title">
        <h1 class="fw-bolder">Brands</h1>
      </div>
      <ul class="breadcrumb">
        <li class="breadcrumb-item fs-6">
          <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
        </li>
        <li class="breadcrumb-item active fs-6">
          <a routerLink="{{ appRoute.brand.BRAND_LIST }}">Brands</a>
        </li>
      </ul>
    </div>
    <div class="gap-2 d-flex align-items-start justify-content-end">
      <button class="btn btn-primary" routerLink="{{ appRoute.brand.ADD_BRAND }}">
        Add brand
      </button>
      <button class="btn btn-secondary" routerLink="{{ appRoute.brand.ARCHIVED_BRAND }}">
        Archived Brands
      </button>
    </div>
  </div>

  <div class="card my-3">
    <div class="card-body">
      <form [formGroup]="form">
        <div class="row align-items-end justify-content-end">
          <div class="col-lg-6">
            <input type="text" placeholder="Search for brands here..." class="form-control fs-6"
              formControlName="keyword" (ngModelChange)="getBrands()">
          </div>
          <div class="col-lg-2">
            <label for="isActive" class="fs-6 mb-1">Status</label>
            <select name="isActive" id="isActive" class="form-select fs-6" formControlName="isActive"
              (change)="getBrands()">
              <option value="" disabled>-- Select an option --</option>
              <option value=true>Active</option>
              <option value=false>Inactive</option>
            </select>
          </div>
          <div class="col-lg-2">
            <label for="isFeatured" class="fs-6 mb-1">Featured</label>
            <select name="isFeatured" id="isFeatured" class="form-select fs-6" formControlName="isFeatured"
              (change)="getBrands()">
              <option value="" disabled>-- Select an option --</option>
              <option value=true>Featured</option>
              <option value=false>Non featured</option>
            </select>
          </div>
          <div class="col-lg-2">
            <label class="fs-6 mb-1">&nbsp;</label>
            <input type="button" class="form-control btn-secondary fs-6 text-dark" value="Clear filters"
              (click)="onReload()">
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="brandsWrapper">
    <ng-container *ngFor="let brand of brands">

      <div class="brandCard">

        <div class="editButton">
          <div routerLink="{{ appRoute.brand.UPDATE_BRAND }}" [queryParams]="{ brand: brand?.slug }">
            <img src="../../../../../assets/icons/editPen.svg" alt="Icon">
          </div>
        </div>

        <img height="60" width="60" class="rounded object-fit-contain me-3" src='{{base}}/{{brand?.thumbnail?.path}}'
          alt="{{brand?.name}}" onerror="this.src = '../../../../../assets/images/default.png'" />

        <div class="brandDetails h-100 d-flex flex-column justify-content-between">
          <div class="fs-5 fw-bolder">{{brand?.name}}</div>
          <div class="d-flex mt-2">
            <div class="fs-6 me-1 alert alert-success p-1" [ngClass]="{'alert-danger': !brand?.isActive}">
              {{brand?.isActive ? 'Active' : 'Inactive'}}
            </div>
            <div class="fs-6 ms-1 alert p-1 alert-info" *ngIf="brand?.isFeatured">
              {{brand?.isFeatured ? 'Featured' : null}}</div>
          </div>
        </div>
      </div>

    </ng-container>
  </div>

  <ng-container *ngIf="brands.length == 0">
    <div class="emptyNote">
      <div class="fs-3 fw-bolder">No result found</div>
      <div class="fs-6 note">We couldn't find any item based on your search</div>
    </div>
  </ng-container>

  <div class="mt-3">
    <app-pagination [totalPages]="totalPages" [totalResults]="totalResults" [pageIndex]="page" [pageSize]="limit"
      (pageTrigger)="onPageTriggered($event)"></app-pagination>
  </div>
</div>
