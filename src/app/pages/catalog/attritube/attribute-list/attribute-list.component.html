<div class="page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="page-title">
      <h1 class="fw-bolder">Attributes</h1>
    </div>
    <div class="row align-items-center">
      <div class="col d-flex flex-row justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.category.CATEGORY_LIST }}">Categories</a>
          </li>
          <li class="breadcrumb-item active fs-6">
            <a routerLink="{{ appRoute.attribute.ATTRIBUTE_LIST }}"
              [queryParams]="{ category: category }">Attributes</a>
          </li>
        </ul>
        <button class="btn btn-primary cursor-pointer fs-6" color="primary"
          routerLink="{{ appRoute.attribute.ADD_ATTRIBUTE }}" [queryParams]="{ category: category }"
          style="width: 200px">
          Add Attribute
        </button>
      </div>
    </div>
  </div>
  <!-- Page Header -->
  <!-- Page Content -->
  <div class="row">
    <div class="col-sm-12">
      <div class="card card-table">
        <div class="card-body">
          <div style="display: none"> {{attributeData.length}}</div>
          <div class="table-responsive" *ngIf="displayTable">
            <table datatable [dtOptions]="dtOptions"
              class="datatable table table-borderless table-center table-row-dashed mb-0">
              <thead class="thead">
                <tr class="fs-7 text-uppercase">
                  <th class="text-gray-400 col-md-2">Sl No.</th>
                  <th class="text-gray-400 col-md-2">Attribute</th>
                  <th class="text-gray-400 col-md-2">Values</th>
                  <th class="text-gray-400 col-md-2">Filtered</th>
                  <th class="text-gray-400 col-md-2">Status</th>
                  <th class="text-gray-400 col-md-2">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let attribute of attributeData; let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>
                    <h2 class="table-avatar fs-6">{{ attribute?.name }}</h2>
                  </td>
                  <td>
                    <div class="attribute-col" *ngIf="attribute?.type == 'text'">
                      <ng-container *ngFor="let value of attribute?.values">
                        <div class="row">
                          <div class="col">
                            <h2 class="attribute-value border bg-secondary text-dark fs-6">{{ value }}</h2>
                          </div>
                        </div>
                      </ng-container>
                    </div>
                    <div class="attribute-col" *ngIf="attribute?.type == 'color'">
                      <ng-container *ngFor="let value of attribute?.values">
                        <div class="row">
                          <div class="col">
                            <div class="color-div" [ngStyle]="{ backgroundColor: value }"></div>
                          </div>
                        </div>
                      </ng-container>
                    </div>
                    <div class="attribute-col" *ngIf="attribute?.type == 'image'">
                      <ng-container *ngFor="let value of attribute?.files">
                        <div class="row">
                          <div class="col">
                            <h2 class="attribute-value attr-images fs-6">
                              <img src="{{base}}/{{value}}" alt="" style="height: 60px; width: 60px">
                            </h2>
                          </div>
                        </div>
                      </ng-container>
                    </div>
                  </td>
                  <td>
                    <ng-container *ngIf="attribute?.isFiltered == true">
                      <div class="text-view">Yes</div>
                    </ng-container>
                    <ng-container *ngIf="attribute?.isFiltered == false">
                      <div class="text-view">No</div>
                    </ng-container>
                  </td>
                  <td>
                    <ng-container *ngIf="attribute?.isActive == true">
                      <div class="active-text-view">
                        <span class="active-text">active</span>
                      </div>
                    </ng-container>
                    <ng-container *ngIf="attribute?.isActive == false">
                      <div class="inactive-text-view">
                        <span class="inactive-text">inactive</span>
                      </div>
                    </ng-container>
                  </td>
                  <td>
                    <a class="fs-6 cursor-pointer text-darker" routerLink="{{ appRoute.attribute.UPDATE_ATTRIBUTE }}"
                      [queryParams]="{category: category, attribute: attribute?.slug}">
                      <i class="bi bi-pen fs-4"></i>Edit
                    </a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Page Content -->
</div>
