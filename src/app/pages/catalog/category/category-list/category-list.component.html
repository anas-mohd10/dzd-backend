<div class="category-page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="page-title">
      <h1 class="fw-bolder">Categories</h1>
    </div>
    <div class="row align-items-center">
      <div class="col d-flex flex-row justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item active fs-6">
            <a routerLink="{{ appRoute.category.CATEGORY_LIST }}">Categories</a>
          </li>
        </ul>
        <button class="btn btn-primary cursor-pointer fs-6" color="primary"
          routerLink="{{ appRoute.category.ADD_CATEGORY }}" style="width: 200px">
          Add Category
        </button>
      </div>
    </div>
  </div>
  <form [formGroup]="categoryForm">
    <div class="col-12 row" style="display: flex; align-items: flex-end;">
      <div class="search-input col-sm-4">
        <label class="fs-6">Search</label>
        <input type="text" placeholder="Search for brands here..." class="form-control fs-6" formControlName="name"
          (ngModelChange)="onChange()">
      </div>
      <div class="search-status col-sm-2">
        <label class="fs-6">Status</label>
        <select name="" id="" class="form-select fs-6" formControlName="isActive" (change)="onChange()">
          <option value="">-- Select an option --</option>
          <option value=true>Active</option>
          <option value=false>Inactive</option>
        </select>
      </div>
      <div class="search-featured col-sm-2">
        <label class="fs-6 form-title">Featured</label>
        <select name="" id="" class="form-select fs-6" formControlName="isFeatured" (change)="onChange()">
          <option value="">-- Select an option --</option>
          <option value=true>Featured</option>
          <option value=false>Non featured</option>
        </select>
      </div>
      <div class="search-submit col-sm-2">
        <button type="button" class="form-control fs-6 bg-secondary text-dark" (click)="onReload()"
          style="outline: none; border: none;">Clear</button>
      </div>
    </div>
  </form>

  <!-- Table start -->
  <div class="row">
    <div class="col-sm-12">
      <div class="card card-table">
        <div class="card-body">
          <div class="table-responsive" >
            <table datatable [dtOptions]="dtOptions"
              class="datatable table table-borderless table-center table-row-dashed mb-0">
              <thead class="thead mt-100">
                <tr class="fs-7 text-uppercase">
                  <th class="text-gray-400 col-md-2">Sl No.</th>
                  <th class="text-gray-400 col-md-2">Category</th>
                  <th class="text-gray-400 col-md-2">Root Category</th>
                  <th class="text-gray-400 col-md-2">Parent Category</th>
                  <th class="text-gray-400 col-md-2">Image</th>
                  <th class="text-gray-400 col-md-2">Attributes</th>
                  <th class="text-gray-400 col-md-2">Status</th>
                  <th class="text-gray-400 col-md-2">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let category of categoryData; let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>
                    <h2 class="table-avatar fs-6">{{ category?.name }}</h2>
                  </td>
                  <ng-container *ngIf="category?.root">
                    <td>
                      <h2 class="table-avatar fs-6">
                        {{ category?.root.name }}
                      </h2>
                    </td>
                  </ng-container>
                  <ng-container *ngIf="category?.parent">
                    <td>
                      <h2 class="table-avatar fs-6">
                        {{ category?.parent.name }}
                      </h2>
                    </td>
                  </ng-container>
                  <ng-container *ngIf="!category?.root">
                    <td>
                      <h2 class="table-avatar fs-6">-</h2>
                    </td>
                  </ng-container>
                  <ng-container *ngIf="!category?.parent">
                    <td>
                      <h2 class="table-avatar fs-6">-</h2>
                    </td>
                  </ng-container>
                  <td>
                    <img class="category-logo" src="{{base}}/{{ category?.file }}" alt="category" />
                  </td>
                  <td>
                    <a routerLink="{{ appRoute.attribute.ATTRIBUTE_LIST }}" [queryParams]="{ category: category?.slug }"
                      class="fs-6 cursor-pointer text-darker">Attributes</a>
                  </td>
                  <td>
                    <ng-container *ngIf="category?.isActive == true">
                      <div class="active-text-view">
                        <span class="active-text"> active </span>
                      </div>
                    </ng-container>
                    <ng-container *ngIf="category?.isActive == false">
                      <div class="inactive-text-view">
                        <span class="inactive-text"> inactive </span>
                      </div>
                    </ng-container>
                  </td>
                  <td>
                    <a class="fs-6 cursor-pointer text-darker" routerLink="{{ appRoute.category.UPDATE_CATEGORY }}"
                      [queryParams]="{ category: category?.slug }"><i class="bi bi-pen fs-4"></i> Edit
                    </a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <ng-container *ngIf="!isData">
    <div class="no-data-container">
      <h2>Sorry, we haven't found any data</h2>
    </div>
  </ng-container>
</div>
