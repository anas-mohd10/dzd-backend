<div>
  <div class="page-header d-flex flex-row align-items-start justify-content-between">
    <div>
      <div class="page-title">
        <h1 class="fw-bold">Categories</h1>
      </div>
      <ul class="breadcrumb">
        <li class="breadcrumb-item fs-6">
          <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
        </li>
        <li class="breadcrumb-item active fs-6">
          <a routerLink="{{ appRoute.category.CATEGORY_LIST }}">Categories</a>
        </li>
      </ul>
    </div>
    <div class="d-flex flex-row align-items-start justify-content-between gap-2">
      <button class="btn btn-primary" routerLink="{{ appRoute.category.ADD_CATEGORY }}">
        Add Category
      </button>
      <button class="btn btn-secondary" routerLink="{{ appRoute.category.ARCHIVED_CATEGORY }}">
        Archived Categories
      </button>
    </div>
  </div>

  <div class="card my-3">
    <div class="card-body">
      <form [formGroup]="form">
        <div class="row align-items-end">
          <div class="col-lg-6">
            <input type="search" placeholder="Search for category here..." class="form-control fs-6"
              formControlName="keyword" (ngModelChange)="getCategories()">
          </div>
          <div class="col-lg-4">
            <label for="isActive" class="fs-6 mb-1">Status</label>
            <select name="isActive" id="isActive" class="form-select fs-6" formControlName="isActive"
              (change)="getCategories()">
              <option value="" disabled>-- Select an option --</option>
              <option value=true>Active</option>
              <option value=false>Inactive</option>
            </select>
          </div>
          <div class="col-lg-2">
            <label class="fs-6 mb-1">&nbsp;</label>
            <input type="button" class="btn w-100 btn-secondary" value="Clear filters" (click)="clearFilters()" />
          </div>
        </div>
      </form>
    </div>
  </div>

  <div>
    <table class="table">
      <thead>
        <th class="p-2">Name</th>
        <th class="p-2">Status</th>
        <th class="p-2">&nbsp;</th>
      </thead>
      <tbody>
        <tr *ngFor="let category of categories">
          <td>
            <div class="d-flex align-items-center gap-2 justify-content-start">
              <img height="40" width="40" class="rounded border border-secondary"
                src="{{base}}{{category?.thumbnail}}" alt="{{category?.name}}"
                onerror="this.src = 'assets/images/default.png'" />
              <div>{{category?.name}}</div>
            </div>
          </td>
          <td>
            <span class="fs-6 me-1 p-1 alert alert-success" [ngClass]="{'alert-danger': !category?.isActive}">
              {{category?.isActive ? 'Active' : 'Inactive'}}
            </span>
          </td>
          <td>
            <div class="cursor-pointer" routerLink="{{appRoute.category.UPDATE_CATEGORY}}" [queryParams]="{'category': category.slug}">
              <svg height="20" width="20" data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor"
                viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z">
                </path>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"></path>
              </svg>
            </div>
          </td>
        </tr>
        <tr *ngIf="categories.length == 0">
          <td colspan="3">
            <app-no-results></app-no-results>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="my-4">
    <app-pagination (pageTrigger)="onPageTriggered($event)" [pageIndex]="page" [pageSize]="limit"
      [totalResults]="totalResults" [totalPages]="totalPages"></app-pagination>
  </div>
</div>
