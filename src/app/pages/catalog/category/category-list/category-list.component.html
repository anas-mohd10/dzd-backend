<div class="category-page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="page-title">
      <h1 class="fw-bolder">Categories</h1>
    </div>
    <div class="row align-items-center">
      <div class="col d-flex flex-row justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-5">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item active fs-5">
            <a routerLink="{{ appRoute.category.CATEGORY_LIST }}">Categories</a>
          </li>
        </ul>
        <button
          class="btn btn-primary cursor-pointer"
          color="primary"
          routerLink="{{ appRoute.category.ADD_CATEGORY }}"
        >
          Add Category
        </button>
      </div>
    </div>
  </div>

  <!-- Table start -->
  <div class="row">
    <div class="col-sm-12">
      <div class="card card-table">
        <div class="card-body">
          <div class="table-responsive">
            <table
              datatable
              [dtOptions]="dtOptions"
              [dtTrigger]="dtTrigger"
              class="table table-center table-striped mb-0 datatable"
            >
              <thead class="thead">
                <tr>
                  <th class="text-dark fw-bolder fs-4">Sl No.</th>
                  <th class="text-dark fw-bolder fs-4">Category</th>
                  <th class="text-dark fw-bolder fs-4">Root Category</th>
                  <th class="text-dark fw-bolder fs-4">Child Category</th>
                  <th class="text-dark fw-bolder fs-4">Logo</th>
                  <th class="text-dark fw-bolder fs-4">Attributes</th>
                  <th class="text-dark fw-bolder fs-4">Status</th>
                  <th class="text-dark fw-bolder fs-4">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let category of categoryData; let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>
                    <h2 class="table-avatar fs-5">{{ category?.name }}</h2>
                  </td>
                  <ng-container *ngIf="category?.rootId">
                    <td>
                      <h2 class="table-avatar fs-5">
                        {{ category?.rootId.name }}
                      </h2>
                    </td>
                  </ng-container>
                  <ng-container *ngIf="category?.parentId">
                    <td>
                      <h2 class="table-avatar fs-5">
                        {{ category?.parentId.name }}
                      </h2>
                    </td>
                  </ng-container>
                  <ng-container *ngIf="!category?.rootId">
                    <td>
                      <h2 class="table-avatar fs-5">-</h2>
                    </td>
                  </ng-container>
                  <ng-container *ngIf="!category?.parentId">
                    <td>
                      <h2 class="table-avatar fs-5">-</h2>
                    </td>
                  </ng-container>
                  <!-- <td>
                    <img
                      class="category-logo"
                      src="{{category?.logo}}"
                      alt="Category Logo"
                    />
                  </td> -->
                  <td>
                    <img
                      class="category-logo"
                      src="../../../../../assets/media/products/11.png"
                      alt="category Logo"
                    />
                  </td>
                  <td>
                    <a
                      routerLink="{{ appRoute.attribute.ATTRIBUTE_LIST }}"
                      [queryParams]="{ category: category?.slug }"
                      class="fs-5 cursor-pointer text-darker"
                      >Attributes</a
                    >
                  </td>
                  <td>
                    <ng-container *ngIf="category?.isActive == true">
                      <h2 class="table-avatar fs-5">Active</h2>
                    </ng-container>
                  </td>
                  <td>
                    <a class="fs-5 cursor-pointer text-darker"> Edit </a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
