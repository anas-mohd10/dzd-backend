<div class="category-page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="row align-items-center">
      <div class="col d-flex flex-row justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-5">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item active fs-5">Category</li>
        </ul>
        <button
          class="btn btn-primary cursor-pointer"
          color="primary"
          routerLink="{{ appRoute.category.ADD_CATEGORY }}"
        >
          Add Category
        </button>
      </div>
    </div>
  </div>

  <!-- Table start -->
  <div class="row">
    <div class="col-sm-12">
      <div class="card card-table">
        <div class="card-body">
          <div class="table-responsive">
            <table
              datatable
              [dtOptions]="dtOptions"
              [dtTrigger]="dtTrigger"
              class="table table-center table-striped mb-0 datatable"
            >
              <thead class="thead">
                <tr>
                  <th class="text-dark fw-bolder fs-5">Sl No.</th>
                  <th class="text-dark fw-bolder fs-5">Category</th>
                  <th class="text-dark fw-bolder fs-5">Logo</th>
                  <th class="text-dark fw-bolder fs-5">Attributes</th>
                  <th class="text-dark fw-bolder fs-5">Status</th>
                  <th class="text-dark fw-bolder fs-5">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let category of categoryData; let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>
                    <h2 class="table-avatar fs-5">{{ category?.name }}</h2>
                  </td>
                  <td>
                    <img
                      class="category-logo"
                      src="{{category?.logo}}"
                      alt="Category Logo"
                    />
                  </td>
                  <td>
                    <a class="fs-5 cursor-pointer text-darker">Attributes</a>
                  </td>
                  <td>
                    <ng-container *ngIf="category?.isActive == true">
                      <h2 class="table-avatar fs-5">Active</h2>
                    </ng-container>
                  </td>
                  <td>
                    <a class="fs-5 cursor-pointer text-darker"> Edit </a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
