<div class="content container-fluid">
  <!-- Page Header -->
  <div class="page-header">
    <div class="row align-items-center">
      <div class="col">
        <h3 class="page-title fs-2">
          {{ editMode ? "Update Product" : "Add Product" }}
        </h3>
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-5">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item fs-5">
            <a routerLink="{{ appRoute.product.PRODUCT_LIST }}">Products</a>
          </li>
          <li class="breadcrumb-item fs-5">
            <a routerLink="{{ appRoute.variantProduct.VARIANT_PRODUCT_LIST }}" [queryParams]="{product: pSlug}">Variant
              Products</a>
          </li>
          <li class="breadcrumb-item active fs-5">
            <a routerLink="{{ appRoute.variantProduct.UPDATE_VARIANT_PRODUCT}}"
              [queryParams]="{product: pSlug, variant: slug}">
              {{ editMode ? "Update Variant Product" : "Add Variant Product"
              }}</a>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <!-- Page Header -->

  <!-- Page Content -->
  <div class="row mt-10">
    <div class="col-sm-12 fs-5">
      <div class="card">
        <div class="card-body">
          <form (ngSubmit)="onSubmit()" [formGroup]="productForm">
            <div class="row">
              <div class="col-12">
                <h5 class="form-title fs-4"><span>Product Details</span></h5>
              </div>

              <!-- Name -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Name</label>
                  <input type="text" class="form-control fs-5" formControlName="name" />
                </div>
              </div>

              <!-- Store Keeping Unit -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Store Keeping Unit</label>
                  <input type="text" class="form-control fs-5" formControlName="sku" />
                </div>
              </div>

              <!-- HSN Number -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">HSN No.</label>
                  <input type="text" class="form-control fs-5" formControlName="hsn" />
                </div>
              </div>

              <!-- MRP Price -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Price (MRP)</label>
                  <div class="input-group mb-3">
                    <span class="input-group-text">Rs.</span>
                    <input type="text" class="form-control" formControlName="mrpPrice" />
                    <span class="input-group-text">.00</span>
                  </div>
                </div>
              </div>

              <!-- Offer Price -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Offer Price</label>
                  <div class="input-group mb-3">
                    <span class="input-group-text">Rs.</span>
                    <input type="text" class="form-control" formControlName="offerPrice" />
                    <span class="input-group-text">.00</span>
                  </div>
                </div>
              </div>

              <!-- Stock -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Stock</label>
                  <input type="number" class="form-control fs-5" formControlName="stock" />
                </div>
              </div>

              <!-- MOQ -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Minimum Order Quantity</label>
                  <input type="text" class="form-control fs-5" formControlName="moq" />
                </div>
              </div>

              <!-- Stock Warning -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Stock Warning</label>
                  <input type="text" class="form-control fs-5" formControlName="stockWarning" />
                </div>
              </div>

              <!-- Description -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Description</label>
                  <textarea class="form-control fs-5" formControlName="description" style="resize: none"
                    id="productdescription" rows="3"></textarea>
                </div>
              </div>


              <!-- Features -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Features</label>
                  <textarea class="form-control fs-5" formControlName="features" style="resize: none"
                    id="featureddescription" rows="3"></textarea>
                </div>
              </div>

              <!-- Category -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Category</label>
                  <select class="form-select" formControlName="categories" (change)="tagCategoryInput()">
                    <option value="example" disabled>
                      -- Select a Category --
                    </option>
                    <option *ngFor="let category of categoryData" value="{{ category?._id }}">
                      {{ category?.name }}
                    </option>
                  </select>
                </div>
                <div class="tag-inputs col-12">
                  <ng-container *ngFor="let category of categoryNames">
                    <span class="tag-input bg-primary text-white">{{ category }}
                      <i class="bi bi-x" (click)="tagCategoryRemove(category)"></i>
                    </span>
                  </ng-container>
                </div>
              </div>

              <!-- Brand -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Brand</label>
                  <select name="brand" formControlName="brandId" class="form-select">
                    <option value="example" disabled>
                      -- Select a Brand --
                    </option>
                    <option *ngFor="let brand of brandData" value="{{ brand?._id }}">
                      {{ brand?.name }}
                    </option>
                  </select>
                </div>
              </div>

              <!-- Additional Button Text -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Additional Button Text</label>
                  <input type="text" class="form-control fs-5" formControlName="additionalbutton" />
                </div>
              </div>

              <!-- Button Redirect Url -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Button Redirect URL</label>
                  <input type="text" class="form-control fs-5" formControlName="buttonredireturl" />
                </div>
              </div>

              <!-- Shipping Method -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Shipping Method</label>
                  <select class="form-select" formControlName="shippingMethod" (change)="checkShippingMethod()">
                    <option value="paid">Paid Shipping</option>
                    <option value="unpaid">Unpaid Shipping</option>
                    <option value="external">External Shipping Service</option>
                  </select>
                </div>
              </div>

              <!-- Shipping Cost -->
              <ng-container *ngIf="isShipping">
                <div class="col-12 col-sm-6">
                  <div class="form-group">
                    <label class="fs-5 mb-3">Shipping Cost </label>
                    <div class="input-group mb-3">
                      <span class="input-group-text">Rs.</span>
                      <input type="text" class="form-control" formControlName="shippingCost" />
                      <span class="input-group-text">.00</span>
                    </div>
                  </div>
                </div>
              </ng-container>

              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Unit</label>
                  <select class="form-select" formControlName="unit">
                    <option value="Check" disabled>
                      -- Select an option --
                    </option>
                    <option value="kg">Kilograms</option>
                    <option value="gms">Grams</option>
                    <option value="number">Number of</option>
                    <option value="pack">Pack of</option>
                  </select>
                </div>
              </div>

              <!-- Weight -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Unit Value</label>
                  <input type="text" class="form-control" formControlName="weight" />
                </div>
              </div>

              <!-- Tax Class -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Tax Class</label>
                  <select class="form-select" formControlName="taxClassId">
                    <option value="example" disabled>
                      -- Select a Tax Class --
                    </option>
                    <option *ngFor="let taxClass of taxClassData" value="{{ taxClass?._id }}">
                      {{ taxClass?.name }}
                    </option>
                  </select>
                </div>
              </div>

              <!-- Search Keywords -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Search Keywords</label>
                  <input class="form-control fs-5" formControlName="searchKeywords" (keyup.Arrowright)="tagInput()" />
                  <div class="tag-inputs col-12">
                    <ng-container *ngFor="let value of valueArray">
                      <span class="mb-10 tag-input bg-primary text-white">{{ value }}
                        <i class="bi bi-x" (click)="tagRemove(value)"></i></span>
                    </ng-container>
                  </div>
                </div>
              </div>

              <!-- Related Products -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Related Products</label>
                  <select class="form-select" formControlName="relatedProducts" (change)="tagProductAdd()">
                    <option value="example" disabled>
                      -- Select Related Products --
                    </option>
                    <option *ngFor="let product of productsData" value="{{ product?._id }}">
                      {{ product?.name }}
                    </option>
                  </select>
                  <div class="tag-inputs col-12">
                    <ng-container *ngFor="let value of relProductNames">
                      <span class="mb-10 tag-input bg-primary text-white">{{ value }}
                        <i class="bi bi-x" (click)="tagProductRemove(value)"></i></span>
                    </ng-container>
                  </div>
                </div>
              </div>

              <!-- Postion -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Position</label>
                  <input type="text" class="form-control fs-5" formControlName="position" />
                </div>
              </div>

              <!-- Featured Product -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Featured Product ?</label>
                  <select class="form-select" formControlName="isFeatured">
                    <option value="Check" disabled>
                      -- Select an option --
                    </option>
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                  </select>
                </div>
              </div>

              <!-- Featured Product -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Active Product ?</label>
                  <select class="form-select" formControlName="isActive">
                    <option value="Check" disabled>
                      -- Select an option --
                    </option>
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                  </select>
                </div>
              </div>

              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">COD Available ?</label>
                  <select class="form-select" formControlName="cod" (change)="checkCod()">
                    <option value="Check" disabled>
                      -- Select an option --
                    </option>
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                  </select>
                </div>
              </div>

              <!-- COD Charge -->
              <ng-container *ngIf="isCod">
                <div class="col-12 col-sm-6">
                  <div class="form-group">
                    <label class="fs-5 mb-3"> COD Charge </label>
                    <div class="input-group mb-3">
                      <span class="input-group-text">Rs.</span>
                      <input type="text" class="form-control" formControlName="codCharge" />
                      <span class="input-group-text">.00</span>
                    </div>
                  </div>
                </div>
              </ng-container>

              <!-- Returnable Product -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Returnable Product ?</label>
                  <select class="form-select" formControlName="returnable" (change)="checkReturnable()">
                    <option value="Check" disabled>
                      -- Select an option --
                    </option>
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                  </select>
                </div>
              </div>

              <!-- Return Days -->
              <ng-container *ngIf="isReturn">
                <div class="col-12 col-sm-6">
                  <div class="form-group">
                    <label class="fs-5 mb-3">Return Days</label>
                    <input type="text" class="form-control fs-5" formControlName="returnDays" />
                  </div>
                </div>
              </ng-container>

              <!-- Product Image -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Product Image</label>
                  <input type="file" class="form-control fs-5" name="image" accept="image/*"
                    (change)="handleInputChange($event)"
                    onchange="document.getElementById('preview').src = window.URL.createObjectURL(this.files[0])"
                    required>
                </div>
                <img id="preview">
              </div>

              <div class="col-12">
                <button type="submit" class="btn btn-primary fs-5">
                  Submit
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- Page Content -->
  </div>
</div>
