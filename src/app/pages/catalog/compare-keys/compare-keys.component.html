<div>
    <div class="page-header d-flex align-items-start justify-content-between">
        <div>
            <div class="page-title">
                <h1 class="fw-bold">Compare Keys</h1>
            </div>
            <ul class="breadcrumb">
                <li class="breadcrumb-item fs-6">
                    <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                </li>
                <li class="breadcrumb-item active fs-6">
                    <a routerLink="{{ appRoute.compareKeys }}">Compare Keys</a>
                </li>
            </ul>
        </div>
    </div>
    <div>
        <div class="card my-4">
            <div class="card-body">
                <div class="d-flex align-items-center justify-content-start gap-4">
                    <div>
                        <app-switch (switchToggled)="onCompareKeyToggle($event)"
                            [isToggledProps]="isCompareEnabled.value || false"
                            [switchId]="'isCompareEnabled'"></app-switch>
                    </div>
                    <div class="fs-5">Compare Products</div>
                </div>
            </div>
        </div>
        <div [ngClass]="{'opacity-50 pe-none': isCompareEnabled.value == false}">
            <div class="fs-3">Store Front Field Keys</div>
            <p class="text-muted">
                Following are product store front field, You can show/hide them on as compare keys.
            </p>
            <div *ngFor="let storeFrontField of storeFrontFields">
                <div class="card my-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-start gap-4">
                            <div>
                                <app-switch (switchToggled)="onSwitchTriggered($event)"
                                    [isToggledProps]="storeFrontField.isCompareKey || false"
                                    [switchId]="storeFrontField.title"></app-switch>
                            </div>
                            <div class="fs-5">{{ storeFrontField.title }}</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
