<div class="update-modal-container-overlay"></div>
<div class="update-modal-container">
   <div class="modal-header">
      <div class="modal-title">Edit Basic Details</div>
      <div class="modal-close-btn" (click)="hideEditModal()"><i class="bi bi-x-lg"></i></div>
   </div>
   <div class="modal-body">
      <div class="modal-form row col-12">
         <form [formGroup]="productheadform" (keydown.Enter)="$event.preventDefault()">
            <div class="row">
               <h2 class="form-title">Basic Details</h2>
               <div class="col-12 col-sm-6 form-group">
                  <label class="fs-6 mb-3 required">Name</label>
                  <input type="text" class="form-control fs-6" placeholder="Eg. iPhone 14 Pro Max"
                     formControlName="name" [ngClass]="{
                'is-invalid': (hf.name.touched || isSubmitted) && hf.name.errors?.required}" />
               </div>
               <div class="col-12 col-sm-6 form-group">
                  <label class="fs-6 mb-3">HSN</label>
                  <input type="text" class="form-control fs-6" formControlName="hsn" />
               </div>
               <div class="col-12 col-sm-6 form-group">
                  <label class="fs-6 mb-3 required">SKU</label>
                  <input type="text" class="form-control fs-6" formControlName="sku" [ngClass]="{
                'is-invalid': (hf.sku.touched || isSubmitted) && hf.sku.errors?.required}" />
               </div>
               <div class="col-12 col-sm-6 form-group">
                  <!-- Product tax-->
                  <label class="fs-6 mb-3 required">Tax</label>
                  <div class="brand-select">
                     <ng-select [items]="taxClassData" bindLabel="name" bindValue="_id" [(ngModel)]="selectedTax"
                        [ngModelOptions]="{standalone: true}" placeholder="Select tax class">
                     </ng-select>
                  </div>
               </div>
               <div class="col-12 col-sm-6 form-group">
                  <!-- Product brand-->
                  <label class="fs-6 mb-3 required">Brand</label>
                  <ng-select [items]="brandData" bindLabel="name" bindValue="_id" [(ngModel)]="selectedBrand"
                     [ngModelOptions]="{standalone: true}" placeholder="Select brand">
                  </ng-select>
               </div>
               <div class="col-12 col-sm-6 form-group">
                  <!-- Product main category-->
                  <label class="fs-6 mb-3 required">Main Category</label>
                  <ng-select [items]="maincategories" bindLabel="name" bindValue="_id"
                     [(ngModel)]="selectedMainCategory" placeholder="Select category" [multiple]=true
                     [ngModelOptions]="{standalone: true}" (change)="mainCategory()">
                  </ng-select>
               </div>
               <div class="col-12 col-sm-6 form-group" *ngIf="showMainCategory">
                  <label class="fs-6 mb-3 required">Default Category</label>
                  <ng-select [items]="defaultcategories" bindLabel="name" bindValue="_id"
                     [(ngModel)]="selectedDefaultCategory" placeholder="Select default category" [multiple]=false
                     [ngModelOptions]="{standalone: true}">
                  </ng-select>
                  <label class="fs-6 mt-3">This category will be used for attributes</label>
               </div>
               <div class="col-12 col-sm-6 form-group">
                  <!-- Product shipping-->
                  <label class="fs-6 mb-3 required">Shipping Method</label>
                  <select class="form-select" formControlName="shippingMethod"
                     (change)="checkShippingMethod($event.target)"
                     [ngClass]="{'is-invalid': (hf.shippingMethod.touched || isSubmitted) && hf.shippingMethod.errors?.required}">
                     <option value="Paid">Paid Shipping</option>
                     <option value="Unpaid">Unpaid Shipping</option>
                     <option value="External">External Shipping Service</option>
                  </select>
               </div>
               <ng-container *ngIf="isShipping">
                  <!-- Product shipping cost -->
                  <div class="col-12 col-sm-6 form-group">
                     <label class="fs-6 mb-3 required">Shipping Cost </label>
                     <div class="input-group mb-3">
                        <span class="input-group-text">Rs.</span>
                        <input type="number" class="form-control" formControlName="shippingCost" />
                        <span class="input-group-text">.00</span>
                     </div>
                  </div>
               </ng-container>
               <div class="col-12 col-sm-6 form-group">
                  <!-- Product COD -->
                  <label class="fs-6 mb-3">COD Available?</label>
                  <select class="form-select" formControlName="cod" (change)="checkCod($event.target)">
                     <option value="Check" disabled>-- Select an option --</option>
                     <option value="true">Yes</option>
                     <option value="false">No</option>
                  </select>
               </div>
               <ng-container *ngIf="isCod">
                  <!-- Product COD cost -->
                  <div class="col-12 col-sm-6">
                     <div class="form-group">
                        <label class="fs-6 mb-3 required"> COD Charge </label>
                        <div class="input-group mb-3">
                           <span class="input-group-text">Rs.</span>
                           <input type="number" class="form-control" formControlName="codCharge" />
                           <span class="input-group-text">.00</span>
                        </div>
                     </div>
                  </div>
               </ng-container>
               <div class="col-12 col-sm-6 form-group">
                  <!-- Product return -->
                  <label class="fs-6 mb-3">Returnable Product?</label>
                  <select class="form-select" formControlName="returnable" (change)="checkReturnable($event.target)">
                     <option value="Check" disabled>-- Select an option --</option>
                     <option value="true">Yes</option>
                     <option value="false">No</option>
                  </select>
               </div>
               <ng-container *ngIf="isReturn">
                  <!-- Product return days-->
                  <div class="col-12 col-sm-6">
                     <div class="form-group">
                        <label class="fs-6 mb-3 required">Return Days</label>
                        <input type="number" class="form-control fs-6" formControlName="returnDays" />
                     </div>
                  </div>
               </ng-container>
               <div class="col-12 col-sm-6 form-group">
                  <label class="fs-6 mb-3">Active Product?</label>
                  <select class="form-select" formControlName="isActive"
                     [ngClass]="{'is-invalid': (hf.isActive.touched || isSubmitted) && hf.isActive.errors?.required}">
                     <option value="Check" disabled>-- Select an option --</option>
                     <option value="true">Yes</option>
                     <option value="false">No</option>
                  </select>
               </div>
               <div class="col-12 col-sm-6 form-group">
                  <label class="fs-6 mb-3">Archive Product?</label>
                  <select class="form-select" formControlName="isArchive"
                     [ngClass]="{'is-invalid': (hf.isActive.touched || isSubmitted) && hf.isActive.errors?.required}">
                     <option value="Check" disabled>-- Select an option --</option>
                     <option value="true">Yes</option>
                     <option value="false">No</option>
                  </select>
               </div>
               <div class="col-12">
                  <!-- Product image -->
                  <div class="col-12">
                     <h2 class="form-title required">Basic Product Image</h2>
                  </div>
                  <div class="col-12 col-sm-6 form-group">
                     <div class="image-upload">
                        <input type="file" class="form-control fs-6" name="image" accept="image/*"
                           (change)="handleInputBasicChange($event)" style="height: 100px;" required>
                        <div class="image-upload-div">
                           <div class="left-img">
                              <img src="../../../../../assets/media/svg/files/upload.svg" alt="" srcset="">
                           </div>
                           <div class="right-text d-flex flex-column">
                              <span class="right-text-title fs-4 fw-bolder">Click to upload</span>
                              <span class="right-text-note fs-7 text-gray-400" style="font-weight: 500">Upload up to
                                 1
                                 file</span>
                           </div>
                        </div>
                     </div>
                     <ng-container *ngIf="loadBasicImage">
                        <div class="col-12 preview-section" style="margin-top: 50px;">
                           <div class="crop-image col-sm-6">
                              <image-cropper class="crop-section" [imageChangedEvent]="imageBasicChangedEvent"
                                 [maintainAspectRatio]="true" [aspectRatio]="3 / 3" [cropperMaxWidth]="500"
                                 [cropperMaxHeight]="500" format="jpeg" (imageCropped)="imageBasicCropped($event)"
                                 (imageLoaded)="basicImageLoaded()" (cropperReady)="cropperBasicReady()"
                                 (loadImageFailed)="loadBasicImageFailed()">
                              </image-cropper>
                           </div>
                           <div class="uploads uploaded col-sm-6">
                              <div class="close-icon">
                                 <i class="bi bi-x-lg text-white" (click)="removeBasicImage()"></i>
                              </div>
                              <img class="preview-img" id="previewImage" [src]="basicImage">
                           </div>
                        </div>
                     </ng-container>
                     <div class="uploaded-image mt-5">
                        <img *ngIf="basicfile != ''" src="{{basicfile}}" alt="" style="width: 150px; height: 150px">
                     </div>
                  </div>
               </div>
            </div>
         </form>
         <div class="col-12 d-flex align-items-center justify-content-end">
            <a (click)="hideEditModal()" class=" btn btn-secondary btn-sm fs-6 text-dark"
               style="width: 200px; margin-right: 20px;">Cancel</a>
            <button type="submit" class="btn btn-primary btn-sm fs-6" style="width: 200px"
               (click)="onSubmit()">Update</button>
         </div>
      </div>
   </div>
</div>
