<div class="row">
    <div class="col-lg-3">
        <div>
            <div class="page-header">
                <div class="page-title">
                    <h1 class="fw-bold">Add products</h1>
                </div>
                <ul class="breadcrumb">
                    <li class="breadcrumb-item fs-6">
                        <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item fs-6">
                        <a routerLink="{{ appRoute.product.ALL_PRODUCTS }}">Products</a>
                    </li>
                    <li class="breadcrumb-item active fs-6">
                        <a routerLink="{{ appRoute.product.ADD_PRODUCT }}">Add products</a>
                    </li>
                </ul>
            </div>
        </div>
        <div class="my-4 card">
            <div class="card-body">
                <div class="fs-4 fw-bold pb-4">Quick Navigation</div>
                <ul class="list-group">
                    <li class="list-group-item cursor-pointer w-100 fs-5 fw-bold border-bottom border-secondary py-4"
                        (click)="toggleTabIndex(1)"
                        [ngClass]="{'text-primary': tabIndex == 1, 'text-muted': tabIndex !== 1}">
                        Basic Details
                    </li>
                    <li class="list-group-item cursor-pointer w-100 fs-5 fw-bold border-bottom border-secondary py-4"
                        (click)="toggleTabIndex(2)"
                        [ngClass]="{'text-primary': tabIndex == 2, 'text-muted': tabIndex !== 2}">
                        Medias
                    </li>
                    <li class="list-group-item cursor-pointer w-100 fs-5 fw-bold py-4" (click)="toggleTabIndex(3)"
                        [ngClass]="{'text-primary': tabIndex == 3, 'text-muted': tabIndex !== 3}">
                        Other Details
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div class="col-lg-9">
        <form [formGroup]="form">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex align-items-center justify-content-between cursor-pointer"
                        (click)="toggleTabIndex(1)">
                        <div class="fs-4 fw-bold">Basic Details</div>
                        <div [ngClass]="{'rotate': tabIndex == 1}">
                            <svg height="18" width="18" data-slot="icon" fill="none" stroke-width="1.5"
                                stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5">
                                </path>
                            </svg>
                        </div>
                    </div>
                    <div class="my-3" [ngClass]="{'d-block': tabIndex == 1, 'd-none': tabIndex != 1}">
                        <div class="mb-3 form-group">
                            <label for="name" class="fs-6 mb-1 required">Name</label>
                            <input type="text" formControlName="name" class="form-control" id="name"
                                placeholder="Type here">
                        </div>
                        <div class="row mb-3">
                            <div class="col-lg-6 form-group">
                                <label for="sku" class="fs-6 mb-1 required">SKU</label>
                                <input type="text" formControlName="sku" class="form-control" id="sku"
                                    placeholder="Type here">
                            </div>
                            <div class="col-lg-6 form-group">
                                <label for="stock" class="fs-6 mb-1 required">Quantity</label>
                                <input type="text" formControlName="stock" class="form-control" id="stock"
                                    placeholder="Type here">
                            </div>
                        </div>

                        <div class="row mb-3" formGroupName="price">
                            <div class="col-lg-6 form-group">
                                <label for="mrp" class="fs-6 mb-1 required">Price</label>
                                <input type="text" formControlName="mrp" class="form-control" id="mrp"
                                    placeholder="Type here">
                            </div>
                            <div class="col-lg-6 form-group">
                                <label for="offer" class="fs-6 mb-1">Discounted Price</label>
                                <input type="text" formControlName="offer" class="form-control" id="offer"
                                    placeholder="Type here">
                            </div>
                        </div>

                        <div>
                            <label for="variants" class="fs-6 mb-1">Variants</label>
                            <div id="variants">
                                <button type="button"
                                    class="btn btn-secondary d-flex align-items-center gap-2 justify-content-center">
                                    <svg height="16" width="16" data-slot="icon" fill="none" stroke-width="1.5"
                                        stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                        aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15">
                                        </path>
                                    </svg>
                                    <div>Add Variants</div>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card my-6">
                <div class="card-body">
                    <div class="d-flex align-items-center justify-content-between cursor-pointer"
                        (click)="toggleTabIndex(2)">
                        <div class="fs-4 fw-bold">Medias</div>
                        <div [ngClass]="{'rotate': tabIndex == 2}">
                            <svg height="18" width="18" data-slot="icon" fill="none" stroke-width="1.5"
                                stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5">
                                </path>
                            </svg>
                        </div>
                    </div>
                    <div class="my-3" [ngClass]="{'d-block': tabIndex == 2, 'd-none': tabIndex != 2}">
                        <div class="form-group">
                            <label for="video" class="fs-6 mb-1">Video</label>
                            <input type="text" formControlName="video" class="form-control" id="video"
                                placeholder="Type here">
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-body">
                    <div class="d-flex align-items-center justify-content-between cursor-pointer"
                        (click)="toggleTabIndex(3)">
                        <div class="fs-4 fw-bold">
                            Other Details</div>
                        <div [ngClass]="{'rotate': tabIndex == 3}">
                            <svg height="18" width="18" data-slot="icon" fill="none" stroke-width="1.5"
                                stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5">
                                </path>
                            </svg>
                        </div>
                    </div>
                    <div class="my-3" [ngClass]="{'d-block': tabIndex == 3, 'd-none': tabIndex != 3}">
                        <div class="row">
                            <div class="col-lg-6 form-group">
                                <label for="hsn" class="fs-6 mb-3">HSN</label>
                                <input type="text" formControlName="hsn" class="form-control" id="hsn"
                                    placeholder="Type here">
                            </div>
                            <div class="col-lg-6 form-group">
                                <label for="tax" class="fs-6 mb-3">Tax</label>
                                <select formControlName="tax" class="form-select" id="tax">
                                    <option value="" selected disabled>-- Select an option --</option>
                                    <option *ngFor="let taxItem of taxItems" value="{{taxItem?._id}}">{{taxItem?.name}}</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="d-flex mt-4 align-items-center justify-content-end">
            <button [disabled]="form.invalid" class="btn btn-primary">Add Product</button>
        </div>
    </div>
</div>
