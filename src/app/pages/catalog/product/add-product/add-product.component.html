<div class="content container-fluid">
  <div class="page-header">
    <div class="row align-items-center">
      <div class="col">
        <h3 class="page-title fs-2">
          {{ editMode ? "Update Product" : "Add Product" }}
        </h3>
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-5">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item fs-5">
            <a routerLink="{{ appRoute.product.PRODUCT_LIST }}">Products</a>
          </li>
          <li class="breadcrumb-item active fs-5">
            <a routerLink="{{ appRoute.product.ADD_PRODUCT}}">
              {{ editMode ? "Update Product" : "Add Product"}}</a>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <div class="row mt-10">
    <div class="col-sm-12 fs-5">
      <div class="card">
        <div class="card-body">
          <nav>
            <div class="nav nav-tabs" id="nav-tab" role="tablist">
              <button class="nav-link" [ngClass]="{'active': !headAdded}" id="nav-home-tab" data-bs-toggle="tab"
                data-bs-target="#basic-details" type="button" role="tab" aria-controls="nav-home"
                aria-selected="true">Basic Details</button>
              <button class="nav-link" [ngClass]="{'active': headAdded}" id="nav-profile-tab" data-bs-toggle="tab"
                data-bs-target="#product-details" type="button" role="tab" aria-controls="nav-profile"
                aria-selected="false">Product Details</button>
              <button class="nav-link" id="nav-contact-tab" data-bs-toggle="tab" data-bs-target="#media" type="button"
                role="tab" aria-controls="nav-contact" aria-selected="false">Media</button>
            </div>
          </nav>
          <div class="tab-content" id="nav-tabContent">
            <div class="tab-pane fade show basic-details-container" [ngClass]="{'active': !headAdded}"
              id="basic-details" role="tabpanel" aria-labelledby="nav-home-tab">
              <form [formGroup]="productheadform" (keydown.Enter)="$event.preventDefault()">
                <div class="row">
                  <h2 class="form-title">Basic Details</h2>
                  <div class="col-12 col-sm-6 form-group"> <!-- Product name-->
                    <label class="fs-5 mb-3 required">Name</label>
                    <input type="text" class="form-control fs-5" formControlName="name" [ngClass]="{
                    'is-invalid': (hf.name.touched || isSubmitted) && hf.name.errors?.required}" />
                  </div>
                  <div class="col-12 col-sm-6 form-group"> <!-- Product name-->
                    <label class="fs-5 mb-3 required">HSN</label>
                    <input type="text" class="form-control fs-5" formControlName="hsn" [ngClass]="{
                    'is-invalid': (hf.hsn.touched || isSubmitted) && hf.hsn.errors?.required}" />
                  </div>
                  <div class="col-12 col-sm-6 form-group"> <!-- Product tax-->
                    <label class="fs-5 mb-3 required">Tax</label>
                    <div class="brand-select">
                      <ng-select [items]="taxClassData" bindLabel="name" bindValue="_id" [(ngModel)]="selectedTax"
                        [ngModelOptions]="{standalone: true}" placeholder="Select tax class">
                      </ng-select>
                    </div>
                  </div>
                  <div class="col-12 col-sm-6 form-group"> <!-- Product brand-->
                    <label class="fs-5 mb-3 required">Brand</label>
                    <ng-select [items]="brandData" bindLabel="name" bindValue="_id" [(ngModel)]="selectedBrand"
                      [ngModelOptions]="{standalone: true}" placeholder="Select brand">
                    </ng-select>
                  </div>
                  <div class="col-12 col-sm-6 form-group"> <!-- Product main category-->
                    <label class="fs-5 mb-3 required">Main Category</label>
                    <ng-select [items]="maincategories" bindLabel="name" bindValue="_id"
                      [(ngModel)]="selectedMainCategory" placeholder="Select category" [multiple]=true
                      [ngModelOptions]="{standalone: true}" (change)="mainCategory()">
                    </ng-select>
                  </div>
                  <div class="col-12 col-sm-6 form-group" *ngIf="showMainCategory">
                    <label class="fs-5 mb-3 required">Default Category</label>
                    <ng-select [items]="parentCategory" bindLabel="name" bindValue="id"
                      [(ngModel)]="selectedDefaultCategory" placeholder="Select default category" [multiple]=false
                      [ngModelOptions]="{standalone: true}">
                    </ng-select>
                    <label class="fs-6 mt-3">This category will be used for attributes</label>
                  </div>
                  <div class="col-12 col-sm-6 form-group"> <!-- Product shipping-->
                    <label class="fs-5 mb-3 required">Shipping Method</label>
                    <select class="form-select" formControlName="shippingMethod"
                      (change)="checkShippingMethod($event.target)"
                      [ngClass]="{'is-invalid': (hf.shippingMethod.touched || isSubmitted) && hf.shippingMethod.errors?.required}">
                      <option value="Paid">Paid Shipping</option>
                      <option value="Unpaid">Unpaid Shipping</option>
                      <option value="External">External Shipping Service</option>
                    </select>
                  </div>
                  <ng-container *ngIf="isShipping"> <!-- Product shipping cost -->
                    <div class="col-12 col-sm-6 form-group">
                      <label class="fs-5 mb-3 required">Shipping Cost </label>
                      <div class="input-group mb-3">
                        <span class="input-group-text">Rs.</span>
                        <input type="number" class="form-control" formControlName="shippingCost" />
                        <span class="input-group-text">.00</span>
                      </div>
                    </div>
                  </ng-container>
                  <div class="col-12 col-sm-6 form-group"> <!-- Product COD -->
                    <label class="fs-5 mb-3">COD Available?</label>
                    <select class="form-select" formControlName="cod" (change)="checkCod($event.target)">
                      <option value="Check" disabled>-- Select an option --</option>
                      <option value="true">Yes</option>
                      <option value="false">No</option>
                    </select>
                  </div>
                  <ng-container *ngIf="isCod"> <!-- Product COD cost -->
                    <div class="col-12 col-sm-6">
                      <div class="form-group">
                        <label class="fs-5 mb-3 required"> COD Charge </label>
                        <div class="input-group mb-3">
                          <span class="input-group-text">Rs.</span>
                          <input type="number" class="form-control" formControlName="codCharge" />
                          <span class="input-group-text">.00</span>
                        </div>
                      </div>
                    </div>
                  </ng-container>
                  <div class="col-12 col-sm-6 form-group"> <!-- Product return -->
                    <label class="fs-5 mb-3">Returnable Product?</label>
                    <select class="form-select" formControlName="returnable" (change)="checkReturnable($event.target)">
                      <option value="Check" disabled>-- Select an option --</option>
                      <option value="true">Yes</option>
                      <option value="false">No</option>
                    </select>
                  </div>
                  <ng-container *ngIf="isReturn"> <!-- Product return days-->
                    <div class="col-12 col-sm-6">
                      <div class="form-group">
                        <label class="fs-5 mb-3 required">Return Days</label>
                        <input type="number" class="form-control fs-5" formControlName="returnDays" />
                      </div>
                    </div>
                  </ng-container>
                  <div class="col-12"> <!-- Product image -->
                    <div class="col-12">
                      <h2 class="form-title required">Basic Product Image</h2>
                    </div>
                    <div class="col-12 col-sm-6 form-group">
                      <div class="image-upload">
                        <input type="file" class="form-control fs-5" name="image" accept="image/*"
                          (change)="handleInputBasicChange($event)" style="height: 100px;" required>
                        <div class="image-upload-div">
                          <div class="left-img">
                            <img src="../../../../../assets/media/svg/files/upload.svg" alt="" srcset="">
                          </div>
                          <div class="right-text d-flex flex-column">
                            <span class="right-text-title fs-4 fw-bolder">Click to upload</span>
                            <span class="right-text-note fs-7 text-gray-400" style="font-weight: 500">Upload up to 1
                              file</span>
                          </div>
                        </div>
                      </div>
                      <ng-container *ngIf="loadBasicImage">
                        <div class="col-12 preview-section" style="margin-top: 50px;">
                          <div class="crop-image col-sm-6">
                            <image-cropper class="crop-section" [imageChangedEvent]="imageBasicChangedEvent"
                              [maintainAspectRatio]="true" [aspectRatio]="3 / 3" [cropperMaxWidth]="500"
                              [cropperMaxHeight]="500" format="jpeg" (imageCropped)="imageBasicCropped($event)"
                              (imageLoaded)="basicImageLoaded()" (cropperReady)="cropperBasicReady()"
                              (loadImageFailed)="loadBasicImageFailed()">
                            </image-cropper>
                          </div>
                          <div class="uploads uploaded col-sm-6">
                            <div class="close-icon">
                              <i class="bi bi-x-lg text-white" (click)="removeBasicImage()"></i>
                            </div>
                            <img class="preview-img" id="previewImage" [src]="basicImage">
                          </div>
                        </div>
                      </ng-container>
                      <div class="col-12" *ngIf="imageFiles.length != 0">
                        <div class="products-image-container">
                          <ng-container *ngFor="let image of imageFiles">
                            <div class="products-image-card col-sm-3">
                              <div class="products-image">
                                <img class="product-preview" [src]="image?.url" alt="" srcset="">
                              </div>
                              <div class="products-delete-icon" (click)="removeFile(image?.id)">
                                <i class="bi bi-x-lg"></i>
                              </div>
                            </div>
                          </ng-container>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </form>
              <div class="col-12 d-flex align-items-center justify-content-end">
                <a routerLink="{{ appRoute.product.PRODUCT_LIST}}" class=" btn btn-secondary btn-sm fs-5 text-dark"
                  style="width: 200px; margin-right: 20px;">Cancel</a>
                <button *ngIf="!headAdded" type="submit" class="btn btn-primary btn-sm fs-5" style="width: 200px"
                  (click)="addHead()">Add</button>
                <button *ngIf="headAdded" type="submit" class="btn btn-primary btn-sm fs-5" style="width: 200px"
                  (click)="updateHead()">Update</button>
              </div>
            </div>
            <div class="tab-pane fade" [ngClass]="{'active': headAdded}" id="product-details" role="tabpanel"
              aria-labelledby="nav-profile-tab">
              Product details</div>
            <div class="tab-pane fade" id="Media" role="tabpanel" aria-labelledby="nav-contact-tab">
              Media
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Page Content -->
  </div>
</div>
