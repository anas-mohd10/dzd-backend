<div>
  <div class="page-header d-flex align-items-start justify-content-between">
    <div>
      <div class="page-title">
        <h1 class="fw-bold">Returns</h1>
      </div>
      <ul class="breadcrumb">
        <li class="breadcrumb-item fs-6">
          <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
        </li>
        <li class="breadcrumb-item active fs-6">
          <a routerLink="{{ appRoute.returns }}">Returns</a>
        </li>
      </ul>
    </div>
  </div>

  <div class="card my-4">
    <div class="card-body">
      <div class="row d-flex justify-content-end align-items-end">
        <div class="col-lg-3">
          <input id="date" name="date" type="text" placeholder="Select start date" class="form-control" bsDatepicker
            [bsConfig]="{
              isAnimated: true,
              dateInputFormat: 'DD-MM-YYYY',
              containerClass: 'theme-dark-blue'
            }" [(ngModel)]="startDate" (ngModelChange)="getReturns()" />
        </div>
        <div class="col-lg-3">
          <input id="date" name="date" type="text" placeholder="Select end date" class="form-control" bsDatepicker
            [bsConfig]="{
              isAnimated: true,
              dateInputFormat: 'DD-MM-YYYY',
              containerClass: 'theme-dark-blue'
            }" [(ngModel)]="endDate" (ngModelChange)="getReturns()" />
        </div>
        <div class="col-lg-2">
          <input type="button" class="btn w-100 btn-secondary" value="Clear filters" (click)="clear()" />
        </div>
        <div class="col-lg-4">
          <input type="search" class="form-control" placeholder="Search orders" [formControl]="keyword"
            (ngModelChange)="getReturns()" />
        </div>
      </div>
    </div>
  </div>

  <div>
    <table class="table table-head-custom table-vertical-center table-head-bg table-borderless">
      <thead>
        <tr>
          <th>Order</th>
          <th>Customer</th>
          <th>Date</th>
          <th>Total</th>
          <th class="text-center">Accepted</th>
          <th class="text-center">Rejected</th>
          <th class="text-center">Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody class="fs-6">
        <ng-container *ngFor="let return of returns; let i = index">
          <tr>
            <td>{{ return?.order?.orderNo }}</td>
            <td class="product">{{ return?.product?.name }}</td>
            <td>{{ return?.createdAt }}</td>
            <td>{{ return?.returnAmount }}</td>
            <td class="text-center">
              <div *ngIf="return?.isAccepted == true">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#228B22"
                  class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                  <path
                    d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z" />
                </svg>
              </div>
              <div *ngIf="return?.isAccepted == false">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                  class="bi bi-hourglass-split" viewBox="0 0 16 16">
                  <path
                    d="M2.5 15a.5.5 0 1 1 0-1h1v-1a4.5 4.5 0 0 1 2.557-4.06c.29-.139.443-.377.443-.59v-.7c0-.213-.154-.451-.443-.59A4.5 4.5 0 0 1 3.5 3V2h-1a.5.5 0 0 1 0-1h11a.5.5 0 0 1 0 1h-1v1a4.5 4.5 0 0 1-2.557 4.06c-.29.139-.443.377-.443.59v.7c0 .213.154.451.443.59A4.5 4.5 0 0 1 12.5 13v1h1a.5.5 0 0 1 0 1zm2-13v1c0 .537.12 1.045.337 1.5h6.326c.216-.455.337-.963.337-1.5V2zm3 6.35c0 .701-.478 1.236-1.011 1.492A3.5 3.5 0 0 0 4.5 13s.866-1.299 3-1.48zm1 0v3.17c2.134.181 3 1.48 3 1.48a3.5 3.5 0 0 0-1.989-3.158C8.978 9.586 8.5 9.052 8.5 8.351z" />
                </svg>
              </div>
            </td>
            <td class="text-center">
              <div *ngIf="return?.isRejected == true">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#C70039"
                  class="bi bi-x-circle-fill" viewBox="0 0 16 16">
                  <path
                    d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293z" />
                </svg>
              </div>
              <div *ngIf="return?.isRejected == false">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                  class="bi bi-hourglass-split" viewBox="0 0 16 16">
                  <path
                    d="M2.5 15a.5.5 0 1 1 0-1h1v-1a4.5 4.5 0 0 1 2.557-4.06c.29-.139.443-.377.443-.59v-.7c0-.213-.154-.451-.443-.59A4.5 4.5 0 0 1 3.5 3V2h-1a.5.5 0 0 1 0-1h11a.5.5 0 0 1 0 1h-1v1a4.5 4.5 0 0 1-2.557 4.06c-.29.139-.443.377-.443.59v.7c0 .213.154.451.443.59A4.5 4.5 0 0 1 12.5 13v1h1a.5.5 0 0 1 0 1zm2-13v1c0 .537.12 1.045.337 1.5h6.326c.216-.455.337-.963.337-1.5V2zm3 6.35c0 .701-.478 1.236-1.011 1.492A3.5 3.5 0 0 0 4.5 13s.866-1.299 3-1.48zm1 0v3.17c2.134.181 3 1.48 3 1.48a3.5 3.5 0 0 0-1.989-3.158C8.978 9.586 8.5 9.052 8.5 8.351z" />
                </svg>
              </div>
            </td>
            <td class="text-center">
              <p [ngClass]="{
                  refunded: return?.isRefunded == true,
                  pending: return?.isRefunded == false
                }" class="p-1 rounded">
                {{ return?.isRefunded == true ? "Refunded" : "Pending" }}
              </p>
            </td>
            <td routerLink="{{ appRoute.returns + '/' + return?.reference }}">
              <img src="assets/icons/editPen.svg" alt="Icon" />
            </td>
          </tr>
        </ng-container>
        <tr *ngIf="returns.length == 0">
          <td colspan="8">
            <app-no-results></app-no-results>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="my-4">
    <app-pagination (pageTrigger)="onPageTriggered($event)" [pageSize]="limit" [pageIndex]="page"
      [totalPages]="totalPages" [totalResults]="totalResults"></app-pagination>
  </div>
</div>
