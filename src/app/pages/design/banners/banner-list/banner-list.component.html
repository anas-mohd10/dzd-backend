<div class="brand-page-container">
   <div class="page-header">
      <div class="page-title">
         <h1 class="fw-bolder">Banners</h1>
      </div>
      <div class="row">
         <div class="col d-flex align-items-start justify-content-between">
            <ul class="breadcrumb">
               <li class="breadcrumb-item fs-6">
                  <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
               </li>
               <li class="breadcrumb-item active fs-6">
                  <a routerLink="{{ appRoute.banner.BANNER_LIST}}">Banners</a>
               </li>
            </ul>
            <button class="btn btn-primary cursor-pointer fs-6" color="primary"
               routerLink="{{ appRoute.banner.ADD_BANNER }}">
               Add Banners
            </button>
         </div>
      </div>
   </div>

   <div class="total-count-container col-sm-3 bg-dark" *ngIf="count != 0">
      <h4 class="text-white fs-6">Total {{totalcount ? totalcount : 0}} banners</h4>
   </div>

   <div class="banner-card-container view-container col-12">
      <ng-container *ngFor="let banner of banners">
         <div class="banner-card card-hover editable-{{banner?.isEditable}}"
            [ngClass]="{'inactive-banner': !banner?.isActive, 'active-banner': banner?.isActive}">
            <div class="banner-card-left">
               <div class="wrapperBox">
                  <div>
                     <div class="banner-title fs-6">{{banner?.title ? banner?.title : '-'}}</div>
                     <div class="banner-from fs-6">Valid From {{banner?.validFrom}}</div>
                     <div class="banner-till fs-6">Valid To {{banner?.validTo}}</div>
                  </div>
                  <div>
                     <div class="card-edit-btn" [routerLink]="appRoute.banner.UPDATE_BANNER"
                        [queryParams]="{banner: banner?.bannerid}">
                        <img src="../../../../../assets/icons/editPen.svg" alt="Icon">
                     </div>
                     <div class="banner-status fs-6 active" *ngIf="banner?.isActive">Active</div>
                     <div class="banner-status fs-6 inactive" *ngIf="!banner?.isActive">Inactive</div>
                  </div>
               </div>
            </div>
            <div class="banner-card-right">
               <ng-container *ngFor="let banner of banner?.files?.mobile">
                  <div class="banner-mobile-image">
                     <img src="{{base}}/{{banner}}" alt="mobile banner">
                  </div>
               </ng-container>
            </div>
         </div>
      </ng-container>
      <ng-container *ngIf="count == 0">
         <div class="no-data-container">
            <div class="no-data-image"><img src="../../../../../assets/media/searching.svg" alt="" srcset=""></div>
            <h2 class="fw-bolder">Sorry, we haven't found any data</h2>
         </div>
      </ng-container>
   </div>

   <nav aria-label="Page navigation example" *ngIf="count != 0">
      <ul class="pagination-container">
         <div class="page-change-icon" *ngIf="selectedpage != 1 &&  selectedpage > 0">
            <a class="page-link" (click)="loadPrevious()" aria-label="Previous">
               <i class="bi bi-arrow-left-circle"></i>
            </a>
         </div>
         <div class="page-change-icon" *ngIf="selectedpage == 1">
            <a class="page-link page-link-disabled" aria-label="Previous">
               <i class="bi bi-arrow-left-circle"></i>
            </a>
         </div>
         <li class="page-item" *ngFor="let key of pages">
            <a *ngIf="selectedpage != key" class="page-link" (click)="fetchBanner(key, limit)">{{key}}</a>
            <a *ngIf="selectedpage == key" class="page-link page-active" (click)="fetchBanner(key, limit)">{{key}}</a>
         </li>
         <div class="page-change-icon" *ngIf="selectedpage != totaldata">
            <a class="page-link" (click)="loadNext()" aria-label="Next">
               <i class="bi bi-arrow-right-circle"></i>
            </a>
         </div>
         <div class="page-change-icon" *ngIf="selectedpage == totaldata">
            <a class="page-link page-link-disabled" aria-label="Next">
               <i class="bi bi-arrow-right-circle"></i>
            </a>
         </div>
      </ul>
   </nav>
</div>
