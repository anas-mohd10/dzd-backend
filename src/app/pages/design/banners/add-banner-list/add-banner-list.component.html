<div class="content container-fluid">
   <div class="page-header">
      <div class="row align-items-center">
         <div class="col">
            <h3 class="page-title fw-bolder fs-2">
               {{ editMode ? "Update Banners" : "Add Banners" }}
            </h3>
            <ul class="breadcrumb fw-bolder">
               <li class="breadcrumb-item fs-5">
                  <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
               </li>
               <li class="breadcrumb-item fs-5">
                  <a routerLink="{{ appRoute.banner.BANNER_LIST}}">Banners</a>
               </li>
               <li class="breadcrumb-item active fs-5">
                  <a routerLink="{{ appRoute.banner.ADD_BANNER }}">
                     {{ editMode ? "Update Banners" : "Add Banners"}}
                  </a>
               </li>
            </ul>
         </div>
      </div>
   </div>
   <div class="row mt-10">
      <div class="col-sm-12 fs-5">
         <div class="card">
            <div class="card-body">
               <form (ngSubmit)="onSubmit()" [formGroup]="bannerForm" enctype="multipart/form-data">
                  <div class="row">
                     <h2 class="form-title">Banner Details</h2>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-5 mb-3 form-title">Title</label>
                           <input type="text" class="form-control fs-5" formControlName="title" [ngClass]="{
                              'is-invalid':
                              (hf.title.touched || isSubmitted) &&
                              hf.title.errors?.required
                            }" />
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-5 mb-3 form-title required">Valid From</label>
                           <input type="date" class="form-control fs-5" formControlName="validFrom"
                              [ngClass]="{'is-invalid': (hf.validFrom.touched || isSubmitted) &&  hf.validFrom.errors?.required}" />
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-5 mb-3 form-title required">Valid To</label>
                           <input type="date" class="form-control fs-5" formControlName="validTo"
                              [ngClass]="{ 'is-invalid': (hf.validTo.touched || isSubmitted) && hf.validTo.errors?.required }" />
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-5 mb-3 form-title">Redirection URL</label>
                           <input type="text" class="form-control fs-5" formControlName="redirectURL" />
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-5 mb-3 form-title">Active Banner?</label>
                           <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg"
                              formControlName="isActive">
                              <option value="" disabled>-- Select an option --</option>
                              <option value="true">Active</option>
                              <option value="false">Inactive</option>
                           </select>
                        </div>
                     </div>
                     <div class="col-12">
                        <div class="col-12">
                           <h2 class="form-title required">Media</h2>
                        </div>
                     </div>
                     <!-- Web banner starts -->
                     <div class="web-banner-title col-sm-6">
                        <div class="form-group">
                           <div class="image-upload">
                              <input type="file" class="form-control fs-5" name="image" accept="image/*"
                                 (change)="handleInputChange($event, 'web')" style="height: 100px;" required>
                              <label class="fs-7 text-disabled">Please upload an banner with 1200px * 600px</label>
                              <div class="image-upload-div">
                                 <div class="left-img">
                                    <img src="../../../../../assets/media/svg/files/upload.svg" alt="" srcset="">
                                 </div>
                                 <div class="right-text d-flex flex-column">
                                    <span class="right-text-title fs-4 fw-bolder">Click to upload</span>
                                    <span class="right-text-note fs-7 text-gray-400" style="font-weight: 500">
                                       Upload up to 1 file
                                    </span>
                                 </div>

                              </div>
                           </div>

                        </div>
                        <ng-container *ngIf="webLoadImage">
                           <div class="col-12 preview-section">
                              <div class="crop-image col-sm-6">
                                 <image-cropper class="crop-section" [imageChangedEvent]="imageWebChangedEvent"
                                    [maintainAspectRatio]="true" [aspectRatio]="2 / 1" [cropperMaxWidth]="4000"
                                    [cropperMaxHeight]="2000" format="png" (imageCropped)="imageCroppedWeb($event)"
                                    (imageLoaded)="imageWebLoaded()" (cropperReady)="cropperWebReady()"
                                    (loadImageFailed)="loadImageWebFailed()">
                                 </image-cropper>
                              </div>
                              <div class="uploads uploaded col-sm-6">
                                 <div class="close-icon">
                                    <i class="bi bi-x-lg text-white" (click)="removeImage('web')"></i>
                                 </div>
                                 <img class="preview-img" id="previewImage" [src]="web_file">
                              </div>
                           </div>
                        </ng-container>
                     </div>
                     <!-- Web banner ends -->

                     <!-- Mobile banner starts -->
                     <div class="mobile-banner-title col-sm-6">
                        <div class="form-group">
                           <div class="image-upload">
                              <input type="file" class="form-control fs-5" name="image" accept="image/*"
                                 (change)="handleInputChange($event, 'mobile')" style="height: 100px;" required>
                              <label class="fs-7 text-disabled">Please upload a Mobile banner with 600px * 300px</label>
                              <div class="image-upload-div">
                                 <div class="left-img">
                                    <img src="../../../../../assets/media/svg/files/upload.svg" alt="" srcset="">
                                 </div>
                                 <div class="right-text d-flex flex-column">
                                    <span class="right-text-title fs-4 fw-bolder">Click to upload</span>
                                    <span class="right-text-note fs-7 text-gray-400" style="font-weight: 500">
                                       Upload up to 1 file
                                    </span>
                                 </div>
                              </div>
                           </div>
                        </div>
                        <ng-container *ngIf="mobileLoadImage">
                           <div class="col-12 preview-section">
                              <div class="crop-image col-sm-6">
                                 <image-cropper class="crop-section" [imageChangedEvent]="imageMobileChangedEvent "
                                    [maintainAspectRatio]="true" [aspectRatio]="6 / 3" [cropperMaxWidth]="600"
                                    [cropperMaxHeight]="300" format="png" (imageCropped)="imageCroppedMobile($event)"
                                    (imageLoaded)="imageMobileLoaded()" (cropperReady)="cropperMobileReady()"
                                    (loadImageFailed)="loadImageMobileFailed()">
                                 </image-cropper>
                              </div>
                              <div class="uploads uploaded col-sm-6">
                                 <div class="close-icon">
                                    <i class="bi bi-x-lg text-white" (click)="removeImage('mobile')"></i>
                                 </div>
                                 <img class="preview-img" id="previewImage" [src]="mobile_file">
                              </div>
                           </div>
                        </ng-container>
                     </div>
                     <!-- Mobile banner ends -->

                     <div class="col-12 d-flex align-items-center justify-content-end mt-20">
                        <a routerLink="{{ appRoute.banner.BANNER_LIST }}"
                           class=" btn btn-secondary btn-sm fs-5 text-dark fw-bolder"
                           style="width: 200px; margin-right: 20px;">
                           Cancel
                        </a>
                        <button type="submit" class="btn btn-primary btn-sm fs-5" style="width: 200px">
                           Add
                        </button>
                     </div>

                  </div>
               </form>
            </div>
         </div>
      </div>
   </div>
</div>
