<div class="voucher-page-container">
  <div class="page-header">
    <div class="page-title">
      <h1 class="fw-bolder">Vouchers</h1>
    </div>
    <div class="row align-items-center">
      <div class="col d-flex flex-row justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-5">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item active fs-5">
            <a routerLink="{{ appRoute.vouchers.VOUCHERS_LIST }}">Vouchers</a>
          </li>
        </ul>
        <button class="btn btn-primary cursor-pointer fs-5" color="primary" style="width: 200px;"
          routerLink="{{ appRoute.vouchers.ADD_VOUCHERS_LIST }}" style="width: 200px">
          Add Voucher
        </button>
      </div>
    </div>
  </div>
  <hr class="horizontal-line">
  <div class="voucher-form-container">
    <form [formGroup]="voucherform">
      <div class="col-12 row" style="display: flex; align-items: flex-end;">
        <div class="search-input col-sm-2">
          <label class="fs-5">Search</label>
          <input type="text" placeholder="Search for vouchers here..." class="form-control fs-5" formControlName="title"
            (ngModelChange)="searchVoucher()">
        </div>
        <div class="search-status col-sm-2">
          <label class="fs-5">Status</label>
          <select name="" id="" class="form-select fs-5" formControlName="isActive" (change)="searchVoucher()">
            <option value="">Select an option</option>
            <option value=true>Active</option>
            <option value=false>Inactive</option>
          </select>
        </div>
        <div class="search-featured col-sm-2">
          <label class="fs-5 form-title">From Date</label>
          <input type="date" class="form-control fs-5" formControlName="fromDate" (change)="searchVoucher()">
        </div>
        <div class="search-featured col-sm-2">
          <label class="fs-5 form-title">To Date</label>
          <input type="date" class="form-control fs-5" formControlName="lastDate" (change)="searchVoucher()">
        </div>
        <div class="search-submit col-sm-2">
          <button type="button" class="form-control fs-5 bg-secondary text-dark" (click)="onReload()"
            style="outline: none; border: none;">Clear</button>
        </div>
      </div>
    </form>
  </div>
  <div class="applied-filters-container">
    <ng-container *ngFor="let filter of filters">
      {{filter}}
    </ng-container>
  </div>
  <hr class="horizontal-line">
  <div class="total-count-container" *ngIf="count != 0">
    <h3>{{totalcount}} vouchers</h3>
  </div>
  <div class="voucher-card-container view-container">
    <ng-container *ngFor="let voucher of vouchers">
      <div class="voucher-card">
        <div class="voucher-details">
          <div class="inner-voucher-details">
            <div class="voucher-image">
              <img src='{{base}}/{{voucher?.file}}' alt="voucher image" srcset="" />
            </div>
            <div class="voucher-name-details">
              <div class="voucher-name">{{voucher?.title}}</div>
              <div class="voucher-discount">{{voucher?.type}} <span>{{voucher?.value}}</span></div>
              <div class="voucher-from-date">From : <span>{{voucher?.fromDate}}</span></div>
              <div class="voucher-last-date">To : <span>{{voucher?.lastDate}}</span></div>
            </div>
          </div>
        </div>
        <div class="voucher-card-right">
          <div class="inner-voucher-card-right">
            <div class="voucher-code">
              Voucher Code <span>{{voucher?.code}}</span>
            </div>
            <div class="voucher-status-{{voucher?.isActive}}">
              <ng-container *ngIf="voucher?.isActive == true">Active</ng-container>
              <ng-container *ngIf="voucher?.isActive == false">Inactive</ng-container>
            </div>
            <div class="card-edit-btn voucher-edit-btn">
              <button routerLink="{{ appRoute.vouchers.UPDATE_VOUCHERS_LIST }}" [queryParams]="{ voucher: voucher?.slug }"
                class="fs-5 cursor-pointer text-darker">
                Edit
              </button>
            </div>
          </div>
        </div>
      </div>
    </ng-container>
    <ng-container *ngIf="count == 0">
      <div class="no-data-container">
        <h2>Sorry, we haven't found any data</h2>
      </div>
    </ng-container>
  </div>
  <!-- Pagination start -->
  <nav aria-label="Page navigation example" *ngIf="count != 0">
    <ul class="pagination-container">
      <div class="page-change-icon" *ngIf="selectedpage != 1 &&  selectedpage > 0">
        <a class="page-link" (click)="loadPrevious()" aria-label="Previous">
          <i class="bi bi-arrow-left-circle"></i>
        </a>
      </div>
      <div class="page-change-icon" *ngIf="selectedpage == 1">
        <a class="page-link page-link-disabled" aria-label="Previous">
          <i class="bi bi-arrow-left-circle"></i>
        </a>
      </div>
      <li class="page-item" *ngFor="let key of pages">
        <a *ngIf="selectedpage != key" class="page-link" (click)="fetchVoucher(key, limit)">{{key}}</a>
        <a *ngIf="selectedpage == key" class="page-link page-active" (click)="fetchVoucher(key, limit)">{{key}}</a>
      </li>
      <div class="page-change-icon" *ngIf="selectedpage != totaldata">
        <a class="page-link" (click)="loadNext()" aria-label="Next">
          <i class="bi bi-arrow-right-circle"></i>
        </a>
      </div>
      <div class="page-change-icon" *ngIf="selectedpage == totaldata">
        <a class="page-link page-link-disabled" aria-label="Next">
          <i class="bi bi-arrow-right-circle"></i>
        </a>
      </div>
    </ul>
  </nav>
  <!-- Pagination end -->
</div>
