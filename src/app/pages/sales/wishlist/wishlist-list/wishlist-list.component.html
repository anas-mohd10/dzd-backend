<div class="wislist-page-container">
    <div class="page-header">
        <div class="page-title">
            <h1 class="fw-bolder">Wishlist</h1>
        </div>
        <div class="row">
            <div class="col d-flex align-items-start justify-content-between">
                <ul class="breadcrumb">
                    <li class="breadcrumb-item fs-6">
                        <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item active fs-6">
                        <a routerLink="{{ appRoute.wishlist.LIST }}">Wishlist</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="card card-table">
            <div class="card-body">

                <div class="row d-flex align-items-center justify-content-end mb-2">
                    <div class="col-lg-4">
                        <label class="form-label">&nbsp;</label>
                        <input type="text" class="form-control" placeholder="Search customers here"
                            [formControl]="keyword" (ngModelChange)="searchCustomers()">
                    </div>
                    <div class="col-lg-2">
                        <label class="fs-6 mb-1">&nbsp;</label>
                        <input type="button" class="btn btn-secondary" value="Clear filters"
                            (click)="clearFilters()">
                    </div>
                </div>

                <div class="table-responsive">

                    <table class="table table-head-custom table-vertical-center table-head-bg table-borderless"
                        *ngIf="customers.length > 0">

                        <thead class="common_thead">
                            <tr class="text-left fs-6 text-gray-400">
                                <th style="min-width: 120px">&nbsp;</th>
                                <th style="min-width: 100px">Name</th>
                                <th style="min-width: 100px">Mobile</th>
                                <th style="min-width: 100px">Email</th>
                                <th style="min-width: 100px">Products</th>
                                <th style="min-width: 100px">Action</th>
                            </tr>
                        </thead>

                        <tbody class="fs-6">
                            <ng-container *ngFor="let customer of customers; let i = index">
                                <tr>
                                    <td>{{i+1}}</td>
                                    <td>{{customer?.name}}</td>
                                    <td>{{customer?.mobile}}</td>
                                    <td>{{customer?.email}}</td>
                                    <td>{{customer?.products}}</td>
                                    <td>
                                        <button class="w-100 fs-6 btn btn-secondary btn-sm"
                                            routerLink="{{appRoute.wishlist.DETAILS}}"
                                            [queryParams]="{user: customer?.userid}">
                                            View details
                                        </button>
                                    </td>
                                </tr>
                            </ng-container>
                        </tbody>

                    </table>

                    <div *ngIf="customers.length == 0">
                        <div class="emptyNote">
                            <img src="../../../../../../assets/icons/empty.gif" alt="Icon">
                            <div class="fs-3 fw-bolder">No result found</div>
                            <div class="fs-5 note">We couldn't find any item based on your search.</div>
                        </div>
                    </div>

                    <div class="filteringWrapper d-flex align-items-center justify-content-between col-12">
                        <div class="filtering">
                            <span class="fs-6 text-dark">Show</span>
                            <select [formControl]="limit" (change)="searchCustomers()">
                                <option value="5">5</option>
                                <option value="10">10</option>
                                <option value="15">15</option>
                                <option value="20">20</option>
                                <option value="25">25</option>
                            </select>
                            <span class="fs-6 text-dark">entries</span>
                        </div>
                        <div class="filteringResultCount fs-6">
                            Showing <span class="me-1 ms-1">{{customers.length}}</span> of <span
                                class="ms-1">{{totalResults}}</span>
                        </div>
                        <div class="pagination">
                            <div class="paginationBefore" [ngClass]="{'disabled': page == 1}"
                                (click)="getPreviousPage()">
                                <img src="../../../../../assets/icons/navigateBefore.svg" alt="Icon">
                            </div>
                            <div class="paginationPage">{{page}}</div>
                            <div class="paginationNext" [ngClass]="{'disabled': isLastPage}" (click)="getNextPage()">
                                <img src="../../../../../assets/icons/navigateNext.svg" alt="Icon">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
