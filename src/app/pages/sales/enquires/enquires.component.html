<div>
  <div class="page-header d-flex align-items-start justify-content-between">
    <div>
      <div class="page-title">
        <h1 class="fw-bold">Enquires</h1>
      </div>
      <ul class="breadcrumb">
        <li class="breadcrumb-item fs-6">
          <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
        </li>
        <li class="breadcrumb-item active fs-6">
          <a routerLink="{{ appRoute.enquires.ENQUIRY_LIST }}">Enquires</a>
        </li>
      </ul>
    </div>
  </div>

  <div class="my-4 card">
    <div class="card-body">
      <div class="form-group">
        <input type="search" placeholder="Search enquiries here" [formControl]="keyword" class="form-control"
          (ngModelChange)="getEnquiries()">
      </div>
    </div>
  </div>

  <div>
    <table class="table">
      <thead>
        <th class="p-2">Name</th>
        <th class="p-2">Phone</th>
        <th class="p-2">Email</th>
        <th class="p-2">Date</th>
        <th class="p-2">Attachment</th>
        <th class="p-2">&nbsp;</th>
      </thead>
      <tbody>
        <tr *ngFor="let enquiry of enquires">
          <td>{{ enquiry.firstname }} {{ enquiry.lastname }}</td>
          <td>{{ enquiry.countryCode }} {{ enquiry.mobile }}</td>
          <td>{{ enquiry.email }}</td>
          <td>{{ enquiry.date | date:'d/M/yyyy, h:mm:ss a' }}</td>
          <td>
            <a *ngIf="enquiry.attachment" [href]="enquiry.attachment" target="_blank" rel="noopener noreferrer"
              class="text-primary" title="Download attachment">
              📎
            </a>
            <span *ngIf="!enquiry.attachment" class="text-muted">—</span>
          </td>
          <td>
            <div (click)="open(template, enquiry)" class="cursor-pointer">
              <svg height="18" width="18" data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"></path>
              </svg>
            </div>
          </td>
        </tr>
        <tr *ngIf="enquires.length == 0">
          <td colspan="5">
            <app-no-results></app-no-results>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="my-4">
    <app-pagination (pageTrigger)="onPageTriggered($event)" [pageSize]="limit" [pageIndex]="page"
      [totalPages]="totalPages" [totalResults]="totalResults"></app-pagination>
  </div>
</div>

<ng-template #template>
  <div class="modal-header">
    <h4 class="fs-2 fw-bold pull-left">Enquiry Details</h4>
    <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="modalRef?.hide()">
      <span aria-hidden="true" class="visually-hidden">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <div class="row">
      <div class="col-lg-6 mb-3 form-group">
        <label class="form-label">Name</label>
        <input class="form-control" value="{{enquiry.firstname + ' ' + (enquiry.lastname ? enquiry.lastname : '')}}" />
      </div>
      <div class="col-lg-6 mb-3 form-group">
        <label class="form-label">Phone</label>
        <input class="form-control" value="{{enquiry.countryCode + ' ' + enquiry.mobile}}" />
      </div>
      <div class="col-lg-6 mb-3 form-group">
        <label class="form-label">Mail Id</label>
        <input class="form-control" value="{{enquiry.email}}" />
      </div>
      <div class="col-lg-6 mb-3 form-group">
        <label class="form-label">Date and Time</label>
        <input class="form-control" value="{{enquiry.date | date:'d/M/yyyy, h:mm:ss a'}}" />
      </div>
      <div class="col-lg-6 mb-3 form-group" *ngIf="enquiry.attachment">
        <label class="form-label">Attachment</label>
        <div>
          <a [href]="enquiry.attachment" target="_blank" rel="noopener noreferrer"
            class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-1">
            <span>📎</span> Download Attachment
          </a>
        </div>
      </div>
      <div class="col-lg-12 form-group">
        <label for="message" class="form-label">Message</label>
        <textarea name="message" id="message" value={{enquiry.message}} rows="10" class="form-control"></textarea>
      </div>
    </div>
  </div>
</ng-template>
