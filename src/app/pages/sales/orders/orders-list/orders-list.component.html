<div class="brand-page-container">
   <div class="page-header">
      <div class="page-title">
         <h1 class="fw-bolder">Orders</h1>
      </div>
      <div class="row align-items-center">
         <div class="col d-flex flex-row justify-content-between">
            <ul class="breadcrumb">
               <li class="breadcrumb-item fs-5">
                  <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
               </li>
               <li class="breadcrumb-item active fs-5">
                  <a routerLink="{{ appRoute.orders.ORDERS_LIST }}">Orders</a>
               </li>
            </ul>
            <button class="btn btn-primary cursor-pointer fs-5" color="primary"
               routerLink="{{ appRoute.orders.ADD_ORDER_LIST }}">
               Add Orders
            </button>
         </div>
      </div>
   </div>

   <div class="top-form-container">
      <div class="row order-cards">
         <div class="col-lg-3">
            <app-stats-widget5 svgIcon="./assets/media/icons/duotune/ecommerce/ecm008.svg"
               class="card bg-white hoverable card-xl-stretch mb-xl-5" color="white" iconColor="primary"
               title="{{totalOrders}}" description="Total Orders">
            </app-stats-widget5>
         </div>
         <div class="col-lg-3">
            <app-stats-widget5 svgIcon="./assets/media/icons/duotune/finance/fin008.svg"
               class="card bg-white hoverable card-xl-stretch mb-xl-5" color="white" iconColor="primary" title="7"
               description="Total Revenue">
            </app-stats-widget5>
         </div>
         <div class="col-lg-3">
            <app-stats-widget5 svgIcon="./assets/media/icons/duotune/finance/fin001.svg"
               class="card bg-white hoverable card-xl-stretch mb-xl-5" color="white" iconColor="primary" title="7"
               description="Average Sales">
            </app-stats-widget5>
         </div>
      </div>
      <form action="" (ngSubmit)="onSubmit()">
         <div class="row align-items-end">
            <div class="col-12 col-sm-2 align-items-center justify-content-evenly">
               <label class="col-sm-2 col-form-label">From</label>
               <div class="form-group">
                  <input type="date" class="form-control" name="" id="">
               </div>
            </div>
            <div class="col-12 col-sm-2 align-items-center justify-content-evenly">
               <label class="col-sm-2 col-form-label">To</label>
               <div class="form-group">
                  <input type="date" class="form-control" name="" id="">
               </div>
            </div>
            <div class="col-12 col-sm-2 align-items-center justify-content-evenly">
               <label class="col-sm-2 col-form-label">Payment</label>
               <div class="form-group">
                  <select class="form-select form-select-lg" aria-label=".form-select-lg" formControlName="valueType">
                     <option value="check" disabled>
                        -- Select An Option --
                     </option>
                     <option value="All" selected>All</option>
                     <option value="COD">COD</option>
                     <option value="Online">Online</option>
                  </select>
               </div>
            </div>
            <div class="col-12 col-sm-2 align-items-center justify-content-evenly">
               <label class="col-sm-2 col-form-label">Status</label>
               <div class="form-group">
                  <select class="form-select form-select-lg" aria-label=".form-select-lg" formControlName="valueType">
                     <option value="check" disabled>
                        -- Select An Option --
                     </option>
                     <option value="All" selected>All</option>
                     <option value="Accepted">Accepted</option>
                     <option value="Pending">Pending</option>
                     <option value="Placed" selected>Placed</option>
                     <option value="Packed">Packed</option>
                     <option value="Shipped">Shipped</option>
                     <option value="Delivered">Delivered</option>
                     <option value="Cancelled">Cancelled</option>
                  </select>
               </div>
            </div>
            <div class="col-12 col-sm-2">
               <button type="submit" class="btn btn-primary btn-submit fs-5">
                  Apply
               </button>
            </div>
         </div>
      </form>
   </div>
   <div class="row">
      <div class="col-sm-12">
         <div class="card card-table">
            <div class="card-body">
               <!-- <div style="display: none"> {{rolesData.length}}</div> -->
               <div class="table-responsive">
                  <table datatable [dtOptions]="dtOptions"
                     class="datatable table table-borderless table-center table-striped mb-0">
                     <thead class="thead mt-100">
                        <tr>
                           <th class="text-dark fs-4 col-md-2">Sl No.</th>
                           <th class="text-dark fs-4 col-md-2">Order No.</th>
                           <th class="text-dark fs-4 col-md-2">Order Date</th>
                           <th class="text-dark fs-4 col-md-2">Customer</th>
                           <th class="text-dark fs-4 col-md-2">Email</th>
                           <th class="text-dark fs-4 col-md-2">Grand Total</th>
                           <th class="text-dark fs-4 col-md-2">Payment Method</th>
                           <th class="text-dark fs-4 col-md-2">Status</th>
                           <th class="text-dark fs-4 col-md-2">Action</th>
                        </tr>
                     </thead>
                  </table>
               </div>
            </div>
         </div>
      </div>
   </div>
</div>
