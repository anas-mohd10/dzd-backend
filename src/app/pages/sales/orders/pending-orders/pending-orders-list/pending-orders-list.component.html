<div class="brand-page-container">
   <div class="page-header">
      <div class="page-title">
         <h1 class="fw-bolder">Pending Orders</h1>
      </div>
      <div class="row align-items-center">
         <div class="col d-flex flex-row justify-content-between">
            <ul class="breadcrumb">
               <li class="breadcrumb-item fs-6">
                  <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
               </li>
               <li class="breadcrumb-item active fs-6">
                  <a routerLink="{{ appRoute.orders.PENDING_ORDERS_LIST }}">Pending Orders</a>
               </li>
            </ul>
            <button class="btn btn-primary cursor-pointer fs-6" color="primary"
               routerLink="{{ appRoute.orders.ADD_ORDER_LIST }}" style="width: 200px">
               Add Orders
            </button>
         </div>
      </div>
   </div>
   <div class="top-form-container">
      <form action="" (ngSubmit)="onSubmit()" [formGroup]="orderForm">
         <div class="row align-items-end">
            <div class="col-12 col-sm-2 align-items-center justify-content-evenly">
               <label class="col-sm-2 col-form-label">From</label>
               <div class="form-group">
                  <input type="date" class="form-control fs-7" formControlName="fromDate" id="">
               </div>
            </div>
            <div class="col-12 col-sm-2 align-items-center justify-content-evenly">
               <label class="col-sm-2 col-form-label">To</label>
               <div class="form-group">
                  <input type="date" class="form-control fs-7" formControlName="toDate" id="" (change)="checkToDate()">
               </div>
            </div>
            <div class="col-12 col-sm-2 align-items-center justify-content-evenly">
               <label class="col-sm-2 col-form-label">Payment</label>
               <div class="form-group">
                  <select class="form-select form-select-lg fs-7" aria-label=".form-select-lg"
                     formControlName="paymentMethod">
                     <option value="check" disabled>
                        -- Select An Option --
                     </option>
                     <option value="COD" class="fs-7">COD</option>
                     <option value="ONLINE" class="fs-7">Online</option>
                     <option value="CASH" class="fs-7">Cash</option>
                     <option value="UNPAID" class="fs-7">Unpaid</option>
                     <option value="SPLIT" class="fs-7">Split</option>
                  </select>
               </div>
            </div>
            <div class="col-12 col-sm-2">
               <a (click)="reloadPage()" class=" btn btn-secondary fs-6 text-dark"
                  style="width: 200px; margin-right: 20px;">
                  Reset
               </a>
            </div>
            <div class="col-12 col-sm-2">
               <button type="submit" class="btn btn-primary btn-submit fs-6" style="width: 200px;">
                  Apply
               </button>
            </div>
         </div>
      </form>
   </div>
</div>
