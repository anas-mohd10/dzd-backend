<div class="content container-fluid">
   <div class="page-header">
      <div class="row align-items-center">
         <div class="col">
            <h3 class="page-title fw-bolder fs-2">
               {{ editMode ? "Update Orders" : "Add Orders" }}
            </h3>
            <ul class="breadcrumb">
               <li class="breadcrumb-item fs-6">
                  <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
               </li>
               <li class="breadcrumb-item fs-6">
                  <a routerLink="{{ appRoute.orders.ORDERS_LIST}}">Orders</a>
               </li>
               <li class="breadcrumb-item active fs-6">
                  <a routerLink="{{ appRoute.orders.ADD_ORDER_LIST}}">
                     {{ editMode ? "Update Orders" : "Add Orders"}}
                  </a>
               </li>
            </ul>
         </div>
      </div>
   </div>
   <div class="row mt-10">
      <div class="col-sm-12 fs-6">
         <div class="card">
            <div class="card-body">
               <form (ngSubmit)="onSubmit()" [formGroup]="orderForm">
                  <div class="row">
                     <div class="col-12">
                        <h5 class="form-title fs-4"><span>Orders Details</span></h5>
                     </div>
                     <div class="col-12">
                        <div class="form-group col-sm-6">
                           <label class="fs-6 mb-3 form-title required">Customer</label>
                           <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg"
                              formControlName="customer" (change)="getAddress()"
                              [ngClass]="{ 'is-invalid': (of.customer.touched || isSubmitted) && of.customer.errors?.required}">
                              <option value="disabled" disabled>-- Select an option --</option>
                              <option *ngFor="let cust of activeCustomersData" value="{{[cust?._id, cust?.slug]}}">
                                 {{cust?.firstname}}
                              </option>
                           </select>
                        </div>
                     </div>
                     <div class="col-12">
                        <h5 class="form-title fs-4"><span>Address Details</span></h5>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-6 mb-3 form-title required"> Address Line 1</label>
                           <input type="text" class="form-control fs-6" formControlName="firstline" [ngClass]="{
                                 'is-invalid':
                                 (of.firstline.touched || isSubmitted) &&
                                 of.firstline.errors?.required
                               }" />
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-6 mb-3"> Address Line 2</label>
                           <input type="text" class="form-control fs-6" formControlName="secondline" />
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-6 mb-3"> Area</label>
                           <input type="text" class="form-control fs-6" formControlName="area" />
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-6 mb-3 form-title required"> City</label>
                           <input type="text" class="form-control fs-6" formControlName="city" [ngClass]="{
                                 'is-invalid':
                                 (of.city.touched || isSubmitted) &&
                                 of.city.errors?.required
                               }" />
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-6 mb-3 form-title required"> Landmark</label>
                           <input type="text" class="form-control fs-6" formControlName="landmark" [ngClass]="{
                                 'is-invalid':
                                 (of.landmark.touched || isSubmitted) &&
                                 of.landmark.errors?.required
                               }" />
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-6 mb-3 form-title required"> Pincode</label>
                           <input type="text" class="form-control fs-6" formControlName="pincode" [ngClass]="{
                                 'is-invalid':
                                 (of.pincode.touched || isSubmitted) &&
                                 of.pincode.errors?.required
                               }" />
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-6 mb-3 form-title"> Latitude</label>
                           <input type="text" class="form-control fs-6" formControlName="lat" />
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-6 mb-3 form-title"> Longitude</label>
                           <input type="text" class="form-control fs-6" formControlName="lng" />
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-6 mb-3 form-title required">State</label>
                           <select class="form-select form-select-lg mb-3 fs-6" aria-label=".form-select-lg"
                              formControlName="state">
                              <option value="" disabled>-- Select an option --</option>
                              <option value="Kerala">Kerala</option>
                              <option value="Karnataka">Karnataka</option>
                              <option value="Tamilnadu">Tamilnadu</option>
                              <option value="Goa">Goa</option>
                              <option value="Maharastra">Maharastra</option>
                              <option value="Gujarat">Gujarat</option>
                           </select>
                        </div>
                     </div>
                     <div class="col-12">
                        <h5 class="form-title fs-4"><span>Other Details</span></h5>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-6 mb-3 form-title required">Payment Method</label>
                           <select class="form-select form-select-lg mb-3 fs-6" aria-label=".form-select-lg"
                              formControlName="paymentMethod"
                              [ngClass]="{ 'is-invalid': (of.paymentMethod.touched || isSubmitted) && of.paymentMethod.errors?.required}">
                              <option value="disabled" disabled>-- Select an option --</option>
                              <option value="CASH">Cash</option>
                              <option value="SPLIT">Split</option>
                              <option value="CARD">Card</option>
                              <option value="UNPAID">Unpaid</option>
                              <option value="ONLINE">Online</option>
                           </select>
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-6 mb-3 form-title">Coupon</label>
                           <select class="form-select form-select-lg mb-3 fs-6" aria-label=".form-select-lg"
                              formControlName="coupon">
                              <option value="disabled" disabled>-- Select an option --</option>
                              <option *ngFor="let coupon of activeCoupons" value="{{coupon?._id}}">
                                 {{coupon?.title}}
                              </option>
                           </select>
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-6 mb-3">GST No.</label>
                           <input type="text" formControlName="gst" class="form-control fs-6">
                        </div>
                     </div>
                     <div class="product-add-container" formArrayName="products">
                        <div class="col-12 d-flex align-items-center justify-content-between">
                           <h5 class="form-title fs-4">
                              <span>Products Details</span>
                           </h5>
                           <button type="button" (click)="addQuantity()" class="btn btn-dark text-white"
                              style="width: 200px">
                              Add Product
                           </button>
                        </div>
                        <div class="col-12" *ngFor="let product of products().controls; let i=index" [formGroupName]="i"
                           style="margin-top: 40px">
                           <div class="col-12 col-sm-6">
                              <div class="form-group">
                                 <label class="fs-6 mb-3 form-title required">Product</label>
                                 <select class="form-select form-select-lg fs-6" aria-label=".form-select-lg"
                                    formControlName="productId">
                                    <option value="disabled" disabled>-- Select an option --</option>
                                    <option *ngFor="let prod of activeProducts" value="{{prod?._id}}">
                                       {{prod?.name}}
                                    </option>
                                 </select>
                              </div>
                           </div>
                           <div class="col-12 col-sm-6">
                              <label class="fs-6 mb-3 form-title required">Quantity</label>
                              <div class="form-group d-flex align-items-center">
                                 <input type="text" class="form-control fs-6" id="quantity" formControlName="quantity">
                              </div>
                           </div>
                           <div class="col-12">
                              <button type="button" (click)="removeQuantity(i)" class="btn btn-danger"
                                 style="width: 200px">Remove
                              </button>
                           </div>
                           <hr style="height: 1px; width: 100%; background: #aaaaaa">
                        </div>
                     </div>
                     <div class="col-12">
                        <a routerLink="{{ appRoute.orders.ORDERS_LIST}}" class="btn btn-secondary btn-sm fs-6 text-dark"
                           style="width: 200px; margin-right: 20px;">
                           Cancel
                        </a>
                        <button type="submit" class="btn btn-primary btn-sm fs-6" style="width: 200px">
                           Submit
                        </button>
                     </div>
                  </div>
               </form>
            </div>
         </div>
      </div>
   </div>
</div>
