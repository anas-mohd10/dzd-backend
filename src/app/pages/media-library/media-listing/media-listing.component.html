<div class="profilePageContainer">
    <div class="page-header">
        <div class="page-title">
            <h1 class="fw-bold">Media library</h1>
        </div>
        <div class="row">
            <div class="col d-flex align-items-start justify-content-between">
                <ul class="breadcrumb">
                    <li class="breadcrumb-item fs-6">
                        <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item active fs-6">
                        <a routerLink="{{ appRoute.mediaLibrary }}">Media library</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="card my-4">
        <div class="card-body">
            <div class="medias-wrapper">
                <ng-container *ngFor="let media of medias">
                    <div class="media">
                        <img src="{{base}}/{{media.path}}" alt={{media.altTitle}}>
                        <div class="p-3 details">
                            <div>{{media.title}}</div>
                        </div>
                    </div>
                </ng-container>
            </div>
        </div>
    </div>
</div>
