<div class="modal fade show d-block" tabindex="-1" role="dialog" aria-labelledby="mediaDeleteModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="mediaDeleteModalLabel">Media Deletion Warning</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="onCancelDelete()"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-warning d-flex align-items-center" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          <div>
            <strong *ngIf="!isRelatedFromCheck">Warning!</strong>
            <strong *ngIf="isRelatedFromCheck">Cannot Delete! </strong>
            <span *ngIf="isRelatedFromCheck"> This media is related to products</span>
          </div>
        </div>
      
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancelDelete()">
          <i class="bi bi-x-circle me-1"></i> Cancel
        </button>
        <button type="button" class="btn btn-danger" (click)="onConfirmDelete()">
          <i class="bi bi-trash me-1"></i>Delete
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade show"></div>
