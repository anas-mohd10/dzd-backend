<div class="brand-page-container">
   <div class="page-header">
      <div class="page-title">
         <h1 class="fw-bolder">Customers</h1>
      </div>
      <div class="row align-items-center">
         <div class="col d-flex align-items-start justify-content-between">
            <ul class="breadcrumb">
               <li class="breadcrumb-item fs-6">
                  <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
               </li>
               <li class="breadcrumb-item active fs-6">
                  <a routerLink="{{ appRoute.customers.CUSTOMERS_LIST}}">Customers</a>
               </li>
            </ul>
            <div>
               <button class="btn btn-secondary cursor-pointer fs-6" color="primary"
                  style="width: 200px; margin: 0 10px 0 0;">
                  Export Customers
               </button>
               <button class="btn btn-primary cursor-pointer fs-6" color="primary"
                  routerLink="{{ appRoute.customers.ADD_CUSTOMERS_LIST }}" style="width: 200px">
                  Add Customers
               </button>
            </div>
         </div>
      </div>
   </div>
   <div class="row">
      <div class="col-sm-12">
         <div class="card card-table">
            <div class="card-body">
               <div class="table-responsive">
                  <div class="pb-5">
                     <div class="row d-flex justify-content-end align-items-end">
                        <div class="col-2">
                           <label class="form-label">&nbsp;</label>
                           <input type="text" class="form-control" placeholder="Search items here"
                              [formControl]="keyword" (ngModelChange)="getCustomers()">
                        </div>
                        <div class="col-2">
                           <label class="fs-6 mb-1">Status</label>
                           <select class="form-select fs-6 text-dark" [formControl]="isActive"
                              (change)="getCustomers()">
                              <option value="" disabled>-- Select an option --</option>
                              <option value=false>Inactive</option>
                              <option value=true>Active</option>
                           </select>
                        </div>
                        <div class="col-2">
                           <label class="fs-6 mb-1">&nbsp;</label>
                           <input type="button" class="btn btn-secondary" value="Clear filters" (click)="clearFilter()">
                        </div>
                     </div>
                  </div>

                  <table class="table table-head-custom table-vertical-center table-head-bg table-borderless"
                     *ngIf="customers.length > 0">
                     <thead class="common_thead">
                        <tr class="text-left fs-6 text-gray-400">
                           <th style="min-width: 120px">&nbsp;</th>
                           <th style="min-width: 120px">Name</th>
                           <th style="min-width: 100px">Email</th>
                           <th style="min-width: 100px">Mobile</th>
                           <th style="min-width: 100px">Status</th>
                           <th style="min-width: 100px">&nbsp;</th>
                        </tr>
                     </thead>
                     <tbody class="fs-6">
                        <ng-container *ngFor="let customer of customers; let i =index">
                           <tr>
                              <td>{{i + 1}}</td>
                              <td>{{customer?.name}}</td>
                              <td>{{customer?.email}}</td>
                              <td>{{customer?.mobile}}</td>
                              <td>
                                 <span class="active fs-6" [ngClass]="{'inactive': !customer?.isActive}">
                                    {{customer?.isActive ? 'Active' : 'Inactive'}}
                                 </span>
                              </td>
                              <td routerLink="{{appRoute.customers.UPDATE_CUSTOMERS_LIST}}"
                                 [queryParams]="{'customer': customer?.userid}">
                                 <img src="../../../../../assets/icons/editPen.svg" alt="Icon">
                              </td>
                           </tr>
                        </ng-container>
                     </tbody>
                  </table>

                  <div *ngIf="customers.length == 0">
                     <div class="emptyNote">
                        <img src="../../../../../../assets/icons/empty.gif" alt="Icon">
                        <div class="fs-3 fw-bolder">No result found</div>
                        <div class="fs-5 note">We couldn't find any item based on your search.</div>
                     </div>
                  </div>


                  <div class="filteringWrapper d-flex align-items-center justify-content-between"
                     *ngIf="customers.length > 0">
                     <div class="filtering">
                        <span class="fs-6 text-dark">Show</span>
                        <select [formControl]="limit" (change)="getCustomers()">
                           <option value="5">5</option>
                           <option value="10">10</option>
                           <option value="15">15</option>
                           <option value="20">20</option>
                           <option value="25">25</option>
                        </select>
                        <span class="fs-6 text-dark">entries</span>
                     </div>
                     <div class="pagination">
                        <div class="paginationBefore" [ngClass]="{'disabled': page == 1}" (click)="getPreviousPage()">
                           <img src="../../../../../../assets/icons/navigateBefore.svg" alt="Icon">
                        </div>
                        <div class="paginationPage">{{page}}</div>
                        <div class="paginationNext" [ngClass]="{'disabled': lastPage}" (click)="getNextPage()">
                           <img src="../../../../../../assets/icons/navigateNext.svg" alt="Icon">
                        </div>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </div>
</div>
