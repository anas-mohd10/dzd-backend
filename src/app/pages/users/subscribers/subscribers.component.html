<div>
    <div class="page-header d-flex align-items-start justify-content-between">
        <div>
            <div class="page-title">
                <h1 class="fw-bold">User alerts</h1>
            </div>
            <ul class="breadcrumb">
                <li class="breadcrumb-item fs-6">
                    <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                </li>
                <li class="breadcrumb-item active fs-6">
                    <a routerLink="{{ appRoute.subscribers.SUBSCRIBERS_LIST}}">User alerts</a>
                </li>
            </ul>
        </div>
        <button class="btn btn-secondary cursor-pointer fs-6 w-200 d-flex align-items-center justify-content-center"
            color="primary" (click)="exportSubscribers()">
            <div class="me-3">
                <svg height="20px" width="20px" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 13.5l3 3m0 0l3-3m-3 3v-6m1.06-4.19l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z">
                    </path>
                </svg>
            </div>
            <div class="h-20">Export Subscribers</div>
        </button>
    </div>

    <div class="card my-4">
        <div class="card-body">
            <div class="form-group">
                <input type="search" class="form-control" placeholder="Search subscribers here" [formControl]="keyword"
                    (ngModelChange)="getSubscribers()">
            </div>
        </div>
    </div>

    <div>
        <table class="table table-head-custom table-vertical-center table-head-bg table-borderless">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Product</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody class="fs-6">
                <ng-container *ngFor="let subscriber of subscribers; let i =index">
                    <tr>
                        <td>{{subscriber?.name ? subscriber?.name : '-' }}</td>
                        <td>{{subscriber?.product?.name}}</td>
                        <td>
                            <div (click)="openModal(template, subscriber?.refid)" style="cursor: pointer;">
                                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"
                                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0">
                                    </path>
                                </svg>
                            </div>
                        </td>
                    </tr>
                </ng-container>
                <tr *ngIf="subscribers.length == 0">
                    <td colspan="3">
                        <app-no-results></app-no-results>
                    </td>
                </tr>
            </tbody>
        </table>


    </div>

    <div class="my-4">
        <app-pagination (pageTrigger)="onPageTriggered($event)" [pageSize]="limit" [pageIndex]="page"
            [totalPages]="totalPages" [totalResults]="totalResults"></app-pagination>
    </div>
</div>


<ng-template #template>
    <div class="modal-body text-center">
        <div class="fs-5 mb-6">Do you want to delete this user from alert?</div>
        <button type="button" class="btn btn-default p-2" (click)="confirm()">Yes</button>
        <button type="button" class="btn btn-primary p-2" (click)="decline()">No</button>
    </div>
</ng-template>
