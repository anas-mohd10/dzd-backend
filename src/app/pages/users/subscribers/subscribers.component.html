<div class="brand-page-container">
    <div class="page-header">
        <div class="page-title">
            <h1 class="fw-bolder">User alerts</h1>
        </div>
        <div class="row align-items-center">
            <div class="col d-flex align-items-start justify-content-between">
                <ul class="breadcrumb">
                    <li class="breadcrumb-item fs-6">
                        <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item active fs-6">
                        <a routerLink="{{ appRoute.subscribers.SUBSCRIBERS_LIST}}">User alerts</a>
                    </li>
                </ul>
                <div>
                    <button
                        class="btn btn-secondary cursor-pointer fs-6 w-200 d-flex align-items-center justify-content-center"
                        color="primary" (click)="exportSubscribers()">
                        <div class="me-3">
                            <svg height="20px" width="20px" fill="none" stroke="currentColor" stroke-width="1.5"
                                viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M9 13.5l3 3m0 0l3-3m-3 3v-6m1.06-4.19l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z">
                                </path>
                            </svg>
                        </div>
                        <div class="h-20">Export Subscribers</div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="card card-table">
            <div class="card-body">
                <div class="table-responsive">
                    <div class="d-flex align-items-center justify-content-end row">
                        <div class="col-lg-4">
                            <label class="form-label">&nbsp;</label>
                            <input type="text" class="form-control" placeholder="Search subscribers here"
                                [formControl]="keyword" (ngModelChange)="getSubscribers()">
                        </div>
                    </div>

                    <table class="mt-4 table table-head-custom table-vertical-center table-head-bg table-borderless"
                        *ngIf="subscribers.length > 0">
                        <thead class="common_thead">
                            <tr class="text-left fs-6 text-gray-400">
                                <th style="min-width: 120px">&nbsp;</th>
                                <th style="min-width: 120px">Name</th>
                                <th style="min-width: 100px">Product</th>
                                <th style="min-width: 100px">Action</th>
                            </tr>
                        </thead>
                        <tbody class="fs-6">
                            <ng-container *ngFor="let subscriber of subscribers; let i =index">
                                <tr>
                                    <td>{{i + 1}}</td>
                                    <td>{{subscriber?.name ? subscriber?.name : '-' }}</td>
                                    <td>{{subscriber?.product?.name}}</td>
                                    <td>
                                        <div (click)="openModal(template, subscriber?.refid)" style="cursor: pointer;">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                fill="currentColor" class="bi bi-trash3-fill" viewBox="0 0 16 16">
                                                <path
                                                    d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5Zm-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5ZM4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06Zm6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528ZM8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5Z" />
                                            </svg>
                                        </div>
                                    </td>
                                </tr>
                            </ng-container>
                        </tbody>
                    </table>

                    <div *ngIf="subscribers.length == 0">
                        <div class="emptyNote">
                            <img src="../../../../../../assets/icons/empty.gif" alt="Icon">
                            <div class="fs-3 fw-bolder">No result found</div>
                            <div class="fs-5 note">We couldn't find any item based on your search.</div>
                        </div>
                    </div>

                    <div class="filteringWrapper d-flex align-items-center justify-content-between"
                        *ngIf="subscribers.length > 0">
                        <div class="filtering">
                            <span class="fs-6 text-dark">Show</span>
                            <select [formControl]="limit" (change)="getSubscribers()">
                                <option value="5">5</option>
                                <option value="10">10</option>
                                <option value="15">15</option>
                                <option value="20">20</option>
                                <option value="25">25</option>
                            </select>
                            <span class="fs-6 text-dark">entries</span>
                        </div>
                        <div class="pagination">
                            <div class="paginationBefore" [ngClass]="{'disabled': page == 1}"
                                (click)="getPreviousPage()">
                                <img src="../../../../../../assets/icons/navigateBefore.svg" alt="Icon">
                            </div>
                            <div class="paginationPage">{{page}}</div>
                            <div class="paginationNext" [ngClass]="{'disabled': lastPage}" (click)="getNextPage()">
                                <img src="../../../../../../assets/icons/navigateNext.svg" alt="Icon">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<ng-template #template>
    <div class="modal-body text-center">
        <div class="fs-5 mb-6">Do you want to delete this user from alert?</div>
        <button type="button" class="btn btn-default p-2" (click)="confirm()">Yes</button>
        <button type="button" class="btn btn-primary p-2" (click)="decline()">No</button>
    </div>
</ng-template>
