<div>
     <div class="page-header d-flex align-items-start justify-content-between">
          <div>
               <div class="page-title">
                    <h1 class="fw-bold">Admin Users</h1>
               </div>
               <ul class="breadcrumb">
                    <li class="breadcrumb-item fs-6">
                         <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item active fs-6">
                         <a routerLink="{{ appRoute.admin.ADMIN_USERS }}">Admin Users</a>
                    </li>
               </ul>
          </div>
          <button class="btn btn-primary" routerLink="{{ appRoute.admin.ADD_ADMIN_USERS }}">
               Add Admin User
          </button>
     </div>

     <div class="card my-4">
          <div class="card-body">
               <div class="row d-flex justify-content-end align-items-end">
                    <div class="col-lg-8">
                         <label class="form-label">&nbsp;</label>
                         <input type="text" class="form-control" placeholder="Search items here" [formControl]="keyword"
                              (ngModelChange)="onSearch()">
                    </div>
                    <div class="col-lg-2">
                         <label class="fs-6 mb-1">Status</label>
                         <select class="form-select fs-6 text-dark" [formControl]="isActive" (change)="onSearch()">
                              <option value="" disabled>-- Select an option --</option>
                              <option value="false">Inactive</option>
                              <option value="true">Active</option>
                         </select>
                    </div>
                    <div class="col-lg-2">
                         <label class="fs-6 mb-1">&nbsp;</label>
                         <input type="button" class="btn w-100 btn-secondary" value="Clear filters" (click)="clearFilters()">
                    </div>
               </div>
          </div>
     </div>

     <div class="my-4">
          <div class="card">
               <div class="card-body">

                    <table class="table" *ngIf="users.length > 0">
                         <thead>
                              <tr class="text-left fs-6">
                                   <th>Email</th>
                                   <th>Mobile</th>
                                   <th>Status</th>
                                   <th>Action</th>
                              </tr>
                         </thead>
                         <tbody class="fs-6">
                              <ng-container *ngFor="let customer of users; let i =index">
                                   <tr>
                                        <td>{{customer?.email}}</td>
                                        <td>{{customer?.countryCode}} {{customer?.mobile}}</td>
                                        <td>
                                             <span class="alert p-1"
                                                  [ngClass]="{'alert-danger': customer?.isActive == false, 'alert-success': customer?.isActive == true}">
                                                  {{customer?.isActive == true ? 'Active' : 'Inactive'}}
                                             </span>
                                        </td>
                                        <td>
                                             <div class="d-flex">
                                                  <div routerLink="{{appRoute.admin.UPDATE_ADMIN_USERS}}"
                                                       [queryParams]="{'id': customer?.slug}">
                                                       <img src="../../../../../assets/icons/editPen.svg" alt="Icon">
                                                  </div>
                                                  <div class="ms-3" (click)="open(template, customer)">
                                                       <svg height="20px" width="20px" fill="none" stroke="currentColor"
                                                            stroke-width="1.5" viewBox="0 0 24 24"
                                                            xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                                 d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0">
                                                            </path>
                                                       </svg>
                                                  </div>
                                             </div>
                                        </td>
                                   </tr>
                              </ng-container>
                         </tbody>
                    </table>

                    <div *ngIf="users.length == 0">
                         <div class="d-flex flex-column justify-content-center align-items-center">
                              <div class="fs-3 fw-bolder">No result found</div>
                              <div class="fs-5 note">We couldn't find any item based on your search.</div>
                         </div>
                    </div>

                    <app-pagination [totalResults]="totalResults" [totalPages]="totalPages" [pageIndex]="page"
                         [pageSize]="limit" (pageTrigger)="onPageTriggered($event)"></app-pagination>
               </div>

          </div>
     </div>
</div>

<ng-template #template>
     <div class="modal-body text-center">
          <p>Do you want to confirm?</p>
          <button type="button" class="btn btn-default" (click)="confirm()">Yes</button>
          <button type="button" class="btn btn-primary" (click)="decline()">No</button>
     </div>
</ng-template>
