<div class="coupon-page-container">
   <div class="page-header">
      <div class="page-title">
         <h1 class="fw-bolder">Coupons</h1>
      </div>
      <div class="row">
         <div class="col d-flex align-items-start justify-content-between">
            <ul class="breadcrumb">
               <li class="breadcrumb-item fs-6">
                  <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
               </li>
               <li class="breadcrumb-item active fs-6">
                  <a routerLink="{{ appRoute.coupons.COUPONS_LIST }}">Coupons</a>
               </li>
            </ul>
            <button class="btn btn-primary cursor-pointer fs-6" color="primary"
               routerLink="{{ appRoute.coupons.ADD_COUPONS_LIST }}">Add Coupon</button>
         </div>
      </div>
   </div>

   <div class="coupon-form-container">
      <form [formGroup]="form">
         <div class="row d-flex align-items-end justify-content-end">
            <div class="search-input col-lg-4">
               <label class="fs-6">&nbsp;</label>
               <input type="text" placeholder="Search for coupons here" class="form-control fs-6" formControlName="name"
                  (ngModelChange)="getCoupons()">
            </div>
            <div class="search-status col-lg-2">
               <label class="fs-6">Status</label>
               <select name="isActive" id="isActive" class="form-select fs-6" formControlName="isActive"
                  (change)="getCoupons()">
                  <option value="" disabled>-- Select an option --</option>
                  <option value=true>Active</option>
                  <option value=false>Inactive</option>
               </select>
            </div>
            <div class="search-featured col-lg-2">
               <label class="fs-6 form-title">Start Date</label>
               <input type="date" class="form-control fs-6" formControlName="fromDate" (change)="getCoupons()">
            </div>
            <div class="search-featured col-lg-2">
               <label class="fs-6 form-title">End Date</label>
               <input type="date" class="form-control fs-6" formControlName="toDate" (change)="getCoupons()">
            </div>
            <div class="search-input col-lg-2">
               <label class="fs-6 mb-1">&nbsp;</label>
               <input type="button" class="form-control btn-secondary fs-6 text-dark" value="Clear filters"
                  (click)="clearFilters()">
            </div>
         </div>
      </form>
   </div>

   <div class="col-12 d-flex justify-content-between">
      <div class="total-count-container col-sm-3 bg-dark">
         <h4 class="text-white fs-6">Total {{coupons.length > 0 ? coupons.length : 0}} offers</h4>
      </div>
   </div>

         <div class="couponCard">
            <div class="couponImage">
               <img src="{{base}}/{{coupon?.file}}" alt="Coupon">
            </div>
            <div class="couponDetails">
               <div class="couponName fs-6">{{coupon?.title}}</div>
            </div>
         </div>
      </ng-container>
      <ng-container *ngIf="coupons.length == 0">
         <div class="emptyNote">
            <div class="fs-3 fw-bolder">No result found</div>
            <div class="fs-6 note">We couldn't find any item based on your search</div>
         </div>
      </ng-container>
   </div>

   <div class="filteringWrapper d-flex align-items-center justify-content-between col-12">
      <div class="filtering">
         <span class="fs-6 text-dark">Show</span>
         <select [formControl]="limit" (change)="getCoupons()">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20">20</option>
            <option value="25">25</option>
         </select>
         <span class="fs-6 text-dark">entries</span>
      </div>
      <div class="pagination">
         <div class="paginationBefore" [ngClass]="{'disabled': page == 1}" (click)="getPreviousPage()">
            <img src="../../../../../assets/icons/navigateBefore.svg" alt="Icon">
         </div>
         <div class="paginationPage">{{page}}</div>
         <div class="paginationNext" [ngClass]="{'disabled': lastPage}" (click)="getNextPage()">
            <img src="../../../../../assets/icons/navigateNext.svg" alt="Icon">
         </div>
      </div>
   </div>
</div>
