<div>
    <div class="page-header">
        <div class="page-title">
            <h1 class="fw-bold">Feeds</h1>
            <ul class="breadcrumb">
                <li class="breadcrumb-item fs-6">
                    <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                </li>
                <li class="breadcrumb-item active fs-6">
                    <a routerLink="{{ appRoute.feeds.LIST}}">Feeds</a>
                </li>
            </ul>
        </div>
    </div>

    <form [formGroup]="form">
        <div class="feedWrapper my-4 p-5">
            <div class="feedHeader mb-4">
                <svg height="30px" width="30px" fill="currentColor" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24">
                    <path
                        d="M3.06364 7.50914C4.70909 4.24092 8.09084 2 12 2C14.6954 2 16.959 2.99095 18.6909 4.60455L15.8227 7.47274C14.7864 6.48185 13.4681 5.97727 12 5.97727C9.39542 5.97727 7.19084 7.73637 6.40455 10.1C6.2045 10.7 6.09086 11.3409 6.09086 12C6.09086 12.6591 6.2045 13.3 6.40455 13.9C7.19084 16.2636 9.39542 18.0227 12 18.0227C13.3454 18.0227 14.4909 17.6682 15.3864 17.0682C16.4454 16.3591 17.15 15.3 17.3818 14.05H12V10.1818H21.4181C21.5364 10.8363 21.6 11.5182 21.6 12.2273C21.6 15.2727 20.5091 17.8363 18.6181 19.5773C16.9636 21.1046 14.7 22 12 22C8.09084 22 4.70909 19.7591 3.06364 16.4909C2.38638 15.1409 2 13.6136 2 12C2 10.3864 2.38638 8.85911 3.06364 7.50914Z">
                    </path>
                </svg>
            </div>
            <div class="row m-0 d-flex align-items-center justify-content-between">
                <div class="col-lg-3 p-0">
                    <div class="form-group">
                        <label class="fs-6 mb-3">Enable Google Feed?</label>
                        <select class="form-select fs-6 mb-3" formControlName="isGoogleFeed"
                            (change)="manageFeedDetails()">
                            <option value="" disabled>-- Select an option -- </option>
                            <option value="false">No</option>
                            <option value="true">Yes</option>
                        </select>
                    </div>
                </div>
                <div class="col-lg-9 p-0 d-flex flex-column align-items-end justify-content-end">
                    <div class="feedButton">
                        <a class="btn btn-primary d-flex align-items-center justify-content-center gap-2"
                            href="{{exportGoogleFeed}}" target="_blank">
                            Get feed now
                            <svg height="18" width="18" data-slot="icon" fill="none" stroke-width="1.5"
                                stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3">
                                </path>
                            </svg>
                        </a>
                    </div>
                    <div class="feedUrl mt-3" (click)="copyToClipboard('google')">
                        <code>{{form.get('googleFeedUrl')?.value}}</code>
                    </div>
                </div>
            </div>
        </div>

        <div class="feedWrapper mt-4 mb-4 p-5">
            <div class="feedHeader mb-4">
                <svg height="30px" width="30px" fill="currentColor" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24">
                    <path
                        d="M14 13.5H16.5L17.5 9.5H14V7.5C14 6.47062 14 5.5 16 5.5H17.5V2.1401C17.1743 2.09685 15.943 2 14.6429 2C11.9284 2 10 3.65686 10 6.69971V9.5H7V13.5H10V22H14V13.5Z">
                    </path>
                </svg>
            </div>
            <div class="row m-0 d-flex align-items-center justify-content-between">
                <div class="col-lg-3 p-0">
                    <div class="form-group">
                        <label class="fs-6 mb-3">Enable Facebook Feed?</label>
                        <select class="form-select fs-6 mb-3" formControlName="isFacebookFeed"
                            (change)="manageFeedDetails()">
                            <option value="" disabled>-- Select an option -- </option>
                            <option value="false">No</option>
                            <option value="true">Yes</option>
                        </select>
                    </div>
                </div>
                <div class="col-lg-9 p-0 d-flex flex-column align-items-end justify-content-end">
                    <div class="feedButton">
                        <a class="btn btn-primary d-flex align-items-center justify-content-center gap-2"
                            href="{{exportFacebookXmlFeed}}" target="_blank">
                            Get feed now
                            <svg height="18" width="18" data-slot="icon" fill="none" stroke-width="1.5"
                                stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3">
                                </path>
                            </svg>
                        </a>
                    </div>
                    <div class="feedUrl mt-3" (click)="copyToClipboard('facebook-xml')">
                        XML :<code>{{form.get('facebookXmlFeedUrl')?.value}}</code>
                    </div>
                    <div class="feedUrl mt-3" (click)="copyToClipboard('facebook-csv')">
                        CSV :<code>{{form.get('facebookCsvFeedUrl')?.value}}</code>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
