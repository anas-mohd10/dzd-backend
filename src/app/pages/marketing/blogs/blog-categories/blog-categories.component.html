<div>
    <div class="page-header d-flex align-items-start justify-content-between">
        <div>
            <div class="page-title">
                <h1 class="fw-bold">Blog Categories</h1>
            </div>
            <ul class="breadcrumb">
                <li class="breadcrumb-item fs-6">
                    <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                </li>
                <li class="breadcrumb-item fs-6">
                    <a routerLink="{{ appRoute.blogs.list }}">Blogs</a>
                </li>
                <li class="breadcrumb-item active fs-6">
                    <a routerLink="{{ appRoute.blogs.categories }}">Blog Categories</a>
                </li>
            </ul>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" (click)="open(categoryModal)">
                Create Category
            </button>
        </div>
    </div>
    <div class="my-4">
        <table class="table table-bordered">
            <thead>
                <th class="p-2">Title</th>
                <th class="p-2">Thumbnail</th>
                <th class="p-2">Status</th>
                <th class="p-2">Created At</th>
                <th class="p-2">Actions</th>
            </thead>
            <tbody>
                <tr *ngFor="let category of categories">
                    <td>{{category.title}}</td>
                    <td>
                        <div>
                            <img height="50" width="50" src="{{base}}{{category.thumbnail}}" alt="Thumbnail"
                                class="rounded border border-secondary" onerror="this.src='assets/images/default.png'">
                        </div>
                    </td>
                    <td>
                        <app-switch [switchId]="category._id" [isToggledProps]="category.isActive"
                            (switchToggled)="toggleStatus($event)"></app-switch>
                    </td>
                    <td>{{formatDate(category.createdAt)}}</td>
                    <td>
                        <div class="d-flex gap-2">
                            <div class="icon border border-secondary rounded d-flex align-items-center justify-content-center"
                                (click)="fetchCategory(category._id); open(categoryModal); isEditMode = true">
                                <svg height="18" width="18" data-slot="icon" fill="none" stroke-width="1.5"
                                    stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                    aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z">
                                    </path>
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"></path>
                                </svg>
                            </div>
                            <div class="icon bg-danger text-white border border-secondary rounded d-flex align-items-center justify-content-center"
                                (click)="delete(deleteModal, category)">
                                <svg height="18" width="18" data-slot="icon" fill="none" stroke-width="1.5"
                                    stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                    aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0">
                                    </path>
                                </svg>
                            </div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<ng-template #categoryModal>
    <div class="modal-header">
        <h4 class="modal-title">Blog Category</h4>
        <button type="button" class="btn-close" (click)="close()"></button>
    </div>
    <div class="modal-body">
        <form [formGroup]="form" (ngSubmit)="saveChanges()">
            <div class="mb-3">
                <div class="form-group">
                    <label class="fs-6 mb-3 required">Title</label>
                    <input type="text" class="form-control" formControlName="title">
                </div>
            </div>
            <div class="mb-3">
                <div class="form-group">
                    <label class="fs-6 mb-3 required">Thumbnail</label>
                    <div class="ratio ratio-1x1 position-relative">
                        <app-assets (mediaClicked)="handleThumbnail($event)"
                            [previewDetails]="form.value.thumbnail"></app-assets>
                        <div *ngIf="form.value.thumbnail" class="position-absolute top-0 start-0">
                            <button class="p-1 btn btn-danger m-2"
                                (click)="form.patchValue({ thumbnail: '' })">Remove</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <div class="form-group">
                    <label class="fs-6 mb-3 required">Status</label>
                    <select class="form-control" formControlName="isActive">
                        <option value="" disabled>-- Select option --</option>
                        <option value="true">Active</option>
                        <option value="false">Inactive</option>
                    </select>
                </div>
            </div>
            <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-primary">
                    Save changes
                </button>
            </div>
        </form>
    </div>
</ng-template>

<ng-template #deleteModal>
    <div class="modal-body text-center">
        <p class="mb-4 fs-5">Are you sure you want to delete this category <span
                class="fw-bold">{{selectedCategory?.title}}</span>?</p>
        <div class="d-flex justify-content-center gap-2">
            <button type="button" class="btn btn-danger w-50" (click)="confirm()">Continue</button>
            <button type="button" class="btn btn-secondary w-50" (click)="decline()">No</button>
        </div>
    </div>
</ng-template>
