<div>
  <div class="page-header">
    <div class="page-title">
      <h1 class="fw-bolder">Blogs ({{totalResults}})</h1>
    </div>
    <div class="row">
      <div class="col d-flex align-items-start justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item active fs-6">
            <a routerLink="{{ appRoute.blogs.list }}">Blogs</a>
          </li>
        </ul>
        <button class="btn btn-primary cursor-pointer fs-6" color="primary"
          routerLink="{{ appRoute.blogs.create }}">Create blog</button>
      </div>
    </div>
  </div>
  <div class="card my-4">
    <div class="card-body">
      <div class="row justify-content-end">
        <div class="col-lg-4">
          <input type="text" placeholder="Search blogs here" [formControl]="keyword" class="form-control"
            (ngModelChange)="getBlogs()">
        </div>
        <div class="col-lg-3">
          <input id="date" name="date" type="text" placeholder="Select blog date" class="form-control" bsDatepicker
            [bsConfig]="{ isAnimated: true, dateInputFormat: 'DD-MM-YYYY', containerClass: 'theme-green' }"
            [(ngModel)]="date" (ngModelChange)="getBlogs()">
        </div>
        <div class="col-lg-3">
          <input type="button" value="Clear filters" class="btn btn-secondary w-100"
            (click)="clear()">
        </div>
      </div>
      <div class="blogs my-6" *ngIf="blogs.length > 0">
        <ng-container *ngFor="let blog of blogs">
          <a class="blog" routerLink="{{appRoute.blogs.update + '/' + blog.slug}}">
            <img src={{blog?.thumbnail}} alt={{blog?.title}} class="rounded"
              onerror="this.src = '../../../../../assets/images/default.png'">
            <div class="mt-4">
              <div>{{blog?.category}}</div>
              <div class="fs-5 title">{{blog?.title}}</div>
              <div class="text-muted">{{blog?.createdAt}}</div>
            </div>
          </a>
        </ng-container>
      </div>
      <div class="my-8 d-flex flex-column align-items-center justify-content-center" *ngIf="blogs.length == 0">
        <div class="fs-4 fw-bold">No blogs found</div>
        <p class="text-muted">We couldn't find any item based on your search</p>
      </div>
      <app-pagination (pageTrigger)="onPageTriggered($event)" [totalResults]="totalResults" [totalPages]="totalPages"
      [pageIndex]="page" [pageSize]="limit"></app-pagination>
    </div>
  </div>
</div>
