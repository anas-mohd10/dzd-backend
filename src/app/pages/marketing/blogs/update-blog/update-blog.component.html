<div>
    <div class="page-header">
        <div class="page-title">
            <h1 class="fw-bolder">Update blog</h1>
        </div>
        <div class="row align-items-center">
            <div class="col d-flex align-items-start justify-content-between">
                <ul class="breadcrumb">
                    <li class="breadcrumb-item fs-6">
                        <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item fs-6">
                        <a routerLink="{{ appRoute.blogs.list }}">Blogs</a>
                    </li>
                    <li class="breadcrumb-item active fs-6">
                        <a routerLink="{{ appRoute.blogs.update + '/' + blogQuery }}">Update blog</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div class="my-4 card">
        <div class="card-body">
            <div>
                <label for="cover" class="form-label">Cover</label>
                <div class="cover w-100 rounded position-relative mb-3"
                    [ngClass]="{
                    'border border-danger':  (formControls.cover.touched || isSubmitted) && formControls.cover.errors?.required}">
                    <app-assets (mediaClicked)="handleCover($event)" [image]="'cover'"
                        [previewDetails]="previews?.cover"></app-assets>
                    <div *ngIf="previews?.cover">
                        <div class="position-absolute bottom-0 end-0 m-4">
                            <button class="btn btn-danger" (click)="onRemove('cover')">Remove</button>
                        </div>
                    </div>
                </div>
            </div>
            <form [formGroup]="form">
                <div class="row">
                    <div class="col-lg-3">
                        <div class="mb-3">
                            <label for="thumbnail" class="form-label required">Thumbnail</label>
                            <div class="ratio ratio-1x1 h-auto w-100 rounded"
                                [ngClass]="{
                                'border border-danger':  (formControls.thumbnail.touched || isSubmitted) && formControls.thumbnail.errors?.required}">
                                <app-assets (mediaClicked)="handleThumbnail($event)"
                                    [previewDetails]="previews?.thumbnail"></app-assets>
                            </div>
                            <div *ngIf="previews?.thumbnail">
                                <button class="btn mt-2 btn-danger w-100"
                                    (click)="onRemove('thumbnail')">Remove</button>
                            </div>
                        </div>
                        <div class="form-group mb-3">
                            <label for="category" class="form-label required">Category</label>
                            <input type="text" id="category" formControlName="category" placeholder="Eg. Fashion"
                                class="form-control"
                                [ngClass]="{
                                    'is-invalid':  (formControls.category.touched || isSubmitted) && formControls.category.errors?.required}">
                        </div>
                        <div class="form-group mb-3">
                            <label for="isActive" class="form-label">Status</label>
                            <select formControlName="isActive" class="form-select" id="isActive">
                                <option value="" disabled>-- Select an option--</option>
                                <option value="true">Active</option>
                                <option value="false">Inactive</option>
                            </select>
                        </div>
                        <div class="form-group mb-3">
                            <label for="isFeatured" class="form-label">Featured</label>
                            <select formControlName="isFeatured" class="form-select" id="isFeatured">
                                <option value="" disabled>-- Select an option--</option>
                                <option value="true">Yes</option>
                                <option value="false">No</option>
                            </select>
                        </div>
                        <div class="my-6">
                            <button class="w-100 btn btn-danger" (click)="open(template)">
                                <svg height="24px" width="24px" data-slot="icon" fill="none" stroke-width="1.5"
                                    stroke="#ffffff" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                    aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0">
                                    </path>
                                </svg>
                                Delete blog
                            </button>
                        </div>
                    </div>
                    <div class="col-lg-9">
                        <div class="form-group mb-3">
                            <label for="title" class="form-label required">Title</label>
                            <input type="text" id="title" formControlName="title" class="form-control"
                                [ngClass]="{
                                'is-invalid':  (formControls.title.touched || isSubmitted) && formControls.title.errors?.required}">
                        </div>
                        <div class="form-group mb-3">
                            <label for="overview" class="form-label">Overview</label>
                            <textarea id="overview" formControlName="overview" class="form-control" rows="3"
                                [ngClass]="{
                                'is-invalid':  (formControls.overview.touched || isSubmitted) && formControls.overview.errors?.required}"
                                placeholder="Brief overview of the blog post"></textarea>
                        </div>
                        <div class="form-group mb-3">
                            <label for="description" class="form-label required">Description</label>
                            <angular-editor id="description" class="form-control" formControlName="description"
                                [config]="editorConfig"
                                [ngClass]="{
                                    'is-invalid':  (formControls.description.touched || isSubmitted) && formControls.description.errors?.required}"></angular-editor>
                        </div>
                        <div class="p-4 rounded border border-secondary">
                            <div class="fw-bold fs-2 mb-6">SEO details</div>
                            <div class="form-group mb-3">
                                <label for="seoTitle" class="form-label">Title</label>
                                <input type="text" id="seoTitle" formControlName="seoTitle" class="form-control">
                            </div>
                            <div class="form-group mb-3">
                                <label for="seoDescription" class="form-label">Description</label>
                                <input type="text" id="seoDescription" formControlName="seoDescription"
                                    class="form-control">
                            </div>
                            <div class="form-group mb-3">
                                <label for="seoKeywords" class="form-label">Keywords</label>
                                <input type="text" id="seoKeywords" formControlName="seoKeywords" class="form-control">
                            </div>
                            <div class="form-group mb-3">
                                <label for="canonicalUrl" class="form-label">Canonical URL</label>
                                <input type="text" id="canonicalUrl" formControlName="canonicalUrl"
                                    class="form-control">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="d-flex align-items-center justify-content-end my-4">
                    <a class="btn btn-secondary me-2" routerLink="{{appRoute.blogs.list}}">Cancel</a>
                    <button class="btn btn-primary ms-2" (click)="onSubmit()">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<ng-template #template>
    <div class="modal-body text-center">
        <div class="fs-5 mb-6">Do you want to delete this blog?</div>
        <button type="button" class="btn btn-default" (click)="confirm()">Yes</button>
        <button type="button" class="btn btn-primary" (click)="modalRef.hide()">No</button>
    </div>
</ng-template>
