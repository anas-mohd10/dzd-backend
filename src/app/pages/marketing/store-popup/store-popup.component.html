<div class="profilePageContainer">
    <div class="page-header">
        <div class="page-title">
            <h1 class="fw-bold">Store popup</h1>
        </div>
        <div class="row">
            <div class="col d-flex align-items-start justify-content-between">
                <ul class="breadcrumb">
                    <li class="breadcrumb-item fs-6">
                        <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item active fs-6">
                        <a routerLink="{{ appRoute.storePopup }}">Store popup</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="card my-4">
        <div class="card-body">

            <div>
                <div class="fs-5 mx-auto store-title">Website Pop-up Ad</div>
                <div class="my-4 row">
                    <div class="col-lg-6 mx-auto" *ngIf="!isWeb">
                        <div class="image-container">
                            <div class="mask">
                                <div class="upload-text">
                                    <div class="fs-4">Drag and drop file</div>
                                    <div class="my-2">or</div>
                                    <button class="btn btn-primary">Browse here</button>
                                </div>
                            </div>
                            <input type="file" id="upload" accept="image/*" [formControl]="webFileInput"
                                (change)="handleWebChange($event)">
                        </div>
                    </div>
                    <div class="col-lg-6 mx-auto position-relative" *ngIf="isWeb">
                        <div class="remove-popup" (click)="removeMedia('website')" *ngIf="webPreview">
                            <svg height="20px" width="20px" fill="none" stroke="#ffffff" stroke-width="1.5"
                                viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0">
                                </path>
                            </svg>
                        </div>
                        <img *ngIf="webPreview" src="{{webPreview}}" alt="Website" class="web-popup">
                        <div class="row my-3" *ngIf="webPreview">
                            <div class="col-lg-8">
                                <input type="text" placeholder="Redirection link" [formControl]="webRedirection"
                                    class="form-control">
                            </div>
                            <div class="col-lg-4">
                                <button class="w-100 btn btn-primary" (click)="onSubmit()">Save changes</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <div class="fs-5 mx-auto store-title">Mobile Pop-up Ad</div>
                <div class="my-4 row">
                    <div class="col-lg-6 mx-auto" *ngIf="!isMobile">
                        <div class="image-container">
                            <div class="mask">
                                <div class="upload-text">
                                    <div class="fs-4">Drag and drop file</div>
                                    <div class="my-2">or</div>
                                    <button class="btn btn-primary">Browse here</button>
                                </div>
                            </div>
                            <input type="file" id="upload" accept="image/*" [formControl]="mobileFileInput"
                                (change)="handleMobileChange($event)">
                        </div>
                    </div>
                    <div class="col-lg-6 mx-auto position-relative" *ngIf="isMobile">
                        <div class="remove-popup" (click)="removeMedia('mobile')" *ngIf="mobilePreview">
                            <svg height="20px" width="20px" fill="none" stroke="#ffffff" stroke-width="1.5"
                                viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0">
                                </path>
                            </svg>
                        </div>
                        <img *ngIf="mobilePreview" src="{{mobilePreview}}" alt="Website" class="web-popup">
                        <div class="row my-3" *ngIf="mobilePreview">
                            <div class="col-lg-8">
                                <input type="text" placeholder="Redirection link" [formControl]="mobileRedirection"
                                    class="form-control">
                            </div>
                            <div class="col-lg-4">
                                <button class="w-100 btn btn-primary" (click)="onSubmit()">Save changes</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #template>
    <div class="modal-header pb-0">
        <h4 class="modal-title pull-left">Pop-up Ad</h4>
        <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="close()">
            <span aria-hidden="true" class="visually-hidden">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <img src="{{preview}}" alt="Advertisement" class="popup-image">
        <div class="mt-3 d-flex align-items-center justify-content-end">
            <button class="btn-primary btn" (click)="onSubmit()">Save and Continue</button>
        </div>
    </div>
</ng-template>
