<div class="content container-fluid">
   <div class="page-header">
      <div class="row align-items-center">
         <div class="col">
            <h3 class="page-title fw-bolder fs-2">
               {{ editMode ? "Update Notifications" : "Add Notifications" }}
            </h3>
            <ul class="breadcrumb">
               <li class="breadcrumb-item fs-6">
                  <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
               </li>
               <li class="breadcrumb-item fs-6">
                  <a routerLink="{{ appRoute.notification.NOTIFICATION_LIST }}">Notifications</a>
               </li>
               <li class="breadcrumb-item active fs-6">
                  <a routerLink="{{ appRoute.notification.UPDATE_NOTIFICATION}}" [queryParams]="{notification: slug}">
                     {{ editMode ? "Update Notifications" : "Add Notifications"}}
                  </a>
               </li>
            </ul>
         </div>
      </div>
   </div>
   <div class="row mt-10">
      <div class="col-sm-12 fs-6">
         <div class="card">
            <div class="card-body">
               <form (ngSubmit)="onSubmit()" [formGroup]="notificationForm">
                  <div class="row">
                     <div class="col-12">
                        <h3 class="form-title"><span>Notifications Details</span></h3>
                     </div>
                     <div class="col-12">
                        <label class="fs-6 mb-3 form-title required">Customer</label>
                        <div class="form-group col-sm-6">
                           <div class="form-check mt-5">
                              <input class="form-check-input" type="radio" name="isAllCustomer" id="inlineRadio1"
                                 value="true" (change)="selectcustomer($event.target)" formControlName="isAllCustomer"
                                 [ngClass]="{
                                    'is-invalid': (nf.isAllCustomer.touched || isSubmitted) && nf.isAllCustomer.errors?.required}">
                              <label class="form-check-label fs-6" for="inlineRadio1">All customers</label>
                           </div>
                           <div class="form-check mt-5">
                              <input class="form-check-input" type="radio" name="isAllCustomer" id="inlineRadio2"
                                 value="false" (change)="selectcustomer($event.target)" formControlName="isAllCustomer"
                                 [ngClass]="{
                                    'is-invalid': (nf.isAllCustomer.touched || isSubmitted) && nf.isAllCustomer.errors?.required}">
                              <label class="form-check-label fs-6" for="inlineRadio2">Select customers</label>
                           </div>
                           <div class="col-12 mt-10" *ngIf="getCustomer == true">
                              <select class="form-select fs-6" formControlName="customer"
                                 (change)="customerInput($event.target)">
                                 <option value="" disabled>Select one or more customer from the list</option>
                                 <option *ngFor="let customer of customersdata" value="{{ customer?.key }}">
                                    {{ customer?.name }}
                                 </option>
                              </select>
                           </div>
                           <div class="tag-inputs col-12">
                              <ng-container *ngFor="let cust of customers">
                                 <div class="tag-input">
                                    <div class="tag-name">{{ cust.name }}</div>
                                    <i class="bi bi-x" (click)="removeCustomer(cust.key)"></i>
                                 </div>
                              </ng-container>
                           </div>
                        </div>
                     </div>
                     <div class="col-sm-6">
                        <label class="fs-6 mb-3 form-title required">Notification Channel</label>
                        <select class="form-select form-select-lg mb-3 fs-6" aria-label=".form-select-lg"
                           formControlName="channel" [ngClass]="{
                           'is-invalid': (nf.channel.touched || isSubmitted) && nf.channel.errors?.required}">
                           <option value="" disabled>-- Select an option --</option>
                           <option value="SMS">SMS</option>
                           <option value="Email">Email</option>
                           <option value="Push">Push notifications</option>
                        </select>
                     </div>
                     <div class="col-sm-6">
                        <label class="fs-6 mb-3 form-title required">Notification Type</label>
                        <select class="form-select form-select-lg mb-3 fs-6" aria-label=".form-select-lg"
                           (change)="checkType($event.target)" formControlName="type"
                           [ngClass]="{'is-invalid': (nf.type.touched || isSubmitted) && nf.type.errors?.required}">
                           <option value="" disabled>-- Select an option --</option>
                           <option value="Instant">Instant</option>
                           <option value="Scheduled">Scheduled</option>
                        </select>
                     </div>
                     <div class="col-12" *ngIf="isScheduled == true">
                        <div class="col-12 col-sm-6">
                           <div class="form-group ">
                              <label class="fs-6 mb-3 form-title">Schedule Date</label>
                              <input type="date" class="form-control fs-6" formControlName="scheduledDate"
                                 (change)="checkScheduleDate($event.target)" />
                           </div>
                        </div>
                        <div class="col-12 col-sm-6" *ngIf="invalidDate == false">
                           <div class="form-group ">
                              <label class="fs-6 mb-3 form-title">Schedule Time</label>
                              <input type="time" class="form-control fs-6" formControlName="scheduledTime"
                                 (change)="checkScheduleTime($event.target)" />
                           </div>
                        </div>
                     </div>
                     <div class="col-12">
                        <div class="form-group col-sm-6">
                           <label class="fs-6 mb-3 form-title required">Title</label>
                           <input type="text" class="form-control fs-6" formControlName="title" [ngClass]="{
                            'is-invalid': (nf.title.touched || isSubmitted) && nf.title.errors?.required}" />
                        </div>
                     </div>
                     <div class="col-12">
                        <div class="form-group col-sm-8">
                           <label class="fs-6 mb-3 required required">Content</label>
                           <textarea class=" form-control fs-6" formControlName="content" style="resize: none"
                              id="content" rows="5"
                              [ngClass]="{'is-invalid':(nf.content.touched || isSubmitted) && nf.content.errors?.required}"></textarea>
                        </div>
                     </div>
                     <div class="col-12">
                        <div class="form-group col-sm-6">
                           <label class="fs-6 mb-3 form-title required">Status</label>
                           <select class="form-select" formControlName="isActive" [ngClass]="{
                            'is-invalid':(nf.isActive.touched || isSubmitted) && nf.isActive.errors?.required}">
                              <option value="" disabled>-- Select an option --</option>
                              <option value="true">Active</option>
                              <option value="false">Inactive</option>
                           </select>
                        </div>
                     </div>
                     <div class="col-12">
                        <div class="form-group col-sm-6">
                           <label class="fs-6 mb-3 form-title required">Notification Status</label>
                           <select class="form-select" formControlName="status" [ngClass]="{
                            'is-invalid':(nf.status.touched || isSubmitted) && nf.status.errors?.required}">
                              <option value="" disabled>-- Select an option --</option>
                              <option value="Pending">Pending</option>
                              <option value="Sent">Sent</option>
                           </select>
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="col-12">
                           <h3 class="form-title required"><span>Media</span></h3>
                        </div>
                        <div class="form-group col-12">
                           <div class="image-upload col-sm-6">
                              <input type="file" class="form-control fs-6" name="image" accept="image/*"
                                 (change)="handleInputChange($event)"
                                 onchange="document.getElementById('previewImage').src = window.URL.createObjectURL(this.files[0])"
                                 style="height: 100px;" required>
                              <div class="image-upload-div">
                                 <div class="left-img"><img src="../../../../../assets/media/svg/files/upload.svg"
                                       alt="" srcset=""></div>
                                 <div class="right-text d-flex flex-column">
                                    <span class="right-text-title fs-4 fw-bolder">Click to upload</span>
                                    <span class="right-text-note fs-7 text-gray-400">Upload up to 1 file</span>
                                 </div>
                              </div>
                           </div>
                           <div class="uploaded-image col-sm-6 mt-5">
                              <img src="{{img}}" alt=""
                                 style="width: 150px; height: 150px">
                           </div>
                        </div>
                     </div>
                     <ng-container *ngIf=" loadImage">
                        <div class="col-12 preview-section">
                           <div class="crop-image col-sm-6">
                              <image-cropper class="crop-section" [imageChangedEvent]="imageChangedEvent"
                                 [maintainAspectRatio]="true" [aspectRatio]="3 / 3" [cropperMaxWidth]="1600"
                                 [cropperMaxHeight]="1600" format="png" (imageCropped)="imageCropped($event)"
                                 (imageLoaded)="imageLoaded()" (cropperReady)="cropperReady()"
                                 (loadImageFailed)="loadImageFailed()">
                              </image-cropper>
                           </div>
                           <div class="uploads uploaded col-sm-6">
                              <div class="close-icon bg-dark">
                                 <i class="bi bi-x-lg text-white" (click)="removeImage()"></i>
                              </div>
                              <img class="preview-img" id="previewImage" [src]="croppedImage">
                           </div>
                        </div>
                     </ng-container>
                     <div class="col-12">
                        <a routerLink="{{ appRoute.notification.NOTIFICATION_LIST }}"
                           class=" btn btn-secondary btn-sm fs-6 text-dark" style="width: 200px; margin-right: 20px;">
                           Cancel
                        </a>
                        <button type="submit" class="btn btn-primary btn-sm fs-6" style="width: 200px">
                           Update
                        </button>
                     </div>
                  </div>
               </form>
            </div>
         </div>
      </div>
   </div>
</div>
