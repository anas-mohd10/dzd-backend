<div>
  <div class="page-header d-flex align-items-start justify-content-between">
    <div>
      <div class="page-title">
        <h1 class="fw-bold">Vouchers</h1>
      </div>
      <ul class="breadcrumb">
        <li class="breadcrumb-item fs-6">
          <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
        </li>
        <li class="breadcrumb-item active fs-6">
          <a routerLink="{{ appRoute.vouchers.list }}">Vouchers</a>
        </li>
      </ul>
    </div>
    <button class="btn btn-primary" routerLink="{{ appRoute.vouchers.add }}">
      Add voucher
    </button>
  </div>

  <div class="card my-4">
    <div class="card-body">
      <input type="search" class="form-control" id="keyword" placeholder="Search vouchers" [formControl]="keyword"
        (ngModelChange)="fetchResults('search')">
    </div>
  </div>


  <div>
    <table class="table">
      <thead>
        <tr>
          <th class="p-2">&nbsp;</th>
          <th class="p-2">Name</th>
          <th class="p-2">Recepient</th>
          <th class="p-2">Voucher code</th>
          <th class="p-2">Amount</th>
          <!-- <th class="p-2">Status</th> -->
          <th class="p-2">Payment status</th>
          <th class="p-2">Action</th>
        </tr>
      </thead>
      <tbody class="fs-6">
        <tr *ngFor="let voucher of vouchers; let i =index">
          <td>{{i + 1}}</td>
          <td>{{voucher?.user?.name}}</td>
          <td>{{voucher?.name}}</td>
          <td>
            <div (click)="copyToClipboard(voucher?.voucher)" class="voucher">
              {{voucher?.voucher}}
            </div>
          </td>
          <td>{{voucher?.amount}}</td>
          <!-- <td>
            <div class="badge" [ngClass]="{
                            'badge-success': voucher?.isAvailed,
                            'badge-warning': !voucher?.isAvailed && voucher?.paymentStatus === 'success',
                            'badge-secondary': !voucher?.isAvailed && voucher?.paymentStatus !== 'success'
                        }">
              {{getVoucherStatus(voucher)}}
            </div>
          </td> -->
          <td>
            <div class="badge" [ngClass]="{
                            'badge-success': voucher?.paymentStatus === 'success',
                            'badge-warning': voucher?.paymentStatus === 'awaiting',
                            'badge-danger': voucher?.paymentStatus === 'failed'
                        }">
              {{voucher?.paymentStatus}}
            </div>
          </td>
          <td routerLink="{{appRoute.vouchers.update + '/' + voucher?.refid}}">
            <img src="assets/icons/editPen.svg" alt="Icon">
          </td>
        </tr>
        <tr *ngIf="vouchers.length == 0">
          <td colspan="8">
            <app-no-results></app-no-results>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="mt-3">
    <app-pagination [totalPages]="totalPages" [totalResults]="totalResults" [pageIndex]="pageIndex"
      [pageSize]="pageSize" (pageTrigger)="onPageTriggered($event)"></app-pagination>
  </div>
</div>
