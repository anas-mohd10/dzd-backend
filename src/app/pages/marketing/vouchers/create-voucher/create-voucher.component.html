<div>
    <div class="page-header">
        <div class="page-title">
            <h1 class="fw-bolder">Add voucher</h1>
        </div>
        <div class="row align-items-center">
            <div class="col d-flex align-items-start justify-content-between">
                <ul class="breadcrumb">
                    <li class="breadcrumb-item fs-6">
                        <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item fs-6">
                        <a routerLink="{{ appRoute.vouchers.list }}">Vouchers</a>
                    </li>
                    <li class="breadcrumb-item active fs-6">
                        <a routerLink="{{ appRoute.vouchers.add }}">
                            Add voucher
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <div class="row">
                <div class="col-lg-6">
                    <div class="form-group mb-3">
                        <div class="position-relative">
                            <label for="customer" class="form-label required">Customer</label>
                            <input type="text" id="customer" placeholder="Search customers" [(ngModel)]="keyword"
                                (ngModelChange)="getCustomers()" class="form-control">
                            <div class="position-absolute customers shadow w-100 mt-2 bg-white p-2 rounded"
                                *ngIf="customers.length > 0">
                                <ng-container *ngFor="let customer of customers">
                                    <div class="p-2 pointer rounded customer" (click)="optCustomer(customer)">
                                        {{customer.name}}
                                    </div>
                                </ng-container>
                            </div>
                        </div>
                    </div>
                    <form [formGroup]="form">
                        <div class="form-group mb-3">
                            <label for="amount" class="form-label required">Amount</label>
                            <input type="text" placeholder="Enter gift card amount" class="form-control"
                                formControlName="amount">
                        </div>
                        <div class="form-group mb-3">
                            <label for="amount" class="form-label required">Name</label>
                            <input type="text" placeholder="Enter name" class="form-control" formControlName="name">
                        </div>
                        <div class="form-group mb-3">
                            <label for="email" class="form-label required">Email</label>
                            <input type="text" id="email" placeholder="Enter email address" class="form-control"
                                formControlName="email">
                        </div>
                        <div class="row">
                            <div class="col-lg-3">
                                <div class="form-group mb-3">
                                    <label for="country" class="form-label required">Country code</label>
                                    <input type="text" placeholder="Enter country code" class="form-control"
                                        formControlName="countryCode">
                                </div>
                            </div>
                            <div class="col-lg-9">
                                <div class="form-group mb-3">
                                    <label for="amount" class="form-label required">Mobile</label>
                                    <input type="text" placeholder="Enter email address" class="form-control"
                                        formControlName="email">
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="my-6">
                <p *ngIf="optedCustomer">Gift card by {{optedCustomer?.name}}</p>
                <div class="gift-card">
                    <div class="d-flex align-items-center justify-content-end">
                        <div class="amount fw-bold">{{settings?.currency}} {{form.get('amount')?.value}}</div>
                    </div>
                    <div>
                        <div>{{form.get('name')?.value}}</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
