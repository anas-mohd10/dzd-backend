<div>
    <div class="page-header">
        <div class="page-title">
            <h1 class="fw-bold">Update voucher</h1>
        </div>
        <div class="row align-items-center">
            <div class="col d-flex align-items-start justify-content-between">
                <ul class="breadcrumb">
                    <li class="breadcrumb-item fs-6">
                        <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item fs-6">
                        <a routerLink="{{ appRoute.vouchers.list }}">Vouchers</a>
                    </li>
                    <li class="breadcrumb-item active fs-6">
                        <a routerLink="{{ appRoute.vouchers.update + '/' + voucherQuery }}">
                            Update voucher
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <div class="d-flex align-items-center justify-content-end">
                <button class="btn btn-danger" (click)="open(template)">Delete</button>
            </div>
            <div class="my-6 w-100 voucher-image" *ngIf="preview">
                <img src="{{preview}}" alt="Voucher">
            </div>
            <form [formGroup]="form">
                <div class="row">
                    <div class="col-lg-6 form-group mb-3">
                        <label for="user" class="form-label">Customer</label>
                        <input type="text" class="form-control" formControlName="user" id="user" [readonly]="true">
                    </div>
                    <div class="col-lg-6 form-group mb-3">
                        <label for="amount" class="form-label">Amount</label>
                        <input type="text" placeholder="Enter gift card amount" class="form-control"
                            formControlName="amount" [readonly]="true">
                    </div>
                    <div class="col-lg-6 form-group mb-3">
                        <label for="voucher" class="form-label">Voucher code </label>
                        <input type="text" placeholder="Voucher code" class="form-control" formControlName="voucher"
                            [readonly]="true">
                    </div>
                    <div class="col-lg-6 form-group mb-3">
                        <label for="amount" class="form-label">Name</label>
                        <input type="text" placeholder="Enter name" class="form-control" formControlName="name"
                            [readonly]="true">
                    </div>
                    <div class="col-lg-6 form-group mb-3">
                        <label for="email" class="form-label required">Email</label>
                        <input type="text" id="email" placeholder="Enter email address" class="form-control"
                            [readonly]="true" formControlName="email">
                    </div>
                    <div class="row">
                        <div class="col-lg-3">
                            <div class="form-group mb-3">
                                <label for="country" class="form-label required">Country code</label>
                                <input type="text" placeholder="Enter country code" class="form-control"
                                    [readonly]="true" formControlName="countryCode">
                            </div>
                        </div>
                        <div class="col-lg-9">
                            <div class="form-group mb-3">
                                <label for="amount" class="form-label required">Mobile</label>
                                <input type="text" placeholder="Enter mobile number" class="form-control"
                                    [readonly]="true" formControlName="mobile">
                            </div>
                        </div>
                    </div>
                    <div class="form-group mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea type="text" id="message" placeholder="Enter message" class="form-control"
                            [readonly]="true" formControlName="message" rows="4"></textarea>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<ng-template #template>
    <div class="modal-body text-center">
        <p>Do you want to delete this voucher?</p>
        <button type="button" class="btn btn-default" (click)="confirm()">Yes</button>
        <button type="button" class="btn btn-primary" (click)="decline()">No</button>
    </div>
</ng-template>
