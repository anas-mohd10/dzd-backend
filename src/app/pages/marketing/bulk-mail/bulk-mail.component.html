<div>
    <div class="page-header d-flex align-items-start justify-content-between">
        <div>
            <div class="page-title">
                <h1 class="fw-bold">Bulk Mail</h1>
            </div>
            <ul class="breadcrumb">
                <li class="breadcrumb-item fs-6">
                    <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                </li>
                <li class="breadcrumb-item active fs-6">
                    Marketing
                </li>
                <li class="breadcrumb-item active fs-6">
                    Bulk Mail
                </li>
            </ul>
        </div>
    </div>

    <div class="row my-4">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <form [formGroup]="form" (ngSubmit)="onSubmit()">

                        <div class="mb-4">
                            <label for="gateway" class="form-label required fs-6">Select Email Gateway</label>
                            <ng-select [items]="gateways" bindLabel="displayName" bindValue="_id"
                                formControlName="gatewayId" placeholder="Select Gateway" [clearable]="false"
                                [ngClass]="{ 'is-invalid': (formControls.gatewayId.touched || isSubmitted) && formControls.gatewayId.errors?.required }">
                                <ng-template ng-option-tmp let-item="item">
                                    <div class="d-flex align-items-center">
                                        <span class="fw-bold">{{item.displayName}}</span>
                                        <span class="text-muted ms-2 fs-7">({{item.gatewayName}})</span>
                                    </div>
                                </ng-template>
                            </ng-select>
                            <div *ngIf="(formControls.gatewayId.touched || isSubmitted) && formControls.gatewayId.errors?.required"
                                class="invalid-feedback d-block">
                                Gateway is required
                            </div>
                            <div *ngIf="gateways.length === 0" class="text-warning mt-2">
                                No active email gateways found. Please configure them in Settings.
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="subject" class="form-label required fs-6">Email Subject</label>
                            <input type="text" class="form-control" id="subject" formControlName="subject"
                                placeholder="Enter email subject"
                                [ngClass]="{ 'is-invalid': (formControls.subject.touched || isSubmitted) && formControls.subject.errors?.required }">
                            <div *ngIf="(formControls.subject.touched || isSubmitted) && formControls.subject.errors?.required"
                                class="invalid-feedback">
                                Subject is required
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="htmlContent" class="form-label required fs-6">Email Content</label>
                            <angular-editor formControlName="htmlContent" [placeholder]="'Enter text here...'"
                                [config]="editorConfig"></angular-editor>
                            <div *ngIf="(formControls.htmlContent.touched || isSubmitted) && formControls.htmlContent.errors?.required"
                                class="text-danger mt-1 fs-7">
                                Content is required
                            </div>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary" [disabled]="gateways.length === 0">
                                <i class="bi bi-send me-2"></i> Send Bulk Email
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
