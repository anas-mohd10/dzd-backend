<div>

  <div class="page-header">
    <div class="page-title">
      <h1 class="fw-bold">Update offers</h1>
    </div>
    <div class="row align-items-center">
      <div class="d-flex align-items-start justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.offer.OFFER_LIST }}">Offers</a>
          </li>
          <li class="breadcrumb-item active fs-6">
            <a routerLink="{{ appRoute.offer.UPDATE_OFFER }}" [queryParams]="{'offer' : this.offerId}">Update offers</a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <div class="card mt-4">
    <div class="card-body">
      <form (ngSubmit)="onSubmit()" [formGroup]="form">
        <div class="row">
          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3 required">Title</label>
              <input type="text" class="form-control fs-6" placeholder="Eg. Apple Offers" formControlName="title"
                [ngClass]="{
                    'is-invalid':
                    (formControls.title.touched || isSubmitted) &&
                    formControls.title.errors?.required
                  }" />
            </div>
          </div>
          <div>
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Description</label>
              <input type="text" class="form-control fs-6" formControlName="description" />
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Type</label>
              <select class="form-select fs-6" formControlName="type"
                [ngClass]="{  'is-invalid': (formControls.type.touched || isSubmitted) && formControls.type.errors?.required}">
                <option value="" disabled>-- Select an option --</option>
                <option value="percentage">Percentage</option>
                <option value="fixed">Fixed Amount</option>
              </select>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3 required">Value</label>
              <input type="text" placeholder="Eg. 10" class="form-control fs-6" formControlName="value"
                (change)="validateValue()"
                [ngClass]="{
                    'is-invalid': (formControls.value.touched || isSubmitted) && formControls.value.errors?.required}" />
              <div class="alert alert-danger p-2 mt-2" role="alert" *ngIf="!isValidValue">
                Maximum value : 100
              </div>
              <div class="alert alert-danger p-3 mt-2" *ngIf="formControls.value.errors?.pattern">This field accepts
                only numbers
              </div>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Start Date</label>
              <input type="date" class="form-control fs-6" [min]="minDate" formControlName="startDate" [ngClass]="{
                      'is-invalid':
                        (formControls.startDate.touched || isSubmitted) &&
                        formControls  .startDate.errors?.required
                    }" />
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">End Date</label>
              <input type="date" [min]="minDate" class="form-control fs-6" formControlName="endDate"
                [ngClass]="{ 'is-invalid': (formControls.endDate.touched || isSubmitted) && formControls.endDate.errors?.required }" />
            </div>
          </div>
          <div>
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Offer type</label>
              <select class="form-select fs-6" formControlName="offerType">
                <option value="" disabled>-- Select an option --</option>s
                <option value="products">Products</option>
                <option value="parents">Config Products</option>
                <option value="brands">Brands</option>
                <option value="categories">Categories</option>
                <option value="collections">Collections</option>
                <option value="complete">Store</option>
              </select>
            </div>
          </div>
          <div *ngIf="form.get('offerType')?.value == 'products'">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Products</label>
              <ng-select [items]="productsdata" bindLabel="name" bindValue="_id" [(ngModel)]="products"
                placeholder="Select products applicable to this coupon" [multiple]=true
                [ngModelOptions]="{standalone: true}" (change)="getTypes('products')">
              </ng-select>
            </div>
          </div>
          <div *ngIf="form.get('offerType')?.value == 'categories'">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Categories</label>
              <ng-select [items]="categoriesdata" bindLabel="name" bindValue="_id" [(ngModel)]="categories"
                placeholder="Select categories applicable to this offer" [multiple]=true
                [ngModelOptions]="{standalone: true}" (change)="getTypes('categories')">
              </ng-select>
            </div>
          </div>
          <div *ngIf="form.get('offerType')?.value == 'collections'">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Collections</label>
              <ng-select [items]="collectionsdata" bindLabel="name" bindValue="_id" [(ngModel)]="collections"
                placeholder="Select collections applicable to this offer" [multiple]=true
                [ngModelOptions]="{standalone: true}" (change)="getTypes('collections')">
              </ng-select>
            </div>
          </div>
          <div *ngIf="form.get('offerType')?.value == 'parents'">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Config Products</label>
              <ng-select [items]="parentsData" bindLabel="name" bindValue="_id" [(ngModel)]="parents"
                placeholder="Select config products applicable to this offer" [multiple]=true
                [ngModelOptions]="{standalone: true}" (change)="getTypes('parents')">
              </ng-select>
            </div>
          </div>
          <div *ngIf="form.get('offerType')?.value == 'brands'">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Brands</label>
              <ng-select [items]="brandsdata" bindLabel="name" bindValue="_id" [(ngModel)]="brands"
                placeholder="Select brands applicable to this offer" [multiple]=true
                [ngModelOptions]="{standalone: true}" (change)="getTypes('brands')">
              </ng-select>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Priority</label>
              <input type="number" class="form-control fs-6" formControlName="priority" />
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Active Offer?</label>
              <select class="form-select mb-3 fs-6" formControlName="isActive">
                <option value="" disabled> -- Select an option --</option>
                <option value="true">Yes</option>
                <option value="false">No</option>
              </select>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Delete Offer?</label>
              <select class="form-select mb-3 fs-6" formControlName="isDelete">
                <option value="" disabled> -- Select an option --</option>
                <option value="true">Yes</option>
                <option value="false">No</option>
              </select>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
  <div class="d-flex align-items-center justify-content-end gap-2 mt-4">
    <a routerLink="{{ appRoute.offer.OFFER_LIST}}" class=" btn btn-secondary fs-6">
      Cancel
    </a>
    <button type="submit" class="btn btn-primary fs-6">
      Save changes
    </button>
  </div>
</div>
