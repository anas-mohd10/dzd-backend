<div class="content container-fluid">

  <div class="page-header">
    <div class="page-title">
      <h1 class="fw-bolder"> {{ editMode ? "Update Offer" : "Add Offer" }}</h1>
    </div>
    <div class="row align-items-center">
      <div class="col d-flex align-items-start justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.offer.OFFER_LIST }}">Offers</a>
          </li>
          <li class="breadcrumb-item active fs-6">
            <a routerLink="{{ appRoute.offer.ADD_OFFER }}">
              {{editMode ? "Update Offer" : "Add Offer"}}
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <div class="card mt-4">
    <div class="card-body">
      <form (ngSubmit)="onSubmit()" [formGroup]="offerForm">
        <div class="row">

          <div class="mb-4">
            <h2 class="form-title">Offer Details</h2>
          </div>

          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3 required">Name</label>
              <input type="text" class="form-control fs-6" formControlName="name" [ngClass]="{
                    'is-invalid':
                    (of.name.touched || isSubmitted) &&
                    of.name.errors?.required
                  }" />
            </div>
          </div>

          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3 required">Description</label>
              <input type="text" class="form-control fs-6" formControlName="description" [ngClass]="{
                    'is-invalid':
                    (of.description.touched || isSubmitted) &&
                    of.description.errors?.required
                  }" />
            </div>
          </div>

          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3 required">Type</label>
              <select class="form-select fs-6" formControlName="type" [ngClass]="{
                         'is-invalid': (of.type.touched || isSubmitted) && of.type.errors?.required}">
                <option value="" disabled>-- Select an option --</option>
                <option value="%">%</option>
                <option value="Flat">Flat</option>
              </select>
            </div>
          </div>

          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3 required">Value</label>
              <input type="number" min="0" class="form-control fs-6" formControlName="value"
                (change)="validateValue($event.target)" [ngClass]="{
                    'is-invalid': (of.value.touched || isSubmitted) && of.value.errors?.required}" />
              <label class="fs-6 text-danger" *ngIf="!isValidValue">{{error_message}}</label>
            </div>
          </div>

          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3 required">Start Date</label>
              <input type="date" class="form-control fs-6" [min]="startDate" formControlName="fromDate" [ngClass]="{
                      'is-invalid':
                        (of.fromDate.touched || isSubmitted) &&
                        of.fromDate.errors?.required
                    }" />
            </div>
          </div>

          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3 required">End Date</label>
              <input type="date" [min]="fromDate" class="form-control fs-6" formControlName="lastDate"
                [ngClass]="{ 'is-invalid': (of.lastDate.touched || isSubmitted) && of.lastDate.errors?.required }" />
            </div>
          </div>

          <div class="col-lg-12">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Products</label>
              <ng-select [items]="productsdata" bindLabel="name" bindValue="_id" [(ngModel)]="products"
                placeholder="Select products applicable to coupon" [multiple]=true
                [ngModelOptions]="{standalone: true}">
              </ng-select>
            </div>
          </div>

          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Categories</label>
              <ng-select [items]="categoriesdata" bindLabel="name" bindValue="_id" [(ngModel)]="categories"
                placeholder="Select categories applicable to offer" [multiple]=true
                [ngModelOptions]="{standalone: true}">
              </ng-select>
            </div>
          </div>

          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Collections</label>
              <ng-select [items]="collectionsdata" bindLabel="name" bindValue="_id" [(ngModel)]="collections"
                placeholder="Select collections applicable to offer" [multiple]=true
                [ngModelOptions]="{standalone: true}">
              </ng-select>
            </div>
          </div>

          <div class="col-lg-6">
            <div class="form-group">
              <label class="fs-6 mb-3">Featured Offer?</label>
              <select class="form-select mb-3 fs-6" formControlName="isFeatured">
                <option value="true" selected>Yes</option>
                <option value="false">No</option>
              </select>
            </div>
          </div>

          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Active Offer?</label>
              <select class="form-select mb-3 fs-6" formControlName="isActive">
                <option value="true" selected>Yes</option>
                <option value="false">No</option>
              </select>
            </div>
          </div>

          <div class="mb-4">
            <h2 class="form-title">Offer Styles</h2>
          </div>

          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Background</label>
              <input type="color" class="form-control fs-6" style="height: 50px;" formControlName="background"
                (change)="getColors('background', $event.target)" />
            </div>
          </div>

          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Border</label>
              <input type="color" class="form-control fs-6" formControlName="border" style="height: 50px;"
                (change)="getColors('border', $event.target)" />
            </div>
          </div>

          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Border Radius</label>
              <input type="number" placeholder="Eg. 2" class="form-control fs-6" formControlName="radius" />
            </div>
          </div>

          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Color</label>
              <input type="color" class="form-control fs-6" style="height: 50px;" formControlName="color"
                (change)="getColors('color', $event.target)" />
              <span>{{color}}</span>
            </div>
          </div>

          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Font Weight</label>
              <input type="number" placeholder="Eg. 400" class="form-control fs-6" formControlName="fontWeight" />
            </div>
          </div>

          <div class="col-lg-6">
            <div class="form-group mb-3">
              <label class="fs-6 mb-3">Font Size ( in px )</label>
              <input type="number" placeholder="Eg. 14" class="form-control fs-6" formControlName="fontSize" />
            </div>
          </div>

          <div class="col-lg-6">
            <div class="col-12">
              <h3 class="required form-title">Media</h3>
            </div>
            <div class="form-group">
              <div class="image-upload">
                <input type="file" class="form-control fs-6" name="image" accept="image/*"
                  (change)="handleInputChange($event)" style="height: 100px;" required>
                <div class="image-upload-div">
                  <div class="left-img"><img src="../../../../../assets/media/svg/files/upload.svg" alt="" srcset="">
                  </div>
                  <div class="right-text d-flex flex-column"><span class="right-text-title fs-4 fw-bolder">Click to
                      upload</span> <span class="right-text-note fs-7 text-gray-400" style="font-weight: 500">Upload
                      up to 1
                      file</span></div>
                </div>
              </div>
            </div>
          </div>
          <ng-container *ngIf="loadImage">
            <div class="col-12 preview-section">
              <div class="crop-image col-sm-6">
                <image-cropper class="crop-section" [imageChangedEvent]="imageChangedEvent" [maintainAspectRatio]="true"
                  [aspectRatio]="3 / 3" [cropperMaxWidth]="1600" [cropperMaxHeight]="1600" format="png"
                  (imageCropped)="imageCropped($event)" (imageLoaded)="imageLoaded()" (cropperReady)="cropperReady()"
                  (loadImageFailed)="loadImageFailed()">
                </image-cropper>
              </div>
              <div class="uploads uploaded col-sm-6">
                <div class="close-icon">
                  <i class="bi bi-x-lg text-white" (click)="removeImage()"></i>
                </div>
                <img class="preview-img" id="previewImage" [src]="croppedImage">
              </div>
            </div>
          </ng-container>
          <div class="col-12 d-flex align-items-center justify-content-end">
            <a routerLink="{{ appRoute.offer.OFFER_LIST}}" class=" btn btn-secondary btn-sm fs-6 text-dark"
              style="width: 200px; margin-right: 20px;">
              Cancel
            </a>
            <button type="submit" class="btn btn-primary btn-sm fs-6" style="width: 200px">
              Update
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
