<div class="content container-fluid">
  <!-- Page Header -->
  <div class="page-header">
    <div class="row align-items-center">
      <div class="col">
        <h3 class="page-title fs-2">
          {{ editMode ? "Update Offer" : "Add Offer" }}
        </h3>
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-5">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item fs-5">
            <a routerLink="{{ appRoute.offer.OFFER_LIST }}">Offers</a>
          </li>
          <li class="breadcrumb-item active fs-5">
            <a routerLink="{{ appRoute.offer.UPDATE_OFFER }}" [queryParams]="{ offer: offer }">
              {{ editMode ? "Update Offer" : "Add Offer" }}
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <div class="row mt-10">
    <div class="col-sm-12 fs-5">
      <div class="card">
        <div class="card-body">
          <form (ngSubmit)="onSubmit()" [formGroup]="offerForm">
            <div class="row">
              <div class="col-12">
                <h5 class="form-title fs-4"><span>Offer Details</span></h5>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3 form-title required">Name</label>
                  <input type="text" class="form-control fs-5" formControlName="name" />
                </div>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3 form-title required">Description</label>
                  <input type="text" class="form-control fs-5" formControlName="description" />
                </div>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3 form-title required">From Date</label>
                  <input type="date" class="form-control fs-5" formControlName="fromDate"
                  (change)="validateDate()" />
                </div>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3 form-title required">Last Date</label>
                  <input type="date" class="form-control fs-5" formControlName="lastDate"
                    (change)="validateDate()" />
                </div>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                   <label class="fs-5 mb-3 form-title required">Products</label>
                   <ng-select [items]="productsData" bindLabel="name" bindValue="_id" [(ngModel)]="products"
                      placeholder="Select products applicable to coupon" [multiple]=true
                      [ngModelOptions]="{standalone: true}" [compareWith]="compareFn">
                   </ng-select>
                </div>
             </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3 form-title">Featured Offer?</label>
                  <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg"
                    formControlName="isFeatured">
                    <option value="true" selected>Yes</option>
                    <option value="false">No</option>
                  </select>
                </div>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3 form-title">Active Offer?</label>
                  <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg"
                    formControlName="isActive">
                    <option value="true" selected>Yes</option>
                    <option value="false">No</option>
                  </select>
                </div>
              </div>
              <div class="col-12">
                <h5 class="form-title fs-4"><span>Offer Styles</span></h5>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Background</label>
                  <input type="color" placeholder="Category name" class="form-control fs-5" style="height: 50px;"
                    formControlName="background" (change)="getColors('background', $event.target)" />
                  <span>{{background}}</span>
                </div>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Border</label>
                  <input type="color" placeholder="Category name" class="form-control fs-5" formControlName="border"
                    style="height: 50px;" (change)="getColors('border', $event.target)" />
                  <span>{{border}}</span>
                </div>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Border Radius</label>
                  <input type="number" placeholder="2" class="form-control fs-5" formControlName="radius" />
                </div>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Color</label>
                  <input type="color" placeholder="Category name" class="form-control fs-5" style="height: 50px;"
                    formControlName="color" (change)="getColors('color', $event.target)" />
                  <span>{{color}}</span>
                </div>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Font Weight</label>
                  <input type="number" placeholder="400" class="form-control fs-5" formControlName="fontWeight" />
                </div>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="fs-5 mb-3">Font Size ( in px )</label>
                  <input type="number" placeholder="14" class="form-control fs-5" formControlName="fontSize" />
                </div>
              </div>
              <div class="col-12 col-sm-6">
                <div class="col-12">
                  <h3 class="form-title required"><span>Media</span></h3>
                </div>
                <div class="form-group col-12">
                  <div class="image-upload col-sm-6">
                    <input type="file" class="form-control fs-5" name="image" accept="image/*"
                      (change)="handleInputChange($event)"
                      onchange="document.getElementById('previewImage').src = window.URL.createObjectURL(this.files[0])"
                      style="height: 100px;" required>
                    <div class="image-upload-div">
                      <div class="left-img"><img src="../../../../../assets/media/svg/files/upload.svg" alt=""
                          srcset=""></div>
                      <div class="right-text d-flex flex-column">
                        <span class="right-text-title fs-4 fw-bolder">Click to upload</span>
                        <span class="right-text-note fs-7 text-gray-400">Upload up to 1 file</span>
                      </div>
                    </div>
                  </div>
                  <div class="uploaded-image col-sm-6 mt-5">
                    <img src="{{image}}" alt="" style="width: 150px; height: 150px">
                  </div>
                </div>
              </div>
              <ng-container *ngIf=" loadImage">
                <div class="col-12 preview-section">
                  <div class="crop-image col-sm-6">
                    <image-cropper class="crop-section" [imageChangedEvent]="imageChangedEvent"
                      [maintainAspectRatio]="true" [aspectRatio]="3 / 3" [cropperMaxWidth]="1600"
                      [cropperMaxHeight]="1600" format="png" (imageCropped)="imageCropped($event)"
                      (imageLoaded)="imageLoaded()" (cropperReady)="cropperReady()"
                      (loadImageFailed)="loadImageFailed()">
                    </image-cropper>
                  </div>
                  <div class="uploads uploaded col-sm-6">
                    <div class="close-icon">
                      <i class="bi bi-x-lg text-white" (click)="removeImage()"></i>
                    </div>
                    <img class="preview-img" id="previewImage" [src]="croppedImage">
                  </div>
                </div>
              </ng-container>
              <div class="col-12">
                <a routerLink="{{ appRoute.offer.OFFER_LIST}}" class=" btn btn-secondary btn-sm fs-5 text-dark"
                  style="width: 200px; margin-right: 20px;">
                  Cancel
                </a>
                <button type="submit" class="btn btn-primary btn-sm fs-5" style="width: 200px">
                  Update
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <!-- Form End -->
</div>
