<div class="offer-page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="page-title">
      <h1 class="fw-bolder">Offers</h1>
    </div>
    <div class="row align-items-center">
      <div class="col d-flex flex-row justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item active fs-6">
            <a routerLink="{{ appRoute.offer.OFFER_LIST }}">Offers</a>
          </li>
        </ul>
        <button class="btn btn-primary cursor-pointer fs-6" style="width: 200px;" color="primary"
          routerLink="{{ appRoute.offer.ADD_OFFER }}" style="width: 200px">
          Add Offer
        </button>
      </div>
    </div>
  </div>
  <!-- Page Header -->
  <hr class="horizontal-line">
  <!-- Form start -->
  <div class="offer-form-container">
    <form [formGroup]="offerform">
      <div class="col-12 row" style="display: flex; align-items: flex-end;">
        <div class="search-input col-sm-2">
          <label class="fs-6">Search</label>
          <input type="text" placeholder="Search for offers here..." class="form-control fs-6" formControlName="name"
            (ngModelChange)="searchOffer()">
        </div>
        <div class="search-status col-sm-2">
          <label class="fs-6">Status</label>
          <select name="" id="" class="form-select fs-6" formControlName="isActive" (change)="searchOffer()">
            <option value="">Select an option</option>
            <option value=true>Active</option>
            <option value=false>Inactive</option>
          </select>
        </div>
        <div class="search-featured col-sm-2">
          <label class="fs-6 form-title">Featured</label>
          <select name="" id="" class="form-select fs-6" formControlName="isFeatured" (change)="searchOffer()">
            <option value="">Select an option</option>
            <option value=true>Featured</option>
            <option value=false>Non featured</option>
          </select>
        </div>
        <div class="search-featured col-sm-2">
          <label class="fs-6 form-title">From Date</label>
          <input type="date" class="form-control fs-6" formControlName="fromDate" (change)="searchOffer()">
        </div>
        <div class="search-featured col-sm-2">
          <label class="fs-6 form-title">To Date</label>
          <input type="date" class="form-control fs-6" formControlName="lastDate" (change)="searchOffer()">
        </div>
        <div class="search-submit col-sm-2">
          <button type="button" class="form-control fs-6 bg-secondary text-dark" (click)="onReload()"
            style="outline: none; border: none;">Clear</button>
        </div>
      </div>
    </form>
  </div>
  <!-- Form end -->
  <hr class="horizontal-line">
  <div class="total-count-container" *ngIf="count != 0">
    <h3>{{totalcount}} offers</h3>
  </div>
  <!-- Card start -->
  <div class="offer-card-container view-container">
    <ng-container *ngFor="let offer of offers">
      <div class="offer-card">
        <div class="offer-details">
          <div class="offer-image">
            <img src='{{base}}/{{offer?.file}}' alt="offer image" srcset="" />
          </div>
          <div class="flex-1">
            <div class="offer-name">{{offer?.name}}</div>
            <div class="offer-featured-{{offer?.isFeatured}}">
              <ng-container *ngIf="offer?.isFeatured == true">Featured</ng-container>
              <ng-container *ngIf="offer?.isFeatured == false">Not Featured</ng-container>
            </div>
            <div class="offer-from-date">From : <span>{{offer?.fromDate}}</span></div>
            <div class="offer-last-date">To : <span>{{offer?.lastDate}}</span></div>
          </div>
        </div>
        <div class="flex-21">
          <div class="offer-status-{{offer?.isActive}}">
            <ng-container *ngIf="offer?.isActive == true">Active</ng-container>
            <ng-container *ngIf="offer?.isActive == false">Inactive</ng-container>
          </div>
          <div class="card-edit-btn">
            <button routerLink="{{ appRoute.offer.UPDATE_OFFER }}" [queryParams]="{ offer: offer?.slug }"
              class="fs-5 cursor-pointer text-darker">
              Edit
            </button>
          </div>
        </div>
      </div>
    </ng-container>
    <ng-container *ngIf="count == 0">
      <div class="no-data-container">
        <h2>Sorry, we haven't found any data</h2>
      </div>
    </ng-container>
  </div>
  <!-- Card end -->
  <!-- Pagination start -->
  <nav aria-label="Page navigation example" *ngIf="count != 0">
    <ul class="pagination-container">
      <div class="page-change-icon" *ngIf="selectedpage != 1 &&  selectedpage > 0">
        <a class="page-link" (click)="loadPrevious()" aria-label="Previous">
          <i class="bi bi-arrow-left-circle"></i>
        </a>
      </div>
      <li class="page-item" *ngFor="let key of pages">
        <a *ngIf="selectedpage != key" class="page-link" (click)="fetchOffer(key, limit)">{{key}}</a>
        <a *ngIf="selectedpage == key" class="page-link page-active" (click)="fetchOffer(key, limit)">{{key}}</a>
      </li>
      <div class="page-change-icon" *ngIf="selectedpage != totaldata">
        <a class="page-link" (click)="loadNext()" aria-label="Next">
          <i class="bi bi-arrow-right-circle"></i>
        </a>
      </div>
    </ul>
  </nav>
  <!-- Pagination end -->
</div>
