<div class="offer-page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="page-title">
      <h1 class="fw-bolder">Offers</h1>
    </div>
    <div class="row align-items-center">
      <div class="col d-flex flex-row justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item active fs-6">
            <a routerLink="{{ appRoute.offer.OFFER_LIST }}">Offers</a>
          </li>
        </ul>
        <button class="btn btn-primary cursor-pointer fs-6" style="width: 200px;" color="primary"
          routerLink="{{ appRoute.offer.ADD_OFFER }}" style="width: 200px">
          Add Offer
        </button>
      </div>
    </div>
  </div>
  <!-- Page Header -->

  <!-- Table Start -->
  <div class="row">
    <div class="col-sm-12">
      <div class="card card-table">
        <div class="card-body">
          <div style="display: none"> {{offerData.length}}</div>
          <div class="table-responsive" *ngIf="displayTable">
            <table datatable [dtOptions]="dtOptions"
              class="datatable table table-borderless table-center table-row-dashed mb-0">
              <thead class="thead">
                <tr class="fs-7 text-uppercase">
                  <th class="text-gray-400 col-md-2">Sl No.</th>
                  <th class="text-gray-400 col-md-2">Offer</th>
                  <th class="text-gray-400 col-md-2">Description</th>
                  <th class="text-gray-400 col-md-2">Image</th>
                  <th class="text-gray-400 col-md-2">Valid From</th>
                  <th class="text-gray-400 col-md-2">Valid To</th>
                  <th class="text-gray-400 col-md-2">Featured</th>
                  <th class="text-gray-400 col-md-2">Status</th>
                  <th class="text-gray-400 col-md-2">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let offer of offerData; let i = index">
                  <td>
                    <h2 class="table-avatar">{{ i + 1 }}</h2>
                  </td>
                  <td>
                    <h2 class="table-avatar fs-6">{{ offer?.name }}</h2>
                  </td>
                  <td>
                    <h2 class="table-avatar fs-6">{{ offer?.description }}</h2>
                  </td>
                  <td>
                    <img class="offer-image" src="http://localhost:3000/{{offer?.file}}" alt="offer" />
                  </td>
                  <td>
                    <h2 class="table-avatar fs-6">{{ offer?.fromDate }}</h2>
                  </td>
                  <td>
                    <h2 class="table-avatar fs-6">{{ offer?.lastDate }}</h2>
                  </td>
                  <td>
                    <ng-container *ngIf="offer?.isFeatured == true">
                      <h2 class="table-avatar avatar-item fs-6">Yes</h2>
                    </ng-container>
                    <ng-container *ngIf="offer?.isFeatured == false">
                      <h2 class="table-avatar avatar-item fs-6">No</h2>
                    </ng-container>
                  </td>
                  <td>
                    <ng-container *ngIf="offer?.isActive == true">
                      <div class="active-text-view"><span class="active-text">active</span></div>
                    </ng-container>
                    <ng-container *ngIf="offer?.isActive == false">
                      <div class="inactive-text-view"><span class="inactive-text">inactive</span></div>
                    </ng-container>
                  </td>
                  <td>
                    <a class="fs-6 h-100 cursor-pointer table-avatar text-darker"
                      routerLink="{{ appRoute.offer.UPDATE_OFFER }}" [queryParams]="{ offer: offer?.slug }">
                      <i class="bi bi-pen"></i> Edit
                    </a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Table Start -->
</div>
