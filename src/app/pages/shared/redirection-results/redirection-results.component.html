<div>
    <div class="p-3 cursor-pointer border border-secondary w-100 form-control" (click)="open(template)">
        <span *ngIf="!redirectionResult" class="text-muted">Quick search</span>
        <span *ngIf="redirectionResult">{{redirectionResult}}</span>
    </div>
</div>

<ng-template #template>
    <div class="modal-body">
        <div class="d-flex align-items-center justify-content-between">
            <div>
                <svg height="20" width="20" data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor"
                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z">
                    </path>
                </svg>
            </div>
            <div class="form-group flex-grow-1">
                <input type="text" [formControl]="keyword" placeholder="Search items" class="form-control border-0" />
            </div>
            <div (click)="close()">
                <code class="shadow-none cursor-pointer">Esc</code>
            </div>
        </div>
        <div class="mt-4 pt-4 border-top border-secondary searchResults" *ngIf="resultsExists()">
            <div class="mb-4" *ngIf="brands.length > 0">
                <div class="fs-4 text-primary mb-1 fw-bold">Brands</div>
                <ng-container *ngFor="let brand of brands; let i = index">
                    <div (click)="onResultClick('brands', brand)"
                        class="p-3 mb-1 fs-5 cursor-pointer rounded resultBackground d-flex align-items-center justify-content-between">
                        <div>{{brand.name}}</div>
                        <div>
                            <svg height="18" width="18" data-slot="icon" fill="none" stroke-width="1.5"
                                stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5">
                                </path>
                            </svg>
                        </div>
                    </div>
                </ng-container>
            </div>
            <div class="mb-4" *ngIf="categories.length > 0">
                <div class="fs-4 text-primary mb-1 fw-bold">Categories</div>
                <ng-container *ngFor="let category of categories; let i = index">
                    <div (click)="onResultClick('categories', category)"
                        class="p-3 mb-1 fs-5 cursor-pointer rounded resultBackground d-flex align-items-center justify-content-between">
                        <div>{{category.name}}</div>
                        <div>
                            <svg height="18" width="18" data-slot="icon" fill="none" stroke-width="1.5"
                                stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5">
                                </path>
                            </svg>
                        </div>
                    </div>
                </ng-container>
            </div>
            <div class="mb-4" *ngIf="collections.length > 0">
                <div class="fs-4 text-primary mb-1 fw-bold">Collections</div>
                <ng-container *ngFor="let collection of collections; let i = index">
                    <div (click)="onResultClick('collections', collection)"
                        class="p-3 mb-1 cursor-pointer fs-5 rounded resultBackground d-flex align-items-center justify-content-between">
                        <div>{{collection.name}}</div>
                        <div>
                            <svg height="18" width="18" data-slot="icon" fill="none" stroke-width="1.5"
                                stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5">
                                </path>
                            </svg>
                        </div>
                    </div>
                </ng-container>
            </div>
            <div class="mb-4" *ngIf="products.length > 0">
                <div class="fs-4 text-primary mb-1 fw-bold">Products</div>
                <ng-container *ngFor="let product of products; let i = index">
                    <div (click)="onResultClick('products', product)"
                        class="p-3 mb-1 cursor-pointer rounded resultBackground d-flex align-items-center justify-content-between">
                        <div>
                            <div class="fs-5">{{product.name}}</div>
                            <div class="text-muted">{{product.sku}}</div>
                        </div>
                        <div>
                            <svg height="18" width="18" data-slot="icon" fill="none" stroke-width="1.5"
                                stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5">
                                </path>
                            </svg>
                        </div>
                    </div>
                </ng-container>
            </div>
            <div class="mb-4" *ngIf="staticPages.length > 0">
                <div class="fs-4 text-primary mb-1 fw-bold">Static Pages</div>
                <ng-container *ngFor="let staticPage of staticPages; let i = index">
                    <div (click)="onResultClick('staticPages', staticPage)"
                        class="p-3 mb-1 cursor-pointer fs-5 rounded resultBackground d-flex align-items-center justify-content-between">
                        <div> {{staticPage.title}}</div>
                        <div>
                            <svg height="18" width="18" data-slot="icon" fill="none" stroke-width="1.5"
                                stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5">
                                </path>
                            </svg>
                        </div>
                    </div>
                </ng-container>
            </div>
        </div>
    </div>
</ng-template>
