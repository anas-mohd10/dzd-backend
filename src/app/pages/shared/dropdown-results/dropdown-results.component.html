<div class="position-relative">
    <div class="form-group">
        <input type="text" autocomplete="off" class="form-control" placeholder="Search for {{type}}" id="keyword"
            [formControl]="keyword">
    </div>
    <div class="position-absolute bg-white p-3 border rounded-3 shadow-sm w-75"
        style="top: 100%; left: 0; right: 0; z-index: 1000;" *ngIf="dropdownResults && dropdownResults.length > 0">
        <div class="dropdown-results">
            <ng-container *ngFor="let dropdownResult of dropdownResults; let i = index">
                <div class="d-flex justify-content-between my-6"  *ngIf="type == 'products'">
                    <div class="d-flex gap-4">
                        <img height="60" width="60" src="{{imageBase}}{{dropdownResult.thumbnail}}"
                            onerror="this.src='assets/images/default.png'" class="rounded border border-secondary"
                            alt={{dropdownResult.name}}>
                        <div class="d-flex flex-column gap-1">
                            <div class="fs-5">{{dropdownResult.name}}</div>
                            <div class="fs-6">SKU : {{dropdownResult.sku}}</div>
                            <div class="fs-6">Price : {{dropdownResult.price.selling}}</div>
                            <div class="fs-6">Stock : {{dropdownResult.stock}}</div>
                        </div>
                    </div>
                    <div>
                        <button class="btn btn-secondary p-1 fs-6"
                            [ngClass]="{'btn-danger': isItemExists(dropdownResult)}"
                            (click)="onSelectItem(dropdownResult, isItemExists(dropdownResult))">
                            {{isItemExists(dropdownResult) ? 'Remove Item' : 'Select Item'}}
                        </button>
                    </div>
                </div>
                <div class="d-flex justify-content-between my-3"
                    *ngIf="['brands', 'categories', 'collections'].includes(type)">
                    <div class="d-flex align-items-center gap-4">
                        <img height="40" width="40" class="rounded border border-secondary"
                            src="{{imageBase}}{{dropdownResult.thumbnail}}"
                            onerror="this.src='assets/images/default.png'" alt={{dropdownResult.name}}>
                        <div>
                            <h3 class="fs-6">{{dropdownResult.name}}</h3>
                        </div>
                    </div>
                    <div>

                        <button class="btn btn-secondary p-1 fs-6"
                            [ngClass]="{'btn-danger': isItemExists(dropdownResult)}"
                            (click)="onSelectItem(dropdownResult, isItemExists(dropdownResult))">
                            {{isItemExists(dropdownResult) ? 'Remove Item' : 'Select Item'}}
                        </button>
                    </div>
                </div>
                <div class="d-flex justify-content-between"  *ngIf="type == 'collections'"></div>
            </ng-container>
        </div>
    </div>
</div>
