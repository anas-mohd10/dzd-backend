<div class="position-relative">
    <div class="form-group">
        <label for="keyword">Keyword</label>
        <input type="text" class="form-control" placeholder="Search for {{type}}" id="keyword" [formControl]="keyword">
    </div>
    <div class="position-absolute bg-white p-3 border rounded-3 shadow-sm" style="top: 100%; left: 0; right: 0; z-index: 1000;">
        <ng-container *ngIf="dropdownResults && dropdownResults.length == 0">
            No results found
        </ng-container>
        <div class="dropdown-results" *ngIf="dropdownResults && dropdownResults.length > 0">
            <ng-container *ngFor="let dropdownResult of dropdownResults; let i = index">
                <div class="d-flex justify-content-between my-3 mx-2"  *ngIf="type == 'products'">
                    <div class="d-flex gap-4">
                        <img height="60" width="60" src="{{imageBase}}{{dropdownResult.thumbnail}}" onerror="this.src='assets/images/default.png'" alt="Product Image">
                        <div>
                            <h3 class="fw-bold">{{dropdownResult.name}}</h3>
                            <p>SKU : {{dropdownResult.sku}}</p>
                            <p>Price : {{dropdownResult.price.mrp}}, Selling Price : {{dropdownResult.price.selling}}
                            </p>
                            <span
                                class="fs-6 badge bg-{{dropdownResult.stock && dropdownResult.stock > 0 ? 'success' : 'danger'}}">{{dropdownResult.stock
                                && dropdownResult.stock > 0 ? 'In Stock' : 'Out of Stock'}}</span>
                        </div>
                    </div>
                    <div>
                        <button class="btn btn-secondary" (click)="onSelectItem(dropdownResult)">Select Item</button>
                    </div>
                </div>
                <div class="d-flex justify-content-between my-3" *ngIf="['brands', 'categories', 'collections'].includes(type)">
                    <div class="d-flex gap-4">
                        <img height="60" width="60" src="{{imageBase}}{{dropdownResult.thumbnail}}" onerror="this.src='assets/images/default.png'" alt="Product Image">
                        <div>
                            <h3 class="fw-bold">{{dropdownResult.name}}</h3>
                        </div>
                    </div>
                    <div>
                        
                        <button class="btn btn-secondary" (click)="onSelectItem(dropdownResult)">Select Item</button>
                    </div>
                </div>
                <div class="d-flex justify-content-between"  *ngIf="type == 'collections'"></div>
            </ng-container>
        </div>
    </div>
</div>
