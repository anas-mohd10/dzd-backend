<div class="content container-fluid">
   <div class="page-header">
      <div class="row align-items-center">
         <div class="col">
            <h3 class="page-title fw-bolder fs-2">
               {{ editMode ? "Update social media links" : "Add social media links" }}
            </h3>
            <ul class="breadcrumb">
               <li class="breadcrumb-item fs-6">
                  <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
               </li>
               <li class="breadcrumb-item fs-6">
                  <a routerLink="{{ appRoute.socialMedia.SOCIAL_MEDIA_LIST}}">Social media links</a>
               </li>
               <li class="breadcrumb-item active fs-6">
                  <a routerLink="{{ appRoute.socialMedia.ADD_SOCIAL_MEDIA_LIST}}">
                     {{ editMode ? "Update social media links" : "Add social media links"}}
                  </a>
               </li>
            </ul>
         </div>
      </div>
   </div>
   <div class="col-sm-12 fs-6">
      <div class="card">
         <div class="card-body">
            <form (ngSubmit)="onSubmit()" [formGroup]="socialMediaForm">
               <div class="row">
                  <div class="col-12">
                     <h5 class="form-title fs-4"><span>Social media links</span></h5>
                  </div>
               </div>
            </form>
         </div>
      </div>
   </div>
</div>
