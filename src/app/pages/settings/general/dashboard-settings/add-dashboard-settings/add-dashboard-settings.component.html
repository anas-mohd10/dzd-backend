<div class="content container-fluid">
   <div class="page-header">
      <div class="row align-items-center">
         <div class="col">
            <h3 class="page-title fw-bolder fs-2">
               {{ editMode ? "Update Home Settings" : "Add Home Settings" }}
            </h3>
            <ul class="breadcrumb">
               <li class="breadcrumb-item fs-5">
                  <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
               </li>
               <li class="breadcrumb-item fs-5">
                  <a routerLink="{{ appRoute.dashboardSettings.DASHBOARD_SETTINGS_LIST }}">Home Settings</a>
               </li>
               <li class="breadcrumb-item active fs-5">
                  <a routerLink="{{ appRoute.dashboardSettings.ADD_DASHBOARD_SETTINGS }}">
                     {{ editMode ? "Update Home Settingss" : "Add Home Settings"}}
                  </a>
               </li>
            </ul>
         </div>
      </div>
   </div>
   <div class="page-container">
      <div class="col-sm-12 fs-5 mt-10">
         <div class="card">
            <div class="card-body">
               <form [formGroup]="homeSettingsForm">
                  <div class="row">
                     <div class="col-12">
                        <h3 class="form-title">App Home Settings</h3>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-5 mb-3">Carausel</label>
                           <input type="number" placeholder="1" class="form-control fs-5" formControlName="carausel"
                              min="1" />
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-5 mb-3">Category</label>
                           <input type="number" placeholder="2" class="form-control fs-5" formControlName="category"
                              min="1" />
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-5 mb-3">Collections</label>
                           <input type="number" placeholder="3" class="form-control fs-5" formControlName="collection"
                              min="1" />
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-5 mb-3">Banners</label>
                           <input type="number" placeholder="4" class="form-control fs-5" formControlName="banners"
                              min="1" />
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-5 mb-3">Brands</label>
                           <input type="number" placeholder="5" class="form-control fs-5" formControlName="brands"
                              min="1" />
                        </div>
                     </div>
                     <div class="col-12 col-sm-6">
                        <div class="form-group">
                           <label class="fs-5 mb-3">Products</label>
                           <input type="number" placeholder="6" class="form-control fs-5" formControlName="products"
                              min="1" />
                        </div>
                     </div>
                     <div class="col-12">
                        <a routerLink="{{ appRoute.appSettings.APP_SETTINGS_LIST    }}"
                           class=" btn btn-secondary btn-sm fs-5 text-dark" style="width: 200px; margin-right: 20px;">
                           Cancel
                        </a>
                        <button type="submit" class="btn btn-primary btn-sm fs-5" style="width: 200px"
                           (click)="onSubmit()">
                           Add
                        </button>
                     </div>
                  </div>
               </form>
            </div>
         </div>
      </div>
   </div>
</div>
