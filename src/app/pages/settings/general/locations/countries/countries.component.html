<div>
    <div class="page-header d-flex align-items-start justify-content-between">
        <div>
            <div class="page-title">
                <h1 class="fw-bold">Countries</h1>
            </div>
            <ul class="breadcrumb">
                <li class="breadcrumb-item fs-6">
                    <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                </li>
                <li class="breadcrumb-item active fs-6">
                    <a routerLink="{{ appRoute.countries }}">Countries</a>
                </li>
            </ul>
        </div>

        <div class="d-flex align-items-center justify-content-end gap-2">
            <button class="btn btn-secondary" (click)="openBulkImport(bulkImportTemplate)">Import Locations</button>
            <button class="btn btn-primary" (click)="open(template)">Add Country</button>
        </div>
    </div>

    <div class="my-4">
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Code</th>
                    <th>Phone Code</th>
                    <th>&nbsp;</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let country of dbCountries">
                    <td>{{ country.name }}</td>
                    <td>{{ country.code }}</td>
                    <td>{{country.phoneCode}}</td>
                    <td>
                        <div class="d-flex align-items-center justify-content-start gap-2">
                            <button routerLink="{{appRoute.states + '/' + country._id}}"
                                class="btn btn-secondary py-1 px-2 d-flex align-items-center justify-content-center gap-2">
                                View States
                            </button>
                            <button (click)="openConfirmation(confirmation, country._id)"
                                class="btn btn-danger py-1 px-2 d-flex align-items-center justify-content-center gap-2">
                                <span>Delete</span>
                                <span>
                                    <svg height="16" width="16" data-slot="icon" fill="none" stroke-width="1.5"
                                        stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                        aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0">
                                        </path>
                                    </svg>
                                </span>
                            </button>
                        </div>
                    </td>
                </tr>
                <tr *ngIf="dbCountries.length === 0">
                    <td colspan="3" class="text-center">
                        <app-no-results></app-no-results>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <app-pagination [totalPages]="totalPages" [totalResults]="totalResults" [pageIndex]="pageIndex"
        [pageSize]="pageSize" (pageTrigger)="onPageTriggered($event)"></app-pagination>
</div>

<ng-template #template>
    <div class="modal-header">
        <h4 class="modal-title pull-left">Country Details</h4>
        <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="modalRef?.hide()">
            <span aria-hidden="true" class="visually-hidden">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <form [formGroup]="form">
            <div class="form-group">
                <label for="name" class="fs-6 mb-3">Name</label>
                <select class="form-control" (change)="changeCountry($event)" formControlName="name">
                    <option value="" disabled>Select Country</option>
                    <option *ngFor="let country of countries" [value]="country.name">{{ country.name }}</option>
                </select>
            </div>
            <div class="form-group my-4">
                <label for="name" class="fs-6 mb-3">Code</label>
                <input type="text" class="form-control pe-none" formControlName="code" placeholder="Enter Country Code">
            </div>
            <div class="d-flex align-items-center justify-content-end gap-2">
                <button class="btn btn-secondary" (click)="close()">Cancel</button>
                <button class="btn btn-primary" (click)="saveChanges()">Save changes</button>
            </div>
        </form>
    </div>
</ng-template>

<ng-template #bulkImportTemplate>
    <div class="modal-header">
        <h4 class="modal-title pull-left">Import Locations</h4>
    </div>
    <div class="modal-body">
        <div>
            <button class="btn btn-secondary w-100 d-flex align-items-center justify-content-center gap-2"
                (click)="downloadSampleFile()">
                <svg height="18" width="18" data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor"
                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3">
                    </path>
                </svg>
                <span>Download sample CSV</span>
            </button>
            <div class="form-group my-6">
                <input [formControl]="importFile" type="file" class="form-control" (change)="changeImportFile($event)"
                    accept=".csv">
            </div>
            <div *ngIf="importFile.value" class="text-muted my-4 d-flex align-items-center justify-content-between">
                <div class="fs-5">{{importFile.value?.name}}</div>
                <button class="btn btn-danger p-2" (click)="removeImportFile()">
                    Remove
                </button>
            </div>
        </div>
        <div class="d-flex align-items-center justify-content-end gap-2">
            <button class="btn btn-secondary" (click)="closeBulkImport()">Cancel</button>
            <button class="btn btn-primary" (click)="importCountries()" [disabled]="!importFile.value">Save
                Changes</button>
        </div>
    </div>
</ng-template>

<ng-template #confirmation>
    <div class="modal-body text-center">
        <p>Do you want to confirm?</p>
        <button type="button" class="btn btn-default" (click)="confirm()">Yes</button>
        <button type="button" class="btn btn-primary" (click)="decline()">No</button>
    </div>
</ng-template>
