<div class="content container-fluid">

   <div class="page-header">
      <div class="page-title">
         <h1 class="fw-bolder"> {{ editMode ? "Update Contact" : "Add Contact"}} </h1>
      </div>
      <div class="row align-items-center">
         <div class="col d-flex align-items-start justify-content-between">
            <ul class="breadcrumb">
               <li class="breadcrumb-item fs-6">
                  <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
               </li>
               <li class="breadcrumb-item fs-6">
                  <a routerLink="{{ appRoute.contacts.CONTACTS_LIST }}">Contacts</a>
               </li>
               <li class="breadcrumb-item active fs-6">
                  <a routerLink="{{ appRoute.contacts.ADD_CONTACTS_LIST }}">
                     {{ editMode ? "Update Contact" : "Add Contact"}}
                  </a>
               </li>
            </ul>
         </div>
      </div>
   </div>

   <div class="row mt-4">
      <div class="col-12">
         <div class="card">
            <div class="card-body">
               <form [formGroup]="form">
                  <div class="row">

                     <h2 class="fw-bolder">Contact Details</h2>

                     <div class="col-lg-6">
                        <div class="form-group mb-3">
                           <label class="fs-6 mb-3 required"> Name</label>
                           <input type="text" class="form-control fs-6" formControlName="name" [ngClass]="{
                              'is-invalid':
                              (ctf.name.touched || isSubmitted) &&
                              ctf.name.errors?.required
                            }" />
                        </div>
                     </div>

                     <div class="col-lg-6">
                        <div class="form-group mb-3">
                           <label class="fs-6 mb-3 required">Email</label>
                           <input type="text" class="form-control fs-6" formControlName="email" [ngClass]="{
                              'is-invalid':
                              (ctf.email.touched || isSubmitted) &&
                              ctf.email.errors?.required
                            }" />
                        </div>
                        <div class="mt-1 alert alert-danger p-2" *ngIf="ctf.email.errors?.pattern">
                           Plese enter a valid email address
                        </div>
                     </div>

                     <div class="col-lg-6">
                        <div class="form-group mb-3">
                           <label class="fs-6 mb-3 required">Country Code</label>
                           <select class="form-select fs-6 mb-3" formControlName="countryCode" [ngClass]="{
                              'is-invalid':
                              (ctf.countryCode.touched || isSubmitted) &&
                              ctf.countryCode.errors?.required
                            }">
                              <option value="" disabled>-- Select an option --</option>
                              <option value="+971">+971</option>
                              <option value="+91">+91</option>
                           </select>
                        </div>
                     </div>

                     <div class="col-lg-6">
                        <div class="form-group mb-3">
                           <label class="fs-6 mb-3 required"> Mobile No.</label>
                           <input type="text" class="form-control fs-6" formControlName="mobile" [ngClass]="{
                              'is-invalid':
                              (ctf.mobile.touched || isSubmitted) &&
                              ctf.mobile.errors?.required
                            }" />
                        </div>
                        <div class="mt-1 alert alert-danger p-2" *ngIf="ctf.mobile.errors?.pattern">
                           Plese enter a valid phone number
                        </div>
                     </div>

                     <div class="col-lg-6">
                        <div class="form-group mb-3">
                           <label class="fs-6 mb-3">Status</label>
                           <select class="form-select fs-6 mb-3" formControlName="isActive">
                              <option value="" disabled>-- Select an option --</option>
                              <option value="true">Active</option>
                              <option value="false">Inactive</option>
                           </select>
                        </div>
                     </div>

                     <div class="col-lg-6">
                        <div class="form-group mb-3">
                           <label class="fs-6 mb-3">Primary Contact</label>
                           <select class="form-select fs-6 mb-3" formControlName="isPrimary">
                              <option value="" disabled>-- Select an option --</option>
                              <option value="true">Yes</option>
                              <option value="false">No</option>
                           </select>
                        </div>
                     </div>

                     <h3 class="fw-bolder">Address details</h3>

                     <div class="col-lg-6">
                        <div class="form-group mb-3">
                           <label class="fs-6 mb-3"> Firstlane</label>
                           <input type="text" class="form-control fs-6" formControlName="firstlane" />
                        </div>
                     </div>

                     <div class="col-lg-6">
                        <div class="form-group mb-3">
                           <label class="fs-6 mb-3"> Secondlane </label>
                           <input type="text" class="form-control fs-6" formControlName="secondlane" />
                        </div>
                     </div>

                     <div class="col-lg-6">
                        <div class="form-group mb-3">
                           <label class="fs-6 mb-3"> Area</label>
                           <input type="text" class="form-control fs-6" formControlName="area" />
                        </div>
                     </div>

                     <div class="col-lg-6">
                        <div class="form-group mb-3">
                           <label class="fs-6 mb-3"> City</label>
                           <input type="text" class="form-control fs-6" formControlName="city" [ngClass]="{
                              'is-invalid':
                              (ctf.city.touched || isSubmitted) &&
                              ctf.city.errors?.required
                            }" />
                        </div>
                     </div>

                     <div class="col-lg-6">
                        <div class="form-group mb-3">
                           <label class="fs-6 mb-3"> Pincode</label>
                           <input type="text" class="form-control fs-6" formControlName="pincode" [ngClass]="{
                              'is-invalid':
                              (ctf.pincode.touched || isSubmitted) &&
                              ctf.pincode.errors?.required
                            }" />
                        </div>
                        <div class="text-danger" *ngIf="ctf.pincode.errors?.pattern">Plese Enter Valid Pincode </div>
                     </div>

                     <div class="col-lg-6">
                        <div class="form-group mb-3">
                           <label class="fs-6 mb-3"> Latitude</label>
                           <input type="text" class="form-control fs-6" formControlName="lat" />
                        </div>
                     </div>

                     <div class="col-lg-6">
                        <div class="form-group mb-3">
                           <label class="fs-6 mb-3"> Longitude</label>
                           <input type="text" class="form-control fs-6" formControlName="lng" />
                        </div>
                     </div>

                     <div class="col-lg-6">
                        <div class="form-group mb-3">
                           <label class="fs-6 mb-3">State</label>
                           <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg"
                              formControlName="state" [ngClass]="{
                                 'is-invalid':
                                 (ctf.state.touched || isSubmitted) &&
                                 ctf.state.errors?.required
                               }">
                              <option value="" disabled>-- Select an option --</option>
                              <option value="Kerala">Kerala</option>
                              <option value="Karnataka">Karnataka</option>
                              <option value="Tamilnadu">Tamilnadu</option>
                              <option value="Goa">Goa</option>
                              <option value="Maharastra">Maharastra</option>
                              <option value="Gujarat">Gujarat</option>
                           </select>
                        </div>
                     </div>

                     <div class="col-12 d-flex align-items-center justify-content-end">
                        <a routerLink="{{ appRoute.contacts.CONTACTS_LIST}}"
                           class=" btn btn-secondary btn-sm fs-6 text-dark" style="width: 200px; margin-right: 20px;">
                           Cancel
                        </a>
                        <button type="submit" class="btn btn-primary btn-sm fs-6" style="width: 200px"
                           (click)="onSubmit()">
                           Add
                        </button>
                     </div>
                  </div>
               </form>
            </div>
         </div>
      </div>
   </div>
</div>
