<div class="content container-fluid">
   <div class="page-header">
      <div class="row align-items-center">
         <div class="col">
            <h3 class="page-title fw-bolder fs-2">
               {{ editMode ? "Update Contacts" : "Add Contacts" }}
            </h3>
            <ul class="breadcrumb">
               <li class="breadcrumb-item fs-5">
                  <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
               </li>
               <li class="breadcrumb-item fs-5">
                  <a routerLink="{{ appRoute.contacts.CONTACTS_LIST }}">Contacts</a>
               </li>
               <li class="breadcrumb-item active fs-5">
                  <a routerLink="{{ appRoute.contacts.ADD_CONTACTS_LIST}}">
                     {{ editMode ? "Update Contacts" : "Add Contacts"}}
                  </a>
               </li>
            </ul>
         </div>
      </div>
   </div>
   <div class="col-sm-12 fs-5 mt-10">
      <div class="card">
         <div class="card-body">
            <form (ngSubmit)="onSubmit()" [formGroup]="contactsForm">
               <div class="row">
                  <div class="col-12">
                     <h5 class="form-title fs-4"><span>Contact details</span></h5>
                  </div>
                  <div class="col-12 col-sm-6">
                     <div class="form-group">
                        <label class="fs-5 mb-3 required"> Name</label>
                        <input type="text" class="form-control fs-5" formControlName="name" [ngClass]="{
                           'is-invalid':
                           (ctf.name.touched || isSubmitted) &&
                           ctf.name.errors?.required
                         }" />
                     </div>
                  </div>
                  <div class="col-12 col-sm-6">
                     <div class="form-group">
                        <label class="fs-5 mb-3 required"> Email</label>
                        <input type="text" class="form-control fs-5" formControlName="email" [ngClass]="{
                           'is-invalid':
                           (ctf.email.touched || isSubmitted) &&
                           ctf.email.errors?.required
                         }" />
                     </div>
                     <div class="text-danger" *ngIf="ctf.email.errors?.pattern">Plese Enter Valid Email</div>
                  </div>
                  <div class="col-12 col-sm-6">
                     <div class="form-group">
                        <label class="fs-5 mb-3 required"> Mobile No.</label>
                        <input type="text" class="form-control fs-5" formControlName="mobile" [ngClass]="{
                           'is-invalid':
                           (ctf.mobile.touched || isSubmitted) &&
                           ctf.mobile.errors?.required
                         }" />
                     </div>
                     <div class="text-danger" *ngIf="ctf.mobile.errors?.pattern">Plese Enter Valid Phone Number</div>
                  </div>
                  <div class="col-12 col-sm-6">
                     <div class="form-group">
                        <label class="fs-5 mb-3">Status</label>
                        <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg"
                           formControlName="isActive">
                           <option value="" disabled>-- Select an option --</option>
                           <option value="true">Active</option>
                           <option value="false">Inactive</option>
                        </select>
                     </div>
                  </div>
                  <div class="col-12">
                     <h5 class="form-title fs-4"><span>Address details</span></h5>
                  </div>
                  <div class="col-12 col-sm-6">
                     <div class="form-group">
                        <label class="fs-5 mb-3 required"> Address line 1</label>
                        <input type="text" class="form-control fs-5" formControlName="firstline" [ngClass]="{
                           'is-invalid':
                           (ctf.firstline.touched || isSubmitted) &&
                           ctf.firstline.errors?.required
                         }" />
                     </div>
                  </div>
                  <div class="col-12 col-sm-6">
                     <div class="form-group">
                        <label class="fs-5 mb-3"> Address line 2</label>
                        <input type="text" class="form-control fs-5" formControlName="secondline" />
                     </div>
                  </div>
                  <div class="col-12 col-sm-6">
                     <div class="form-group">
                        <label class="fs-5 mb-3"> Area</label>
                        <input type="text" class="form-control fs-5" formControlName="area" />
                     </div>
                  </div>
                  <div class="col-12 col-sm-6">
                     <div class="form-group">
                        <label class="fs-5 mb-3 required"> City</label>
                        <input type="text" class="form-control fs-5" formControlName="city" [ngClass]="{
                           'is-invalid':
                           (ctf.city.touched || isSubmitted) &&
                           ctf.city.errors?.required
                         }" />
                     </div>
                  </div>
                  <div class="col-12 col-sm-6">
                     <div class="form-group">
                        <label class="fs-5 mb-3 required"> Pincode</label>
                        <input type="text" class="form-control fs-5" formControlName="pincode" [ngClass]="{
                           'is-invalid':
                           (ctf.pincode.touched || isSubmitted) &&
                           ctf.pincode.errors?.required
                         }" />
                     </div>
                     <div class="text-danger" *ngIf="ctf.pincode.errors?.pattern">Plese Enter Valid Pincode </div>
                  </div>
                  <div class="col-12 col-sm-6">
                     <div class="form-group">
                        <label class="fs-5 mb-3"> Latitude</label>
                        <input type="text" class="form-control fs-5" formControlName="lat" />
                     </div>
                  </div>
                  <div class="col-12 col-sm-6">
                     <div class="form-group">
                        <label class="fs-5 mb-3"> Longitude</label>
                        <input type="text" class="form-control fs-5" formControlName="lng" />
                     </div>
                  </div>
                  <div class="col-12 col-sm-6">
                     <div class="form-group">
                        <label class="fs-5 mb-3 required">State</label>
                        <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg"
                           formControlName="state" [ngClass]="{
                              'is-invalid':
                              (ctf.state.touched || isSubmitted) &&
                              ctf.state.errors?.required
                            }">
                           <option value="" disabled>-- Select an option --</option>
                           <option value="Kerala">Kerala</option>
                           <option value="Karnataka">Karnataka</option>
                           <option value="Tamilnadu">Tamilnadu</option>
                           <option value="Goa">Goa</option>
                           <option value="Maharastra">Maharastra</option>
                           <option value="Gujarat">Gujarat</option>
                        </select>
                     </div>
                  </div>
                  <div class="col-12">
                     <a routerLink="{{ appRoute.contacts.CONTACTS_LIST}}"
                        class=" btn btn-secondary btn-sm fs-5 text-dark" style="width: 200px; margin-right: 20px;">
                        Cancel
                     </a>
                     <button type="submit" class="btn btn-primary btn-sm fs-5" style="width: 200px">
                        Submit
                     </button>
                  </div>
               </div>
            </form>
         </div>
      </div>
   </div>
</div>
