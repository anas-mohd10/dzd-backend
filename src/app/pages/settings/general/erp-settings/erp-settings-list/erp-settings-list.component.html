<div>
  <div class="page-header d-flex align-items-center justify-content-between">
    <div>
      <div class="page-title">
        <h1 class="fw-bold">ERP Settings</h1>
      </div>
      <ul class="breadcrumb">
        <li class="breadcrumb-item fs-6">
          <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
        </li>
        <li class="breadcrumb-item fs-6">
          <a>Settings</a>
        </li>
        <li class="breadcrumb-item active fs-6">
          <a>ERP Settings</a>
        </li>
      </ul>
    </div>
  </div>

  <div class="row mt-4">
    <div class="col-md-6 mb-4" *ngFor="let erp of erpList">
      <div class="card h-100 position-relative">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h4 class="card-title mb-0" (click)="openErpModal(erp.id)" style="cursor: pointer;">{{ erp.name }} Integration</h4>
          <div class="form-check form-switch d-flex align-items-center">
            <app-switch 
              (switchToggled)="onToggleErpEnable(erp.id, $event)" 
              [isToggledProps]="erp.enabled"
              [switchId]="erp.id + 'Toggle'"
              (click)="$event.stopPropagation()">
            </app-switch>
            <label class="form-check-label ms-2" [for]="erp.id + 'Toggle'" (click)="$event.stopPropagation()">Enabled</label>
          </div>
        </div>
        <div class="card-body" (click)="openErpModal(erp.id)" style="cursor: pointer;">
          <p class="text-muted mb-0">Click to configure {{ erp.name }} integration.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ERP Settings Modal Template -->
  <ng-template #erpSettingsTemplate let-modal>
    <div class="modal-header">
      <h5 class="modal-title">Configure {{ selectedErpName }} Integration</h5>
      <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
    </div>
    <div class="modal-body">
      <form [formGroup]="form" (ngSubmit)="onSubmitErp()">
        <ng-container *ngFor="let field of selectedErpFields">
          <div class="form-group mb-3">
            <ng-container [ngSwitch]="field.type">
              <ng-container *ngSwitchCase="'checkbox'">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" [id]="field.controlName" [formControlName]="field.controlName">
                  <label class="form-check-label" [for]="field.controlName">{{ field.label }}</label>
                </div>
              </ng-container>
              <ng-container *ngSwitchDefault>
                <label class="fs-6 mb-2" [class.required]="field.required">{{ field.label }}</label>
                <input [type]="field.type" class="form-control fs-6" [formControlName]="field.controlName"
                  [placeholder]="field.placeholder" />
                <div *ngIf="form.get(field.controlName)?.invalid && (form.get(field.controlName)?.dirty || form.get(field.controlName)?.touched || isSubmitted)"
                  class="invalid-feedback d-block">
                  <div *ngIf="form.get(field.controlName)?.errors?.['required']">{{ field.label }} is required.</div>
                </div>
              </ng-container>
            </ng-container>
          </div>
        </ng-container>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="modal.dismiss()">Close</button>
      <button type="submit" class="btn btn-primary" (click)="onSubmitErp()" [disabled]="form.invalid && isSubmitted">Save</button>
    </div>
  </ng-template>
</div>
