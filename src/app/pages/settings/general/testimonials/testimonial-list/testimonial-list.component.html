<div>
   <div class="page-header d-flex align-items-start justify-content-between">
      <div>
         <div class="page-title">
            <h1 class="fw-bolder">Testimonials</h1>
         </div>
         <ul class="breadcrumb">
            <li class="breadcrumb-item fs-6">
               <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
            </li>
            <li class="breadcrumb-item active fs-6">
               <a routerLink="{{ appRoute.testimonial.TESTIMONIAL_LIST}}">Testimonials</a>
            </li>
         </ul>
      </div>
      <button class="btn btn-primary" routerLink="{{ appRoute.testimonial.ADD_TESTIMONIAL }}">
         Add Testimonial
      </button>
   </div>

   <div class="grid my-4" *ngIf="testimonials.length > 0">
      <ng-container *ngFor="let testimonial of testimonials; let i = index">
         <div class="bg-white p-3 rounded">
            <div class="fs-5">{{testimonial?.name}}</div>
            <div class="fs-6 text-muted">{{testimonial?.place}}</div>
            <div class="d-flex align-items-center justify-content-between">
               <div class="fs-6 text-muted">{{formatDate(testimonial?.createdAt)}}</div>
               <div class="d-flex align-items-center justify-content-between gap-2">
                  <app-switch [switchId]="testimonial?._id" (switchToggled)="onSwitchTriggered($event)"
                     [isToggledProps]="testimonial?.isActive"></app-switch>
                  <div
                     class="d-flex cursor-pointer align-items-center justify-content-between border border-secondary p-2 rounded"
                     routerLink="{{appRoute.testimonial.UPDATE_TESTIMONIAL}}" [queryParams]="{'id': testimonial?._id}">
                     <svg height="20" width="20" data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor"
                        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round"
                           d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z">
                        </path>
                     </svg>
                  </div>
               </div>
            </div>
         </div>
      </ng-container>
   </div>

   <ng-container *ngIf="testimonials.length == 0">
      <app-no-results></app-no-results>
   </ng-container>

   <div>
      <app-pagination (pageTrigger)="onPageTriggered($event)" [pageIndex]="page" [pageSize]="limit"
         [totalResults]="totalResults" [totalPages]="totalPages"></app-pagination>
   </div>

</div>
