<div>

   <div class="page-header">
      <div class="page-title">
         <h1 class="fw-bolder">Add Testimonial</h1>
      </div>
      <ul class="breadcrumb">
         <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
         </li>
         <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.testimonial.TESTIMONIAL_LIST }}">Testimonials</a>
         </li>
         <li class="breadcrumb-item active fs-6">
            <a routerLink="{{ appRoute.testimonial.ADD_TESTIMONIAL }}">
               {{editMode ? "Update Testimonial" : "Add Testimonial"}}</a>
         </li>
      </ul>
   </div>

   <div class="mt-4">
      <div class="card">
         <div class="card-body">
            <form [formGroup]="form">

               <div class="row">
                  <div class="col-lg-3">

                     <div class="form-group position-relative rounded ratio ratio-1x1">
                        <input type="file" class="form-control rounded h-100 w-100 fs-6" name="image" accept="image/*"
                           (change)="uploadThumbnail($event)">
                        <div *ngIf="!thumbnail"
                           class="position-absolute bg-light border border-secondary top-0 pe-none d-flex align-items-center justify-content-center h-100 w-100 rounded">
                           <div class="fs-5 text-secondary"></div>
                        </div>
                        <div *ngIf="thumbnail"
                           class="position-absolute bg-light border border-secondary top-0 pe-none d-flex align-items-center justify-content-center h-100 w-100 rounded">
                           <img class="h-100 w-100 object-fit-cover rounded" src="{{thumbnail}}" alt="Storedada">
                        </div>
                     </div>
                     <div class="my-2" *ngIf="thumbnail">
                        <button class="btn w-100 btn-secondary" (click)="removeThumbnail()">Remove</button>
                     </div>
                  </div>

                  <div class="col-lg-9">
                     <div class="row">

                        <div class="form-group mb-3">
                           <label for="name" class="fs-6 mb-3 required">Name</label>
                           <input type="text" placeholder="Eg. Alex" id="name" class="form-control fs-6"
                              formControlName="name"
                              [ngClass]="{'is-invalid':(formControls.name.touched || isSubmitted) && formControls.name.errors?.required}" />
                        </div>

                        <div class="col-lg-6 form-group mb-3">
                           <label class="fs-6 mb-3" for="profession">Profession</label>
                           <input type="text" placeholder="Eg. CEO" class="form-control fs-6" id="profession"
                              formControlName="profession" />
                        </div>

                        <div class="col-lg-6 form-group mb-3">
                           <label class="fs-6 mb-3" for="business">Business Name</label>
                           <input type="text" placeholder="Eg. StoreDada Technologies" class="form-control fs-6"
                              id="business" formControlName="business" />
                        </div>

                        <div class="col-lg-6 mb-3 form-group">
                           <label class="fs-6 required mb-3" for="place">Place</label>
                           <input type="text" id="place" placeholder="Eg. Kakkanad" class="form-control fs-6"
                              formControlName="place"
                              [ngClass]="{'is-invalid':(formControls.place.touched || isSubmitted) && formControls.place.errors?.required}" />
                        </div>

                        <div class="form-group mb-3">
                           <label class="fs-6 mb-3 required" id="message">Message</label>
                           <textarea class=" form-control fs-6" formControlName="message" style="resize: none"
                              id="message" rows="3"
                              [ngClass]="{'is-invalid':(formControls.message.touched || isSubmitted) && formControls.message.errors?.required}"></textarea>
                        </div>

                        <div class="col-lg-6 form-group mb-3">
                           <label class="fs-6 mb-3 required">Status</label>
                           <select class="form-select fs-6" formControlName="isActive">
                              <option value="" disabled>-- Select an option --</option>
                              <option value="true">Active</option>
                              <option value="false">Inactive</option>
                           </select>
                        </div>

                        <div class="d-flex align-items-center gap-2 justify-content-end">
                           <a routerLink="{{ appRoute.testimonial.TESTIMONIAL_LIST}}" class=" btn btn-secondary">
                              Cancel
                           </a>
                           <button type="submit" class="btn btn-primary" (click)="onSubmit()">
                              Save changes
                           </button>
                        </div>
                     </div>
                  </div>
               </div>

            </form>
         </div>
      </div>
   </div>
</div>
