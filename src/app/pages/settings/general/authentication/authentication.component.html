<div>

    <div class="page-header d-flex align-items-start justify-content-between">
        <div>
            <div class="page-title">
                <h1 class="fw-bold">Auth Settings</h1>
            </div>
            <ul class="breadcrumb">
                <li class="breadcrumb-item fs-6">
                    <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                </li>
                <li class="breadcrumb-item active fs-6">
                    <a routerLink="{{ appRoute.authSettings }}">Auth Settings</a>
                </li>
            </ul>
        </div>
        <button class="btn btn-primary" (click)="onSubmit()">Save changes</button>
    </div>

    <div class="my-4">
        <form [formGroup]="form">
            <div class="card">
                <div class="card-body">
                    <div class="row">
                        <div class="col-lg-4">
                            <div class="fs-5">OTP Login Enabled</div>
                        </div>
                        <div class="col-lg-8">
                            <app-switch (switchToggled)="toggleAuthOptions($event)" [switchId]="'isOtpLogin'"
                                [isToggledProps]="form.get('isOtpLogin')?.value"></app-switch>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card my-4">
                <div class="card-body">
                    <div class="row">
                        <div class="col-lg-4">
                            <div class="fs-5">Password Login Enabled</div>
                        </div>
                        <div class="col-lg-8">
                            <app-switch (switchToggled)="toggleAuthOptions($event)" [switchId]="'isPasswordLogin'"
                                [isToggledProps]="form.get('isPasswordLogin')?.value"></app-switch>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card my-4">
                <div class="card-body">
                    <div class="row">
                        <div class="col-lg-4">
                            <div class="fs-5">Guest Checkout Enabled</div>
                        </div>
                        <div class="col-lg-8">
                            <app-switch (switchToggled)="toggleAuthOptions($event)" [switchId]="'isGuestCheckout'"
                                [isToggledProps]="form.get('isGuestCheckout')?.value"></app-switch>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-body">
                    <div class="row">
                        <div class="col-lg-4">
                            <div class="fs-5">Facebook Login Enabled</div>
                        </div>
                        <div class="col-lg-8">
                            <app-switch (switchToggled)="toggleAuthOptions($event)" [switchId]="'isFacebookLogin'"
                                [isToggledProps]="form.get('isFacebookLogin')?.value"></app-switch>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card my-4">
                <div class="card-body">
                    <div class="row">
                        <div class="col-lg-4">
                            <div class="fs-5">Google Login Enabled</div>
                        </div>
                        <div class="col-lg-8">
                            <app-switch (switchToggled)="toggleAuthOptions($event)" [switchId]="'isGoogleLogin'"
                                [isToggledProps]="form.get('isGoogleLogin')?.value"></app-switch>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-body">
                    <div class="fs-5">Facebook Login Details</div>
                    <div class="row mt-4" formGroupName="facebookLogin">
                        <div class="col-lg-4 form-group">
                            <label for="facebookText" class="fs-6 mb-1">Button Text</label>
                            <input type="text" formControlName="text" class="form-control">
                        </div>
                        <div class="col-lg-4 form-group">
                            <label for="gClientId" class="fs-6 mb-1">Client ID</label>
                            <input type="text" id="gClientId" formControlName="clientId" class="form-control">
                        </div>
                        <div class="col-lg-4 form-group">
                            <label for="gClientSecret" class="fs-6 mb-1">Client Secret</label>
                            <input type="text" id="gClientSecret" formControlName="clientSecret" class="form-control">
                        </div>
                    </div>
                </div>
            </div>
            <div class="card my-4">
                <div class="card-body">
                    <div class="fs-5">Google Login Details</div>
                    <div class="row mt-4" formGroupName="googleLogin">
                        <div class="col-lg-4 form-group">
                            <label for="facebookText" class="fs-6 mb-1">Button Text</label>
                            <input type="text" formControlName="text" class="form-control">
                        </div>
                        <div class="col-lg-4 form-group">
                            <label for="gClientId" class="fs-6 mb-1">Client ID</label>
                            <input type="text" id="gClientId" formControlName="clientId" class="form-control">
                        </div>
                        <div class="col-lg-4 form-group">
                            <label for="gClientSecret" class="fs-6 mb-1">Client Secret</label>
                            <input type="text" id="gClientSecret" formControlName="clientSecret" class="form-control">
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
