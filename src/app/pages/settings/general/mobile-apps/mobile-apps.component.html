<div class="seoDetailsContainer">
    <div class="page-header">
        <div class="page-title">
            <h1 class="fw-bolder">Mobile apps</h1>
        </div>
        <div class="row">
            <div class="col d-flex align-items-start justify-content-between">
                <ul class="breadcrumb">
                    <li class="breadcrumb-item fs-6">
                        <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item active fs-6">
                        <a routerLink="{{ appRoute.mobileApps}}">Mobile apps</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <div>

                <tabset>
                    <tab heading="Android">
                        <div class="d-flex justify-content-end" *ngIf="isAndroidDetected">
                            <button type="button" class="btn btn-primary">
                                Save Changes
                            </button>
                        </div>

                        <form [formGroup]="androidForm">
                            <div
                                class="mt-4 mb-4 tabTitle androidTitle d-flex align-items-center justify-content-start">
                                <svg height="30px" fill="#a4c639" width="30px" xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 24 24">
                                    <path
                                        d="M6.38231 3.9681C7.92199 2.73647 9.87499 2 12 2C14.125 2 16.078 2.73647 17.6177 3.9681L19.0711 2.51472L20.4853 3.92893L19.0319 5.38231C20.2635 6.92199 21 8.87499 21 11V12H3V11C3 8.87499 3.73647 6.92199 4.9681 5.38231L3.51472 3.92893L4.92893 2.51472L6.38231 3.9681ZM3 14H21V21C21 21.5523 20.5523 22 20 22H4C3.44772 22 3 21.5523 3 21V14ZM9 9C9.55228 9 10 8.55228 10 8C10 7.44772 9.55228 7 9 7C8.44772 7 8 7.44772 8 8C8 8.55228 8.44772 9 9 9ZM15 9C15.5523 9 16 8.55228 16 8C16 7.44772 15.5523 7 15 7C14.4477 7 14 7.44772 14 8C14 8.55228 14.4477 9 15 9Z">
                                    </path>
                                </svg>

                                <span class="ms-2 fs-4">Android application</span>
                            </div>

                            <div class="row">
                                <div class="form-group mb-3">
                                    <label for="link" class="form-label">App link</label>
                                    <input type="text" name="link" id="link" placeholder="App link"
                                        formControlName="link" class="form-control">
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group mb-3">
                                        <label for="package" class="form-label">Package name</label>
                                        <input type="text" name="package" id="package" placeholder="Package name"
                                            formControlName="package" class="form-control">
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group mb-3">
                                        <label for="version" class="form-label">Latest version</label>
                                        <input type="text" name="version" id="version" placeholder="Latest version"
                                            formControlName="version" class="form-control">
                                    </div>
                                </div>
                                <div>
                                    <div class="col-lg-6">
                                        <div class="form-group mb-3">
                                            <label for="name" class="form-label">Application name</label>
                                            <input type="text" name="name" id="name" placeholder="Application name"
                                                formControlName="name" class="form-control">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group mb-3">
                                        <label for="buildName" class="form-label">Build version name</label>
                                        <input type="text" name="buildName" id="buildName"
                                            placeholder="Build version name" formControlName="buildName"
                                            class="form-control">
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group mb-3">
                                        <label for="buildCode" class="form-label">Build version code</label>
                                        <input type="text" name="buildCode" id="buildCode"
                                            placeholder="Build version code" formControlName="buildCode"
                                            class="form-control">
                                    </div>
                                </div>
                                <div>
                                    <p>Forced update</p>
                                    <div class="d-flex align-items-center justify-content-start">
                                        <div
                                            class="forcedBox rounded p-2 d-flex align-items-center justify-content-start me-1">
                                            <svg height="30px" width="30px" fill="none" stroke="currentColor"
                                                stroke-width="1.5" viewBox="0 0 24 24"
                                                xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                                <path stroke-linecap="round" stroke-linejoin="round"
                                                    d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 00-3.7-3.7 48.678 48.678 0 00-7.324 0 4.006 4.006 0 00-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3l-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 003.7 3.7 48.656 48.656 0 007.324 0 4.006 4.006 0 003.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3l-3 3">
                                                </path>
                                            </svg>
                                            <span class="ms-2">Enabled</span>
                                        </div>
                                        <div
                                            class="forcedBox rounded p-2 d-flex align-items-center justify-content-start ms-1">
                                            <svg height="30px" width="30px" fill="none" stroke="currentColor"
                                                stroke-width="1.5" viewBox="0 0 24 24"
                                                xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                                <path stroke-linecap="round" stroke-linejoin="round"
                                                    d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 00-3.7-3.7 48.678 48.678 0 00-7.324 0 4.006 4.006 0 00-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3l-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 003.7 3.7 48.656 48.656 0 007.324 0 4.006 4.006 0 003.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3l-3 3">
                                                </path>
                                            </svg>
                                            <span class="ms-2">Disabled</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </tab>
                    <tab heading="iOS">

                        <div class="mt-4 mb-4 tabTitle iosTitle d-flex align-items-center justify-content-start">
                            <svg height="30px" width="30px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path
                                    d="M11.6734 7.2221C10.7974 7.2221 9.44138 6.2261 8.01338 6.2621C6.12938 6.2861 4.40138 7.3541 3.42938 9.0461C1.47338 12.4421 2.92538 17.4581 4.83338 20.2181C5.76938 21.5621 6.87338 23.0741 8.33738 23.0261C9.74138 22.9661 10.2694 22.1141 11.9734 22.1141C13.6654 22.1141 14.1454 23.0261 15.6334 22.9901C17.1454 22.9661 18.1054 21.6221 19.0294 20.2661C20.0974 18.7061 20.5414 17.1941 20.5654 17.1101C20.5294 17.0981 17.6254 15.9821 17.5894 12.6221C17.5654 9.8141 19.8814 8.4701 19.9894 8.4101C18.6694 6.4781 16.6414 6.2621 15.9334 6.2141C14.0854 6.0701 12.5374 7.2221 11.6734 7.2221ZM14.7934 4.3901C15.5734 3.4541 16.0894 2.1461 15.9454 0.850098C14.8294 0.898098 13.4854 1.5941 12.6814 2.5301C11.9614 3.3581 11.3374 4.6901 11.5054 5.9621C12.7414 6.0581 14.0134 5.3261 14.7934 4.3901Z">
                                </path>
                            </svg>

                            <span class="ms-2 fs-4">iOS application</span>
                        </div>

                    </tab>
                </tabset>
            </div>
        </div>
    </div>

</div>
