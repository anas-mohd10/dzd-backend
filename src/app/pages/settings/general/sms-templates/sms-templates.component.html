<div>
  <div class="page-header">
    <div class="page-title">
      <h1 class="fw-bold">SMS Templates</h1>
    </div>
    <div class="row align-items-center">
      <div class="col d-flex flex-row justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-6">
            <a href="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item active fs-6">
            <a href="{{ appRoute.customSms }}">SMS Templates</a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <div class="my-4 card">
    <div class="card-body" style="z-index:10">
      <div class="row">
        <!-- Template Categories -->
        <div class="col-lg-3" style="max-height: 80vh; overflow-y: auto;">
          <ng-container *ngFor="let category of templates">
            <div class="border p-4 rounded mb-3 cursor-pointer"
              [ngClass]="{'border-primary': templateType === category.type}" (click)="selectCategory(category.type)">
              <div class="fw-bold text-dark">{{ category.title }}</div>
              <small class="text-dark">
                {{ category.description }}
              </small>

              <!-- Template Type Buttons -->
              <div class="mt-3">
                <ng-container *ngFor="let template of category.templates">
                  <button class="btn btn-sm w-100 mb-2 border"
                    [ngClass]="{'btn-primary': selectedTemplate?.type === template.type, 'btn-outline-secondary': selectedTemplate?.type !== template.type}"
                    (click)="$event.stopPropagation(); toggleTemplate(template)">
                    {{ template.title }}
                  </button>
                </ng-container>
              </div>
            </div>
          </ng-container>
        </div>

        <!-- Template Form -->
        <div class="col-lg-9">
          <form [formGroup]="form" (ngSubmit)="manageTemplate()" class="position-relative"
            style="max-height: 80vh; overflow-y: auto;">
            <div class="mb-4 position-sticky top-0 bg-white pt-3 pb-3" style="z-index: 1000;">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <label class="form-label fw-bold mb-0 text-dark">Template Message</label>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" formControlName="isActive" id="template-active">
                  <label class="form-check-label text-dark" for="template-active">Active</label>
                </div>
              </div>

              <!-- Template Variables -->
              <div class="mb-3" *ngIf="selectedTemplate">
                <label class="form-label text-dark">Available Variables:</label>
                <div class="d-flex flex-wrap gap-2">
                  <button type="button" class="btn btn-sm btn-outline-dark"
                    *ngFor="let variable of templateVariables[selectedTemplate.type]"
                    (click)="insertVariable(variable)">
                    {{ variable }}
                  </button>
                </div>
              </div>

              <!-- Message Textarea -->
              <textarea class="form-control" rows="3" formControlName="message" placeholder="Enter message template"
                [ngClass]="{'is-invalid': formControls['message'].errors && (formControls['message'].touched || isSubmitted)}">
              </textarea>

              <div class="d-flex justify-content-between mt-1">
                <small class="text-dark">
                  Characters: {{ form.get('message')?.value?.length || 0 }}/160
                </small>
                <small class="text-danger"
                  *ngIf="formControls['message'].errors?.required && (formControls['message'].touched || isSubmitted)">
                  Message is required
                </small>
                <small class="text-danger" *ngIf="formControls['message'].errors?.maxlength">
                  Message cannot exceed 160 characters
                </small>
              </div>
            </div>

            <div class="d-flex justify-content-end mt-4">
              <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
                Save Template
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
