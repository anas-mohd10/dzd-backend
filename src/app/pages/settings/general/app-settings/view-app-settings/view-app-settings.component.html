<div class="contact-page-container">
   <div class="page-header">
      <div class="page-title">
         <h1 class="fw-bolder">App Settings</h1>
      </div>
      <div class="row align-items-center">
         <div class="col d-flex align-items-start justify-content-between">
            <ul class="breadcrumb">
               <li class="breadcrumb-item fs-6">
                  <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
               </li>
               <li class="breadcrumb-item active fs-6">
                  <a routerLink="{{ appRoute.storeSettings.STORE_SETTINGS}}">App Settings</a>
               </li>
            </ul>
            <button *ngIf="generalSettingsCount == 0" class="btn btn-primary btn-sm cursor-pointer fs-6" color="primary"
               routerLink="{{ appRoute.storeSettings.ADD_APP_SETTINGS }}">
               Add Configurations
            </button>
            <button *ngIf="generalSettingsCount != 0" class="btn btn-primary btn-sm cursor-pointer fs-6" color="primary"
               routerLink="{{ appRoute.storeSettings.UPDATE_APP_SETTINGS }}" [queryParams]="{id: slug}">
               Edit Configurations
            </button>
         </div>
      </div>
   </div>

   <ng-container *ngIf="generalSettingsCount == 0">
      <div class="no-data-container" style="margin: 40px 0 0 0;">
         <div class="no-data-image"><img src="../../../../../assets/media/searching.svg" alt="" srcset=""></div>
         <h2 class="fw-bolder">Sorry, we haven't found any data</h2>
      </div>
   </ng-container>

   <div class="app-settings-container">
      <div class="colorsWrapper mt-4">
         <div class="p-3 rounded colorCard d-flex align-items-center justify-content-between">
            <div class="fs-6">Primary</div>
            <div class="colorBox rounded" [ngStyle]="{background: data?.colors?.primary.split('FF')}"></div>
         </div>
         <div class="p-3 rounded colorCard d-flex align-items-center justify-content-between">
            <div class="fs-6">Secondary</div>
            <div class="colorBox rounded" [ngStyle]="{background: data?.colors?.secondary.split('FF')}"></div>
         </div>
         <div class="p-3 rounded colorCard d-flex align-items-center justify-content-between">
            <div class="fs-6">Label</div>
            <div class="colorBox rounded" [ngStyle]="{background: data?.colors?.label.split('FF')}"></div>
         </div>
         <div class="p-3 rounded colorCard d-flex align-items-center justify-content-between">
            <div class="fs-6">Star</div>
            <div class="colorBox rounded" [ngStyle]="{background: data?.colors?.star.split('FF')}"></div>
         </div>
         <div class="p-3 rounded colorCard d-flex align-items-center justify-content-between">
            <div class="fs-6">Text</div>
            <div class="colorBox rounded" [ngStyle]="{background: data?.colors?.text.split('FF')}"></div>
         </div>
         <div class="p-3 rounded colorCard d-flex align-items-center justify-content-between">
            <div class="fs-6">Toast Success</div>
            <div class="colorBox rounded" [ngStyle]="{background: data?.toast?.success.split('FF')}"></div>
         </div>
         <div class="p-3 rounded colorCard d-flex align-items-center justify-content-between">
            <div class="fs-6">Toast Information</div>
            <div class="colorBox rounded" [ngStyle]="{background: data?.toast?.info.split('FF')}"></div>
         </div>
         <div class="p-3 rounded colorCard d-flex align-items-center justify-content-between">
            <div class="fs-6">Toast Error</div>
            <div class="colorBox rounded" [ngStyle]="{background: data?.toast?.error.split('FF')}"></div>
         </div>
      </div>
   </div>
</div>
