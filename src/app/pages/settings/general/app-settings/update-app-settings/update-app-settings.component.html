<div>
   <div class="page-header" style="display: flex; justify-content: space-between; align-items: center">
      <div class="">
         <div class="page-title">
            <h1 class="fw-bolder">Store settings</h1>
         </div>
         <div class="row">
            <div class="col d-flex align-items-start justify-content-between">
               <ul class="breadcrumb">
                  <li class="breadcrumb-item fs-6">
                     <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                  </li>
                  <li class="breadcrumb-item active fs-6">
                     <a routerLink="/app/store-settings">Store settings</a>
                  </li>
               </ul>
            </div>
         </div>
      </div>
   </div>

   <div class="row mt-4 pageWrapper">
      <div class="col-lg-8">
         <div class="card h-100">
            <div class="card-body">
               <form [formGroup]="form">
                  <h2 class="form-title">Color Settings</h2>
                  <div class="row mt-4">
                     <div class="col-lg-6">
                        <div class="form-group mb-4">
                           <label class="fs-6 mb-3">Primary Color</label>
                           <input type="color" placeholder="App primary color" class="form-control fs-6"
                              style="height: 40px;" formControlName="primary" />
                        </div>
                     </div>
                     <div class="col-lg-6">
                        <div class="form-group mb-4">
                           <label class="fs-6 mb-3">Secondary Color</label>
                           <input type="color" placeholder="App secondary color" class="form-control fs-6"
                              style="height: 40px;" formControlName="secondary" />
                        </div>
                     </div>
                  </div>
                  <div class="row">
                     <div class="col-lg-4">
                        <div class="form-group mb-4">
                           <label class="fs-6 mb-3">Label Color</label>
                           <input type="color" placeholder="App secondary color" class="form-control fs-6"
                              style="height: 40px;" formControlName="label" />
                        </div>
                     </div>
                     <div class="col-lg-4">
                        <div class="form-group mb-4">
                           <label class="fs-6 mb-3">Star Color</label>
                           <input type="color" placeholder="App secondary color" class="form-control fs-6"
                              style="height: 40px;" formControlName="star" />
                        </div>
                     </div>
                     <div class="col-lg-4">
                        <div class="form-group mb-4">
                           <label class="fs-6 mb-3">Text Color</label>
                           <input type="color" placeholder="App secondary color" class="form-control fs-6"
                              style="height: 40px;" formControlName="text" />
                        </div>
                     </div>
                  </div>
                  <div class="row">
                     <div class="col-lg-4">
                        <div class="form-group mb-4">
                           <label class="fs-6 mb-3">Toast Success Color</label>
                           <input type="color" placeholder="App toast success color" class="form-control fs-6"
                              style="height: 40px;" formControlName="toastSuccess" />
                        </div>
                     </div>
                     <div class="col-lg-4">
                        <div class="form-group mb-4">
                           <label class="fs-6 mb-3">Toast Error Color</label>
                           <input type="color" placeholder="App toast error color" class="form-control fs-6"
                              style="height: 40px;" formControlName="toastError" />
                        </div>
                     </div>
                     <div class="col-lg-4">
                        <div class="form-group mb-4">
                           <label class="fs-6 mb-3">Toast Info Color</label>
                           <input type="color" placeholder="App toast error color" class="form-control fs-6"
                              style="height: 40px;" formControlName="toastInfo" />
                        </div>
                     </div>
                  </div>
                  <h2 class="form-title">Additional Settings</h2>
                  <div class="col-12">
                     <div class="form-group mb-4">
                        <label class="fs-6 mb-3 required">Packing Slip</label>
                        <angular-editor class="form-control fs-6" formControlName="packingSlip"
                           [config]="editorConfig"></angular-editor>
                     </div>
                  </div>

                  <div class="col-12 storeWrapper">
                     <div class="card">
                        <div class="card-body">
                           <h2 class="form-title">Store Details</h2>
                           <div class="col-12">
                              <div class="form-group mb-3">
                                 <label class="fs-6 mb-3 required">Store Name</label>
                                 <input type="text" placeholder="Eg. Commerce Castle" class="form-control fs-6"
                                    formControlName="name" [ngClass]="{'is-invalid': (formControls.name.touched || isSubmitted) &&
                                    formControls.name.errors?.required}" />
                              </div>
                           </div>
                           <div class="col-12">
                              <div class="form-group mb-3">
                                 <label class="fs-6 mb-3 required">Domain</label>
                                 <input type="text" placeholder="https://commercecastle.com" class="form-control fs-6"
                                    formControlName="domain" [ngClass]="{'is-invalid': (formControls.domain.touched || isSubmitted) &&
                                    formControls.domain.errors?.required}" />
                              </div>
                           </div>
                           <div class="col-12">
                              <div class="form-group mb-3">
                                 <label class="fs-6 mb-3 required">Description</label>
                                 <textarea type="text" placeholder="Eg. All in one ecommerce store"
                                    class="form-control fs-6" formControlName="description" [ngClass]="{'is-invalid': (formControls.description.touched || isSubmitted) &&
                                    formControls.description.errors?.required}"></textarea>
                              </div>
                           </div>
                        </div>
                     </div>
                  </div>

                  <div class="col-12 buttonsWrapper">
                     <h2 class="form-title">Button Settings</h2>
                     <p>Edit the button text as per your choice</p>
                     <div class="row mt-2">
                        <div class="col-lg-4" [ngClass]="{'is-invalid': (formControls.cartButton.touched || isSubmitted) &&
                        formControls.cartButton.errors?.required}">
                           <div class="button" [ngStyle]="{'background-color': primary}">
                              <input type="text" formControlName="cartButton">
                           </div>
                        </div>
                        <div class="col-lg-4" [ngClass]="{'is-invalid': (formControls.stockButton.touched || isSubmitted) &&
                        formControls.stockButton.errors?.required}">
                           <div class="button outOfStock" [ngStyle]="{'background-color': primary}">
                              <input type="text" formControlName="stockButton">
                           </div>
                        </div>
                        <div class="col-lg-4" [ngClass]="{'is-invalid': (formControls.notifyButton.touched || isSubmitted) &&
                        formControls.notifyButton.errors?.required}">
                           <div class="button notifyButton" [ngStyle]="{'border-color': primary, 'color': primary}">
                              <input type="text" formControlName="notifyButton" [ngStyle]="{'color': primary}">
                           </div>
                        </div>
                     </div>
                  </div>
               </form>
            </div>
         </div>
      </div>

      <div class="col-lg-4 h-100">
         <div class="card">
            <div class="card-body">
               <h2 class="form-title">General Settings</h2>
               <form [formGroup]="form">
                  <div class="col-12">
                     <div class="form-group mb-3">
                        <label class="fs-6 mb-3">Currency</label>
                        <select class="form-select fs-6" formControlName="currency">
                           <option value="" disabled>-- Select an option --</option>
                           <ng-container *ngFor="let currency of currencies">
                              <option value="{{currency}}">{{currency}}</option>
                           </ng-container>
                        </select>
                     </div>
                  </div>

                  <div class="col-l12">
                     <div class="form-group mb-3">
                        <label class="fs-6 mb-3">Font Family</label>
                        <select class="form-select fs-6" formControlName="fontFamily">
                           <option value="" disabled>-- Select an option --</option>
                           <ng-container *ngFor="let font of fontFamily">
                              <option value="{{font}}">{{font}}</option>
                           </ng-container>
                        </select>
                     </div>
                  </div>

                  <div class="col-12">
                     <div class="form-group mb-3">
                        <label class="fs-6 mb-3">Show Out of Stock Products</label>
                        <select class="form-select mb-3" formControlName="isOutOfStock">
                           <option value="" disabled>-- Select an option --</option>
                           <option value="false">No</option>
                           <option value="true">Yes</option>
                        </select>
                     </div>
                  </div>

                  <div class="col-12">
                     <div class="form-group mb-3">
                        <label class="fs-6 mb-3">Notify Button ( Out of Stock Products )</label>
                        <select class="form-select mb-3" formControlName="isNotifyStock">
                           <option value="" disabled>-- Select an option --</option>
                           <option value="false">No</option>
                           <option value="true">Yes</option>
                        </select>
                     </div>
                  </div>

                  <div class="col-12">
                     <div class="form-group mb-3">
                        <label class="fs-6 mb-3 required">Items Per Page</label>
                        <input type="number" placeholder="14" class="form-control fs-6"
                           formControlName="itemsPerPage" />
                     </div>
                  </div>

                  <div>
                     <h2 class="form-title">Store Media Settings</h2>
                     <div class="my-3">
                        <div class="fs-5 mb-2 required">Logo / Emblem / Symbol</div>
                        <div class="h-auto ratio ratio-1x1 w-100">
                           <app-assets (mediaClicked)="handleStoreLogo($event)" [previewDetails]="logo"></app-assets>
                        </div>
                     </div>
                     <div>
                        <div class="fs-5 mb-2 required">Favicon</div>
                        <div class="h-auto ratio ratio-1x1 w-100">
                           <app-assets (mediaClicked)="handleStoreFavicon($event)"
                              [previewDetails]="favicon"></app-assets>
                        </div>
                     </div>
                  </div>
               </form>
            </div>
         </div>
      </div>
      <div class="mt-4 d-flex align-items-center justify-content-end">
         <button type="submit" class="btn btn-primary" (click)="onSubmit()">
            Update changes <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
               class="bi bi-floppy" viewBox="0 0 16 16">
               <path d="M11 2H9v3h2z" />
               <path
                  d="M1.5 0h11.586a1.5 1.5 0 0 1 1.06.44l1.415 1.414A1.5 1.5 0 0 1 16 2.914V14.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 14.5v-13A1.5 1.5 0 0 1 1.5 0M1 1.5v13a.5.5 0 0 0 .5.5H2v-4.5A1.5 1.5 0 0 1 3.5 9h9a1.5 1.5 0 0 1 1.5 1.5V15h.5a.5.5 0 0 0 .5-.5V2.914a.5.5 0 0 0-.146-.353l-1.415-1.415A.5.5 0 0 0 13.086 1H13v4.5A1.5 1.5 0 0 1 11.5 7h-7A1.5 1.5 0 0 1 3 5.5V1H1.5a.5.5 0 0 0-.5.5m3 4a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5V1H4zM3 15h10v-4.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5z" />
            </svg>
         </button>
      </div>
   </div>
</div>
