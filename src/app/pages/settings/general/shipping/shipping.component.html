<div>
    <div class="page-header d-flex align-items-start justify-content-between">
        <div class="page-title">
            <h1 class="fw-bolder">Shipping settings</h1>
            <ul class="breadcrumb gap-1">
                <li class="breadcrumb-item fs-6">
                    <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                </li>
                <li class="breadcrumb-item active fs-6">
                    <a routerLink="{{ appRoute.shippingSettings}}">Shipping settings</a>
                </li>
            </ul>
        </div>
        <button class="btn btn-primary d-flex align-items-center justify-content-center gap-1" color="primary" routerLink="{{ appRoute.shippingCharges }}">
            Shipping charges
            <svg height="18" width="18" data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor"
                viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"></path>
            </svg>
        </button>
    </div>

    <div class="my-4">
        <div>
            <div class="mt-3">
                <ng-container *ngFor="let item of items">
                    <div class="rounded border border-secondary p-4 bg-white mb-3">
                        <div class="d-flex align-items-start justify-content-start gap-2">
                            <app-switch [switchId]="item?.value" (switchToggled)="checked($event)"
                                [isToggledProps]="form.get('cost')?.value == item?.value ? true : false"></app-switch>
                            <div>
                                <div class="fs-5">{{item?.title}}</div>
                                <div class="text-muted">{{item?.description}}</div>
                            </div>
                        </div>

                        <ng-container *ngIf="isMinimum && item?.value == 'minimum'">
                            <form [formGroup]="form">
                                <div class="row mt-5">
                                    <div class="col-lg-5">
                                        <div class="form-group mb-3">
                                            <label for="amount" class="form-label">Cart Amount</label>
                                            <input type="text" name="amount" id="amount" class="form-control"
                                                formControlName="amount"
                                                [ngClass]="{'is-invalid': formControls.amount.errors?.pattern}">
                                            <div class="fs-5 fw-normal mt-2 text-danger"
                                                *ngIf="formControls.amount.errors?.pattern">
                                                Please enter a valid amount
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-5">
                                        <div class="form-group mb-3">
                                            <label for="charge" class="form-label">Shipping Charge</label>
                                            <input name="charge" id="charge" type="text" class="form-control"
                                                formControlName="charge"
                                                [ngClass]="{'is-invalid': formControls.charge.errors?.pattern}">
                                            <div class="fs-5 fw-normal mt-2 text-danger"
                                                *ngIf="formControls.charge.errors?.pattern">
                                                Please enter a valid amount
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-2">
                                        <div class="form-group mb-3">
                                            <label for="" class="form-label">&nbsp;</label>
                                            <input type="button" class="btn btn-primary form-control"
                                                value="Update changes" (click)="save()">
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </ng-container>
                    </div>
                </ng-container>
            </div>
        </div>
    </div>
</div>
