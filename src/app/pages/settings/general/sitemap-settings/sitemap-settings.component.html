<div>
    <div class="page-header d-flex align-items-start justify-content-between">
        <div>
            <div class="page-title">
                <h1 class="fw-bold">Sitemap Settings</h1>
            </div>
            <ul class="breadcrumb">
                <li class="breadcrumb-item fs-6">
                    <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                </li>
                <li class="breadcrumb-item active fs-6">
                    <a routerLink="{{ appRoute.sitemapSettings }}">Sitemap Settings</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="my-4">
        <div class="card mb-4">
            <div class="card-body">
                <div class="d-flex align-items-center justify-content-between">
                    <div class="fs-5">Refresh Sitemap</div>
                    <button class="btn btn-secondary" (click)="refreshSitemap()">Refresh</button>
                </div>
            </div>
        </div>
        <div class="card mb-4">
            <div class="card-body">
                <div class="d-flex align-items-center justify-content-between">
                    <div class="fs-5">Download Sitemap</div>
                    <a class="fs-5" href="{{settings.baseS3Url + 'sitemap.xml'}}">Download</a>
                </div>
            </div>
        </div>
        <div class="card mb-4">
            <div class="card-body">
                <div class="d-flex align-items-center justify-content-between">
                    <div class="fs-5">Your sitemap URLs can be found here</div>
                    <a class="fs-5" href="{{domainUrl + 'sitemap.xml'}}" target="_blank">{{domainUrl + 'sitemap.xml'}}</a>
                </div>
            </div>
        </div>
    </div>
</div>
