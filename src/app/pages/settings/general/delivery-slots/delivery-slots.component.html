<div>
    <div class="page-header">
        <div class="page-title">
            <h1 class="fw-bold">Delivery slots</h1>
        </div>
        <div class="row align-items-center">
            <div class="col d-flex align-items-start justify-content-between">
                <ul class="breadcrumb">
                    <li class="breadcrumb-item fs-6">
                        <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                    </li>
                    <li class="breadcrumb-item active fs-6">
                        <a routerLink="{{ appRoute.deliverySlots}}">Delivery slots</a>
                    </li>
                </ul>
                <button class="btn btn-primary cursor-pointer" color="primary" (click)="open(template)">
                    Add delivery slot
                </button>
            </div>
        </div>
    </div>
    <div class="card my-4">
        <div class="card-body">
            <ng-container *ngFor="let slot of slots">
                <div class="p-3 mb-3 rounded shadow border border-secondary">
                    <svg height="42px" width="42px" data-slot="icon" fill="none" stroke-width="1" stroke="#aaaaaa"
                        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 0 0-3.213-9.193 2.056 2.056 0 0 0-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 0 0-10.026 0 1.106 1.106 0 0 0-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12">
                        </path>
                    </svg>
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <div class="fs-5">
                                <span>{{slot.from}}</span> - <span>{{slot.to}}</span>
                            </div>
                            <div class="alert p-1 mt-2 mb-0 d-flex align-items-center justify-content-center"
                                [ngClass]="{'alert-success': slot.isActive, 'alert-danger': !slot.isActive}">
                                {{slot.isActive == true ? 'Enabled' : 'Disabled'}}</div>
                        </div>
                        <button class="btn btn-secondary p-2" (click)="open(template, slot.refid)">
                            Edit details
                        </button>
                    </div>
                </div>
            </ng-container>
            <div class="my-8 d-flex flex-column align-items-center justify-content-center" *ngIf="slots.length == 0">
                <div class="fs-4 fw-bold">No delivery slots found</div>
                <p class="text-muted">We couldn't find any item based on your search</p>
            </div>
        </div>
    </div>
</div>

<ng-template #template>
    <div class="modal-header pb-0">
        <h4 class="modal-title pull-left">Slot details</h4>
        <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="close()">
            <span aria-hidden="true" class="visually-hidden">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <form [formGroup]="form">
            <div class="row">
                <div class="col-lg-6 form-group mb-3">
                    <label for="from" class="form-label">From</label>
                    <input type="time" id="from" class="form-control" formControlName="from"
                        [ngClass]="{'is-invalid':(formControls.from.touched || isSubmitted) && formControls.from.errors?.required}">
                </div>
                <div class="col-lg-6 form-group mb-3">
                    <label for="to" class="form-label">To</label>
                    <input type="time" id="to" class="form-control" formControlName="to"
                        [ngClass]="{'is-invalid':(formControls.to.touched || isSubmitted) && formControls.to.errors?.required}">
                </div>
                <div class="col-lg-6 form-group mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select id="status" formControlName="isActive" class="form-select">
                        <option value="" disabled>-- Select an option --</option>
                        <option value="true">Enabled</option>
                        <option value="false">Disabled</option>
                    </select>
                </div>
            </div>
            <div class="d-flex align-items-center justify-content-end">
                <button class="btn btn-secondary me-2" (click)="close()">
                    Cancel
                </button>
                <button class="btn btn-primary ms-2" (click)="submit()">
                    Save changes
                </button>
            </div>
        </form>
    </div>
</ng-template>

<ng-template #confirmation>
    <div class="modal-body text-center">
        <p>Do you want to delete?</p>
        <button type="button" class="btn btn-default" (click)="confirm()">Yes</button>
        <button type="button" class="btn btn-primary" (click)="decline()">No</button>
    </div>
</ng-template>
