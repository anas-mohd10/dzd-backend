<div class="bulkOptionsContainer">
    <div class="bulkPageTitle">
        <h1 class="fw-bolder">Bulk Upload</h1>
    </div>
    <div class="uploadOptions">
        <div class="mediaUploadOptions">
            <div class="bulkTitle">
                <h3 class="fw-bolder">Bulk Upload ( Media )</h3>
            </div>
            <div class="bulkOptions">
                <div class="bulkOptionButton" routerLink="/app/bulk-upload/media" [queryParams]="{'type': 'category'}">
                    <div class="bulkOption">Category</div>
                    <div class="image">
                        <img src="../../../../../../assets/icons/chevron-right.png" alt="Icon">
                    </div>
                </div>
                <div class="bulkOptionButton" routerLink="/app/bulk-upload/media" [queryParams]="{'type': 'brand'}">
                    <div class="bulkOption">Brand</div>
                    <div class="image">
                        <img src="../../../../../../assets/icons/chevron-right.png" alt="Icon">
                    </div>
                </div>
                <div class="bulkOptionButton" routerLink="/app/bulk-upload/media" [queryParams]="{'type': 'product'}">
                    <div class="bulkOption">Product</div>
                    <div class="image">
                        <img src="../../../../../../assets/icons/chevron-right.png" alt="Icon">
                    </div>
                </div>
                <div class="bulkOptionButton" routerLink="/app/bulk-upload/media"
                    [queryParams]="{'type': 'collection'}">
                    <div class="bulkOption">Collection</div>
                    <div class="image">
                        <img src="../../../../../../assets/icons/chevron-right.png" alt="Icon">
                    </div>
                </div>
            </div>
        </div>
        <div class="fileUploadOptions">
            <div class="bulkTitle">
                <h3 class="fw-bolder">Bulk Upload ( CSV )</h3>
            </div>
            <div class="bulkOptions">
                <div class="bulkOptionButton" routerLink="/app/bulk-upload/file" [queryParams]="{'type': 'category'}">
                    <div class="bulkOption">Category</div>
                    <div class="image">
                        <img src="../../../../../../assets/icons/chevron-right.png" alt="Icon">
                    </div>
                </div>
                <div class="bulkOptionButton" routerLink="/app/bulk-upload/file" [queryParams]="{'type': 'brand'}">
                    <div class="bulkOption">Brand</div>
                    <div class="image">
                        <img src="../../../../../../assets/icons/chevron-right.png" alt="Icon">
                    </div>
                </div>
                <div class="bulkOptionButton" routerLink="/app/bulk-upload/file" [queryParams]="{'type': 'product'}">
                    <div class="bulkOption">Product</div>
                    <div class="image">
                        <img src="../../../../../../assets/icons/chevron-right.png" alt="Icon">
                    </div>
                </div>
                <div class="bulkOptionButton" routerLink="/app/bulk-upload/file" [queryParams]="{'type': 'collection'}">
                    <div class="bulkOption">Collection</div>
                    <div class="image">
                        <img src="../../../../../../assets/icons/chevron-right.png" alt="Icon">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="uploadHistory">
        <div class="bulkTitle">
            <h3 class="fw-bolder">Bulk Upload History</h3>
        </div>
        <ng-container *ngIf="history.length == 0">
            <div class="noHistory">
                <div class="image">
                    <img src="../../../../../../assets/icons/history.png" alt="Icon">
                </div>
                <div class="text">No history found</div>
            </div>
        </ng-container>

        <div class="historyContainer" *ngIf="history.length > 0">
            <ng-container *ngFor="let data of history; let i = index">
                <div class="historyCard">
                    <div class="historyDetails">
                        <div class="historyType">{{data?.type}}</div>
                        <div class="historyFile">{{data?.name}} <span (click)="downloadFile(data?.path, data?.name)">Download File</span> </div>
                    </div>
                    <div class="historyDate">{{data?.date}}</div>
                </div>
            </ng-container>
        </div>
    </div>
</div>
