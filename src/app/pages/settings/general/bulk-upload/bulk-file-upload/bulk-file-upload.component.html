<div class="bulkMediaContainer">
    <div class="bulkUploadHeader">
        <div class="bulkHeaderLeft">
            <div class="backButton" (click)="navigateBack()">
                <img src="../../../../../../assets/icons/chevron-back.png" alt="Icon">
            </div>
            <div class="bulkUploadTitle">
                <h2 class="fw-bolder">{{pageTitle}}</h2>
            </div>
        </div>
        <div class="bulkHeaderRight" data-bs-toggle="modal" data-bs-target="#exampleModal">
            <i class="bi bi-question-circle"></i>
            Upload Guide
        </div>
    </div>

    <ng-container *ngIf="!isTriggered">
        <div class="bulkUploadContainer">
            <div class="bulkUploadInput">
                <input type="file" accept=".csv" (change)="fileUpload($event.target)">
                <div class="bulkUploadMask">
                    <img src="../../../../../../assets/media/file-upload.gif" alt="Upload">
                    <div class="uploadText">
                        <p>Drop your files here or <span>Browse</span></p>
                        <p class="note">Accepts csv file</p>
                    </div>
                </div>
            </div>

            <ng-container *ngIf="isUploaded">
                <div class="afterUploadContainer">
                    <div class="previewContainer">
                        <div class="uploadedTitle">Processed File</div>
                        <div class="uploadedFileContainer">
                            <div class="fileDetails">
                                <div class="fileName">{{filename}}</div>
                                <div class="fileSize">{{filesize}} KB</div>
                            </div>
                            <div class="removeContainer" (click)="removeFileUpload()">
                                <i class="bi bi-x-lg"></i>
                            </div>
                        </div>
                        <div class="validationContainer">
                            <div class="validationMessage errorValidation" *ngIf="!isValidFile">
                                Validation failed
                            </div>
                            <div class="validationReason" *ngIf="!isValidFile">
                                <i class="bi bi-exclamation-lg"></i> Reason : File size is more than 5 Mb
                            </div>
                        </div>
                    </div>
                </div>
            </ng-container>
        </div>
    </ng-container>

    <ng-container *ngIf="isTriggered">
        <div class="processingContainer">
            <img src="../../../../../../assets/media/illustrations/dozzy-1/9.png" alt="Processing">
            <div class="processingText">
                <h1>Processing...</h1>
                <p>Please wait, this may take upto minutes</p>
            </div>
        </div>
    </ng-container>

    <ng-container *ngIf="isUploaded || isTriggered">
        <div class="buttonsContainer">
            <div class="cancelButton" (click)="navigateBack()">Cancel</div>
            <div class="uploadButton" (click)="bulkUpload()">Upload</div>
        </div>
    </ng-container>
</div>


<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Bulk Upload Guide</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                ...
            </div>
        </div>
    </div>
</div>
