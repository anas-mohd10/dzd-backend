<div>
    <div class="page-header d-flex align-items-start justify-content-between">
        <div>
            <div class="page-title">
                <h1 class="fw-bold">Create Pickup Location</h1>
            </div>
            <ul class="breadcrumb">
                <li class="breadcrumb-item fs-6">
                    <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                </li>
                <li class="breadcrumb-item active fs-6">
                    <a routerLink="{{ appRoute.pickupLocations.list }}">Pickup Locations</a>
                </li>
                <li class="breadcrumb-item active fs-6">
                    <a routerLink="{{ appRoute.pickupLocations.create }}">Create Pickup Location</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="card my-4">
        <div class="card-body">
            <form [formGroup]="form">
                <div class="form-group mb-3">
                    <label for="country" class="fs-6 mb-3">Country</label>
                    <select formControlName="country" id="country" class="form-select" (change)="onCountryChange()">
                        <option value="" disabled>-- Select an option --</option>
                        <option *ngFor="let countryItem of countryItems" value="{{countryItem.value}}">
                            {{countryItem.key}}</option>
                    </select>
                </div>
                <div class="form-group mb-3">
                    <label for="state" class="fs-6 mb-3">State</label>
                    <select formControlName="state" id="state" class="form-select">
                        <option value="" disabled>-- Select an option --</option>
                        <option *ngFor="let stateItem of stateItems" value="{{stateItem.value}}">{{stateItem.key}}
                        </option>
                    </select>
                </div>
                <div class="form-group mb-3">
                    <label for="city" class="fs-6 mb-3 required">City</label>
                    <input type="text" id="city" formControlName="city" class="form-control" [ngClass]="{
                        'is-invalid':
                        (formControls.city.touched || isSubmitted) &&
                        formControls.city.errors?.required
                      }">
                </div>
                <div class="form-group mb-3">
                    <label for="name" class="fs-6 mb-3 required">Name</label>
                    <input type="text" id="name" formControlName="name" class="form-control" [ngClass]="{
                    'is-invalid':
                    (formControls.name.touched || isSubmitted) &&
                    formControls.name.errors?.required
                  }">
                </div>
                <div class="row mb-3">
                    <div class="col-lg-4">
                        <div class="form-group mb-3">
                            <label for="countryCode" class="fs-6 mb-3 required">Country Code</label>
                            <select class="form-select" formControlName="countryCode" (change)="handleMobilePattern()"
                                [ngClass]="{
                                'is-invalid':
                                (formControls.countryCode.touched || isSubmitted) &&
                                formControls.countryCode.errors?.required
                              }">
                                <option value='' disabled>-- Select an option --</option>
                                <option value='+91'>+91</option>
                                <option value='+971'>+971</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="form-group mb-3">
                            <label for="mobile" class="fs-6 mb-3 required">Mobile</label>
                            <input type="text" id="mobile" formControlName="mobile" class="form-control" [ngClass]="{
                            'is-invalid':
                            (formControls.mobile.touched || isSubmitted) &&
                            formControls.mobile.errors?.required
                          }">
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="form-group mb-3">
                            <label for="email" class="fs-6 mb-3 required">Email</label>
                            <input type="text" id="email" formControlName="email" class="form-control" [ngClass]="{
                    'is-invalid':
                    (formControls.email.touched || isSubmitted) &&
                    formControls.email.errors?.required
                  }">
                        </div>
                    </div>
                </div>
                <div class="form-group mb-3">
                    <label for="address" class="fs-6 mb-3 required">Address</label>
                    <input type="text" id="address" formControlName="address" class="form-control" [ngClass]="{
                    'is-invalid':
                    (formControls.address.touched || isSubmitted) &&
                    formControls.address.errors?.required
                  }">
                </div>
                <div class="form-group mb-3">
                    <label for="isActive" class="fs-6 mb-3">Status</label>
                    <select formControlName="isActive" id="isActive" class="form-select">
                        <option value="" disabled>-- Select an option --</option>
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                    </select>
                </div>
                <div class="d-flex gap-2 align-items-center justify-content-end">
                    <button class="btn btn-secondary" routerLink="{{appRoute.pickupLocations.list}}">Cancel</button>
                    <button class="btn btn-primary" (click)="onSubmit()">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
