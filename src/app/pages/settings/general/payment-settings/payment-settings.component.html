<div>

    <div class="page-header d-flex align-items-start justify-content-between">
        <div>
            <div class="page-title">
                <h1 class="fw-bold">Payment Settings</h1>
            </div>
            <ul class="breadcrumb">
                <li class="breadcrumb-item fs-6">
                    <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
                </li>
                <li class="breadcrumb-item active fs-6">
                    <a routerLink="{{ appRoute.paymentSettings }}">Payment Settings</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="my-4">

        <div>
            <div class="fs-4 fw-bold">Payment Mode</div>
            <div class="mt-3 mb-5 d-flex align-items-center justify-content-start gap-2">
                <div class="fs-5">Online Payments </div>
                <div>
                    <app-switch [switchId]="''" [isToggledProps]="settingsForm.get('isOnlinePayment')?.value"
                        (switchToggled)="onSwitcTriggered($event, 'online')"></app-switch>
                </div>
            </div>
            <div class="d-flex align-items-center justify-content-start gap-2">
                <div class="fs-5">Cash on Delivery </div>
                <div>
                    <app-switch [switchId]="''" [isToggledProps]="settingsForm.get('isCashOnDelivery')?.value"
                        (switchToggled)="onSwitcTriggered($event, 'cash')"></app-switch>
                </div>
            </div>
            <div class="d-flex mt-5 align-items-center justify-content-start gap-2">
                <div class="fs-5">Card on Delivery </div>
                <div class="fs-5">
                    <app-switch [switchId]="''" [isToggledProps]="settingsForm.get('isCardOnDelivery')?.value"
                        (switchToggled)="onSwitcTriggered($event, 'card')"></app-switch>
                </div>
            </div>
        </div>

        <div class="my-8">
            <div class="fs-4 fw-bold">Payment Gateways</div>
            <div class="pg-cards my-4">
                <div class="pg-card position-relative cursor-pointer p-4 border  rounded"
                    *ngFor="let pg of pgs; let i = index" (click)="open(template, pg?.id)"
                    [ngClass]="{'border-secondary': !paymentGatewayEnabled(pg?.id), 'border-primary': paymentGatewayEnabled(pg?.id)}">
                    <img src="{{pg?.icon}}" alt="{{pg?.title}}"
                        onerror="this.src = '../../../../assets/images/default.png'">
                    <div class="fs-5 text-center mt-2">{{pg?.title}}</div>
                </div>
            </div>
        </div>

    </div>

    <ng-template #template>
        <div class="modal-header">
            <h4 class="modal-title pull-left">{{activePgDetails?.title}} Details</h4>
            <div class="d-flex align-items-center justify-content-end gap-5">
                <div class="d-flex align-items-center justify-content-between gap-2">
                    <label for="gatewayEnabled" class="fs-5">Enabled</label>
                    <app-switch id="gatewayEnabled" [switchId]="''" [isToggledProps]="form.get('isEnabled')?.value"
                        (switchToggled)="onPaymentGatewayTriggered($event)"></app-switch>
                </div>
                <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="close()">
                    <span aria-hidden="true" class="visually-hidden">&times;</span>
                </button>
            </div>
        </div>
        <div class="modal-body">
            <form [formGroup]="form" (ngSubmit)="onSubmit()">

                <div class="row mb-3">
                    <div class="col-lg-3">
                        <label for="displayIcon" class="fs-6 mb-3">Display Name</label>
                        <div class="ratio ratio-1x1" id="displayIcon">
                            <app-assets [previewDetails]="displayIcon"
                                (mediaClicked)="onMediaTriggered($event)"></app-assets>
                        </div>
                    </div>
                    <div class="col-lg-9 d-flex flex-column justify-content-center form-group">
                        <div class="mb-3">
                            <label for="displayTitle" class="fs-6 mb-3">Display Name</label>
                            <input type="text" id="displayTitle" placeholder="Display name"
                                formControlName="displayName" class="form-control">
                        </div>
                    </div>
                </div>

                <div class="mb-3 form-group"
                    *ngIf="paymentGatewayConfig[form.get('paymentGateway')?.value]?.includes('profileId')">
                    <label for="profileId" class="fs-6 mb-3">Profile ID</label>
                    <input type="text" id="profileId" placeholder="Profile ID" formControlName="profileId"
                        class="form-control" [ngClass]="{
                            'is-invalid':
                            (formControls.profileId.touched || isSubmitted) &&
                            formControls.profileId.errors?.required
                          }">
                </div>

                <div class="mb-3 form-group"
                    *ngIf="paymentGatewayConfig[form.get('paymentGateway')?.value]?.includes('merchantCode')">
                    <label for="merchantCode" class="fs-6 mb-3">Member Code</label>
                    <input type="text" id="merchantCode" placeholder="Member Code" formControlName="merchantCode"
                        class="form-control" [ngClass]="{
                            'is-invalid':
                            (formControls.merchantCode.touched || isSubmitted) &&
                            formControls.merchantCode.errors?.required
                          }">
                </div>

                <div class="mb-3 form-group"
                    *ngIf="paymentGatewayConfig[form.get('paymentGateway')?.value]?.includes('merchantId')">
                    <label for="merchantId" class="fs-6 mb-3">Merchant ID</label>
                    <input type="text" id="merchantId" placeholder="Merchant ID" formControlName="merchantId"
                        class="form-control" [ngClass]="{
                            'is-invalid':
                            (formControls.merchantId.touched || isSubmitted) &&
                            formControls.merchantId.errors?.required
                          }">
                </div>

                <div class="mb-3 form-group"
                    *ngIf="paymentGatewayConfig[form.get('paymentGateway')?.value]?.includes('secretKey')">
                    <label for="secretKey" class="fs-6 mb-3">Secret Key</label>
                    <input type="text" id="secretKey" placeholder="Secret Key" formControlName="secretKey"
                        class="form-control" [ngClass]="{
                            'is-invalid':
                            (formControls.secretKey.touched || isSubmitted) &&
                            formControls.secretKey.errors?.required
                          }">
                </div>

                <div class="mb-3 form-group"
                    *ngIf="paymentGatewayConfig[form.get('paymentGateway')?.value]?.includes('publicKey')">
                    <label for="publicKey" class="fs-6 mb-3">Public Key</label>
                    <input type="text" id="publicKey" placeholder="Public Key" formControlName="publicKey"
                        class="form-control" [ngClass]="{
                            'is-invalid':
                            (formControls.publicKey.touched || isSubmitted) &&
                            formControls.publicKey.errors?.required
                          }">
                </div>

                <div class="mb-3 form-group"
                    *ngIf="paymentGatewayConfig[form.get('paymentGateway')?.value]?.includes('serverKey')">
                    <label for="serverKey" class="fs-6 mb-3">Server Key</label>
                    <input type="text" id="serverKey" placeholder="Server Key" formControlName="serverKey"
                        class="form-control" [ngClass]="{
                            'is-invalid':
                            (formControls.serverKey.touched || isSubmitted) &&
                            formControls.serverKey.errors?.required
                          }">
                </div>

                <div class="mb-3 form-group"
                    *ngIf="paymentGatewayConfig[form.get('paymentGateway')?.value]?.includes('region')">
                    <label for="region" class="fs-6 mb-3">Region</label>
                    <input type="text" id="region" placeholder="Region" formControlName="region" class="form-control"
                        [ngClass]="{
                        'is-invalid':
                        (formControls.region.touched || isSubmitted) &&
                        formControls.region.errors?.required
                      }">
                </div>

                <div class="d-flex align-items-center justify-content-end">
                    <button tpe="submit" class="btn btn-primary">Save changes</button>
                </div>

            </form>
        </div>
    </ng-template>

</div>
