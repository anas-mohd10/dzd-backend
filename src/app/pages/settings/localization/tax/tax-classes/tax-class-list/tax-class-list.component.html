<div class="taxClass-page-container">
  <div class="page-header">
    <div class="page-title">
      <h1 class="fw-bolder">Tax Class</h1>
    </div>
    <div class="row align-items-center">
      <div class="col d-flex align-items-start justify-content-between">
        <ul class="breadcrumb">
          <li class="breadcrumb-item fs-6">
            <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
          </li>
          <li class="breadcrumb-item active fs-6">
            <a routerLink="{{ appRoute.taxClass.TAX_CLASS_LIST }}">Tax Class</a>
          </li>
        </ul>
        <button class="btn btn-primary cursor-pointer fs-6" color="primary"
          routerLink="{{ appRoute.taxClass.ADD_TAX_CLASS }}">
          Add Tax Class
        </button>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-sm-12">
      <div class="card card-table">
        <div class="card-body">
          <div class="table-responsive" *ngIf="displayTable">
            <table datatable [dtOptions]="dtOptions"
              class="table table-center">
              <thead class="thead">
                <tr class="fs-6">
                  <th class="text-gray-400 col-md-2">Sl No.</th>
                  <th class="text-gray-400 col-md-2">Tax Class</th>
                  <th class="text-gray-400 col-md-2">Description</th>
                  <th class="text-gray-400 col-md-2">Status</th>
                  <th class="text-gray-400 col-md-2">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let taxClass of taxClassData; let i = index">
                  <td class="col-md-2">
                    <h2 class="table-avatar fs-6">{{ i + 1 }}</h2>
                  </td>
                  <td class="col-md-2">
                    <h2 class="table-avatar fs-6">{{ taxClass?.name }}</h2>
                  </td>
                  <td class="description-col">
                    <h2 class="table-avatar fs-6">
                      {{ taxClass?.description }}
                    </h2>
                  </td>
                  <td class="col-md-2">
                    <ng-container *ngIf="taxClass?.isActive == true">
                      <div class="active-text-view">
                        <span class="active-text">
                          active
                        </span>
                      </div>
                    </ng-container>
                    <ng-container *ngIf="taxClass?.isActive == false">
                      <div class="inactive-text-view">
                        <span class="inactive-text">
                          inactive
                        </span>
                      </div>
                    </ng-container>
                  </td>
                  <td class="col-md-2">
                    <a routerLink="{{ appRoute.taxClass.UPDATE_TAX_CLASS }}"
                      [queryParams]="{ taxClass: taxClass?.slug }" class="fs-6 cursor-pointer text-darker"><i
                        class="bi bi-pen"></i> Edit
                    </a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
