<div>
  <div class="page-header d-flex align-items-start justify-content-between">
    <div>
      <div class="page-title">
        <h1 class="fw-bold">Tax Class</h1>
      </div>
      <ul class="breadcrumb">
        <li class="breadcrumb-item fs-6">
          <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
        </li>
        <li class="breadcrumb-item active fs-6">
          <a routerLink="{{ appRoute.taxClass.TAX_CLASS_LIST }}">Tax Class</a>
        </li>
      </ul>
    </div>
    <button class="btn btn-primary" routerLink="{{ appRoute.taxClass.ADD_TAX_CLASS }}">
      Add Tax Class
    </button>
  </div>

  <div class="my-4 card">
    <div class="card-body">
      <input type="search" class="form-control" placeholder="Search items here" [formControl]="keyword"
        (ngModelChange)="getClass()">
    </div>
  </div>

  <div>
    <table class="mt-4 table table-bordered">
      <thead>
        <tr>
          <th>Name</th>
          <th>Percentage</th>
          <th>Status</th>
          <th>&nbsp;</th>
        </tr>
      </thead>

      <tbody class="fs-6">

        <ng-container *ngFor="let class of classDetails; let i =index">
          <tr>
            <td>{{class?.name }}</td>
            <td>{{class?.rate}}</td>
            <td>
              <span class="alert alert-success p-1" [ngClass]="{'alert-danger': !class?.isActive}">
                {{class?.isActive ? 'Active' : 'Inactive'}}
              </span>
            </td>
            <td>
              <div class="d-flex align-items-center">
                <div class="update me-2" routerLink="{{appRoute.taxClass.UPDATE_TAX_CLASS}}"
                  [queryParams]="{'tax': class?.slug}">
                  <svg width="20" height="20" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                      d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
                  </svg>

                </div>
                <div class="delete" (click)="open(delete, class)">
                  <svg width="20" height="20" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                      d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                  </svg>
                </div>
              </div>
            </td>
          </tr>
        </ng-container>

        <tr *ngIf="classDetails.length == 0">
          <td colspan="4">
            <app-no-results></app-no-results>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="my-4">
    <app-pagination [totalPages]="totalPages" [totalResults]="totalResults" [pageIndex]="page" [pageSize]="limit"
      (pageTrigger)="onPageTriggered($event)"></app-pagination>
  </div>

  <ng-template #delete>
    <div class="modal-body text-center">
      <div class="fs-5 mb-6">Do you want to delete this tax rule?</div>
      <button type="button" class="btn btn-default p-2" (click)="confirm()">Yes</button>
      <button type="button" class="btn btn-primary p-2" (click)="modalRef?.hide()">No</button>
    </div>
  </ng-template>
