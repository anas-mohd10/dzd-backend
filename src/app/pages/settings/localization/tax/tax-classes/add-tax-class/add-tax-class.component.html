<div class="content container-fluid">
    <!-- Page Header -->
    <div class="page-header">
      <div class="row align-items-center">
        <div class="col">
          <h3 class="page-title fs-1 fw-bolder">
            {{ editMode ? "Update Tax Class" : "Add Tax Class" }}
          </h3>
          <ul class="breadcrumb">
            <li class="breadcrumb-item fs-5">
              <a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a>
            </li>
            <li class="breadcrumb-item fs-5">
              <a routerLink="{{ appRoute.taxClass.TAX_CLASS_LIST }}">Tax Class</a>
            </li>
            <li class="breadcrumb-item active fs-5">
              <a routerLink="{{ appRoute.taxClass.ADD_TAX_CLASS }}">{{
                editMode ? "Update Tax Class" : "Add Tax Class"
              }}</a>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <!-- /Page Header -->
    <div class="row mt-10">
      <!-- <ng-container *ngIf="!ruleFlag">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </ng-container> -->
      <div class="col-sm-12 fs-5">
        <div class="card">
          <div class="card-body">
            <form (ngSubmit)="onSubmit()" [formGroup]="taxClassForm">
              <div class="row">
                <div class="col-12">
                  <h5 class="form-title fs-4"><span>Tax Class Details</span></h5>
                </div>
                <div class="col-12 col-sm-6">
                  <div class="form-group">
                    <label class="fs-5 mb-3 fw-bold"> Name</label>
                    <input type="text" class="form-control fs-5" formControlName="name"/>
                    <span class="text-danger" *ngIf="(tf.name.touched || isSubmitted) && tf.name.errors?.required">Name is required</span>
                  </div>
                </div>
                <div class="col-12 col-sm-6">
                    <div class="form-group">
                      <label class="fs-5 mb-3 fw-bold"> Description</label>
                      <input type="text" class="form-control fs-5" formControlName="description"/>
                    </div>
                  </div>
                <div class="col-12 col-sm-6">
                  <div class="form-group">
                    <label class="fs-5 mb-3 fw-bold">Status</label>
                    <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg" formControlName="isActive">
                      <option value="true" selected>True</option>
                      <option value="false">False</option>
                    </select>
                  </div>
                </div>
                
                <div class="col-12 col-sm-6">
                  <div class="form-group">
                    <label class="fs-5 mb-3 fw-bold">Tax Rule</label>
                    <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg" formControlName="ruleId">
                      <option selected value="select" disabled>-- Select a tax rule --</option>
                      <option *ngFor="let taxRule of taxRuleNames" value="{{taxRule?.name}}">{{taxRule?.name}}</option>
                    </select>
                  </div>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-primary fs-4">Submit</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
