<div>
    <div class="page-header d-flex align-items-start justify-content-between">
        <div>
            <div class="page-title">
                <h1 class="fw-bold">Static pages</h1>
            </div>
            <ul class="breadcrumb">
                <li class="breadcrumb-item fs-6"><a routerLink="{{ appRoute.DASHBOARD }}">Dashboard</a></li>
                <li class="breadcrumb-item fs-6">
                    <a routerLink="{{ appRoute.staticPages.list}}">Static pages</a>
                </li>
                <li class="breadcrumb-item active fs-6">
                    <a routerLink="{{ appRoute.staticPages.create}}">Add static pages</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="my-4 card">
        <div class="card-body">

            <form [formGroup]="form" (ngSubmit)="onSubmit()">
                <div class="form-group mb-3">
                    <label for="title" class="mb-3 fs-6 required">Title</label>
                    <input type="text" id="title" placeholder="About Us" formControlName="title" class="form-control"
                        [ngClass]="{
                        'is-invalid':  (formControls.title.touched || isSubmitted) && formControls.title.errors?.required}">
                </div>

                <div class="form-group mb-3">
                    <label for="slug" class="mb-3 fs-6">Slug</label>
                    <input type="text" id="slug" placeholder="about-us" formControlName="slug" class="form-control">
                </div>

                <div class="form-group mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <label for="description" class="fs-6 required">Description</label>
                        <button type="button" class="btn btn-secondary btn-sm" (click)="openViewTemplate(viewTemplate)">
                            View Template
                            <span>
                                <svg height="16" width="16" data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor"
                                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"></path>
                                </svg>
                            </span>
                        </button>
                    </div>
                    <textarea type="text" id="message" class="form-control" formControlName="description" rows="20"
                        [ngClass]="{
                                'is-invalid':  (formControls.description.touched || isSubmitted) && formControls.description.errors?.required}"></textarea>
                </div>

                <div class="row">

                    <div class="col-lg-3">
                        <app-assets (mediaClicked)="onMediaClicked($event)"></app-assets>
                    </div>

                    <div class="col-lg-9">
                        <div class="form-group mb-3">
                            <label for="metaTitle" class="mb-3 fs-6">Meta Title</label>
                            <input type="text" id="metaTitle" formControlName="metaTitle" class="form-control">
                        </div>

                        <div class="form-group mb-3">
                            <label for="metaDescription" class="mb-3 fs-6">Meta Description</label>
                            <input type="text" id="metaDescription" formControlName="metaDescription"
                                class="form-control">
                        </div>

                        <div class="form-group mb-3">
                            <label for="metaKeywords" class="mb-3 fs-6">Meta Keywords</label>
                            <input type="text" id="metaKeywords" formControlName="metaKeywords" class="form-control">
                        </div>
                    </div>

                </div>

                <div class="d-flex align-items-center gap-2 justify-content-end">
                    <button class="btn btn-secondary" routerLink="{{appRoute.staticPages.list}}">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save changes</button>
                </div>
            </form>

        </div>
    </div>
</div>

<ng-template #viewTemplate>
    <div class="modal-header">
        <h4 class="fs-2 fw-bold pull-left">View Template</h4>
        <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="viewModalRef?.hide()">
            <span aria-hidden="true" class="visually-hidden">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <div class="template-preview">
            <iframe
                style="width: 100%; height: 640px; border: 1px solid #dee2e6; border-radius: 4px; background: white;"
                [srcdoc]="getPreviewHtml(form.get('description')?.value)"
                frameborder="0"
                sandbox="allow-same-origin allow-scripts allow-forms">
            </iframe>
        </div>
    </div>
</ng-template>
