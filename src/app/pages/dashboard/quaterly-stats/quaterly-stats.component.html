<div class="card h-100">
    <div class="card-body h-100 d-flex flex-column">
        <div class="d-flex justify-content-between align-items-center">
            <div class="fs-4">
                Last <span class="fw-bold text-primary">{{revenueType.value}} Months</span> Sales
            </div>
            <div class="form-group">
                <select class="form-select" id="type" [formControl]="revenueType"
                    (ngModelChange)="filterChanged.emit(revenueType.value)">
                    <option value="3">3 Months</option>
                    <option value="6">6 Months</option>
                    <option value="12">12 Months</option>
                </select>
            </div>
        </div>

        <div class="flex-grow-1 d-flex flex-column justify-content-end gap-2">
            <div class="alert alert-info fs-5">
                <i class="fa fa-info-circle text-info"></i>
                Total Revenue of <span class="fw-bold">{{totalRevenue}}</span> in last <span class="fw-bold">{{revenueType.value}}</span> months
            </div>
            <ng-container *ngIf="revenueMaxItem">
                <div class="alert alert-success fs-5">
                    <i class="fa fa-info-circle text-success"></i>
                    You have the highest revenue of <span class="fw-bold">{{revenueMaxItem.revenue}}</span> in
                    <span class="fw-bold">{{revenueMaxItem.month}}</span> which is <span class="fw-bold">{{revenueMaxPercentage}}%</span> of the total revenue
                </div>
            </ng-container>
            <div class="d-flex align-items-center justify-content-center w-100">
                <apx-chart class="w-100" [series]="chartOptions.series" [chart]="chartOptions.chart" [xaxis]="chartOptions.xaxis"
                [stroke]="chartOptions.stroke" [dataLabels]="chartOptions.dataLabels" [yaxis]="chartOptions.yaxis"
                [labels]="chartOptions.labels" [legend]="chartOptions.legend" [title]="chartOptions.title"
                [subtitle]="chartOptions.subtitle"></apx-chart>
            </div>
        </div>
    </div>
</div>
