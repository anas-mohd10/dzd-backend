<div class="card-body p-0">
  <div class="d-flex flex-stack card-p flex-grow-1">
    <div class="main_form">
      <div class="duration_time">
        <div class="Duration">
          <span> time zone  </span>
          <select class="form-select mb-3" formControlName="isActive">
            <option value="" disabled>local time </option>
            <option value="true">1 month</option>
            <option value="false">6 months</option>
          </select>
        </div>
        <div class="Duration">
          <span> Duration </span>
          <select class="form-select mb-3" formControlName="isActive">
            <option value="" disabled>-- Select an option --</option>
            <option value="true">1 month</option>
            <option value="false">6 months</option>
          </select>
        </div>
      </div>
      <div class="settings">
        <img src="../../../../../assets/icons/settings.svg" alt="">
      </div>
    </div>
    <div class="chart_details">
      <div class="total_sales">
        <h6>
          AED 50
        </h6>
        <h5>
          Total sales
        </h5>
      </div>
    </div>
  </div>

  <div #chartRef class="statistics-widget-3-chart card-rounded-bottom" [style.height]="'150px'">
    <apx-chart [series]="chartOptions.series" [chart]="chartOptions.chart" [xaxis]="chartOptions.xaxis"
      [yaxis]="chartOptions.yaxis" [dataLabels]="chartOptions.dataLabels" [stroke]="chartOptions.stroke"
      [legend]="chartOptions.legend" [fill]="chartOptions.fill" [states]="chartOptions.states"
      [tooltip]="chartOptions.tooltip" [colors]="chartOptions.colors" [markers]="chartOptions.markers"
      [plotOptions]="chartOptions.plotOptions"></apx-chart>
  </div>
</div>
