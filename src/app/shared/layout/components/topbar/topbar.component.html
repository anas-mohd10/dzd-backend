<div class="d-flex align-items-center" [ngClass]="toolbarButtonMarginClass" id="kt_header_user_menu_toggle">

  <div class="me-2 d-none d-lg-block">
    <a class="btn btn-primary d-flex align-items-center justify-content-center" routerLink="{{appRoutes.designs.home}}">
      <svg height="18px" width="18px" data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor"
        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9.53 16.122a3 3 0 0 0-5.78 1.128 2.25 2.25 0 0 1-2.4 2.245 4.5 4.5 0 0 0 8.4-2.245c0-.399-.078-.78-.22-1.128Zm0 0a15.998 15.998 0 0 0 3.388-1.62m-5.043-.025a15.994 15.994 0 0 1 1.622-3.395m3.42 3.42a15.995 15.995 0 0 0 4.764-4.648l3.876-5.814a1.151 1.151 0 0 0-1.597-1.597L14.146 6.32a15.996 15.996 0 0 0-4.649 4.763m3.42 3.42a6.776 6.776 0 0 0-3.42-3.42">
        </path>
      </svg>
      <div class="ms-2"> Design your store</div>
    </a>
  </div>

  <div class="storeButton me-2">
    <a class="btn btn-secondary d-flex align-items-center justify-content-center gap-2" href="{{settings?.domain}}"
      target="_blank">
      <svg data-slot="icon" height="18" width="18" fill="none" stroke-width="1.5" stroke="currentColor"
        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25"></path>
      </svg>
      Visit store
    </a>
  </div>

  <app-notifications [settings]="settings"></app-notifications>

  <div class="btn-group" dropdown placement="bottom right">
    <button id="button-alignment" dropdownToggle type="button" class="bg-transparent text-muted shadow-none border border-0 focus-ring-primary dropdown-toggle" aria-controls="dropdown-alignment">
      <svg height="24" width="24" data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"></path>
      </svg>
    </button>
    <ul id="dropdown-alignment" *dropdownMenu class="dropdown-menu dropdown-menu-right px-3" role="menu"
      aria-labelledby="button-alignment">
      <li>
        <div class="d-flex flex-column pt-4">
          <div class="d-flex align-items-center fs-5">{{userData.username}}</div>
          <div class="text-muted fs-5">{{userData.email}}</div>
        </div>
      </li>
      <li class="my-3" role="menuitem">
        <a class="px-0 py-1 fs-5 d-flex align-items-center justify-content-between gap-2"
          routerLink="{{appRoutes.account.MY_ACCOUNT}}">
          <span>Profile</span>
          <span>
            <svg width="18" height="18" data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor"
              viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"></path>
            </svg>
          </span>
        </a>
      </li>
      <li role="menuitem">
        <button class="btn btn-danger d-flex align-items-center justify-content-center gap-2 w-100 px-4 py-3"
          (click)="logout(logoutModal)">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Logout</span>
        </button>
      </li>
    </ul>
  </div>
</div>

<ng-template #logoutModal>
  <div class="modal-body text-center">
    <p class="mb-4">Are you sure you want to logout?</p>
    <div class="d-flex justify-content-center gap-3">
      <button type="button" class="btn btn-danger logout-btn" (click)="confirmLogout()">Continue</button>
      <button type="button" class="btn btn-secondary logout-btn" (click)="declineLogout()">No</button>
    </div>
  </div>
</ng-template>
