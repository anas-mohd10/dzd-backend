<div class="d-flex align-items-center" [ngClass]="toolbarButtonMarginClass" id="kt_header_user_menu_toggle">

  <div class="me-2">
    <a class="btn btn-primary d-flex align-items-center justify-content-center" routerLink="{{appRoutes.designs.home}}">
      <svg height="18px" width="18px" data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor"
        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9.53 16.122a3 3 0 0 0-5.78 1.128 2.25 2.25 0 0 1-2.4 2.245 4.5 4.5 0 0 0 8.4-2.245c0-.399-.078-.78-.22-1.128Zm0 0a15.998 15.998 0 0 0 3.388-1.62m-5.043-.025a15.994 15.994 0 0 1 1.622-3.395m3.42 3.42a15.995 15.995 0 0 0 4.764-4.648l3.876-5.814a1.151 1.151 0 0 0-1.597-1.597L14.146 6.32a15.996 15.996 0 0 0-4.649 4.763m3.42 3.42a6.776 6.776 0 0 0-3.42-3.42">
        </path>
      </svg>
      <div class="ms-2"> Design your store</div>
    </a>
  </div>

  <div class="storeButton me-2">
    <a class="btn btn-secondary d-flex align-items-center justify-content-center gap-2" href="{{settings?.domain}}"
      target="_blank">
      <svg data-slot="icon" height="18" width="18" fill="none" stroke-width="1.5" stroke="currentColor"
        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25"></path>
      </svg>
      Visit store
    </a>
  </div>

  <div class="notifications" #container>
    <div class="notificationIcon">
      <img src="assets/icons/bell1.svg" alt="Icon" class="iconImage" (click)="toggleNotifications()">
    </div>

    <div class="notificationContainer" [ngClass]="{'showContainer': isShowClicked}" #dropdown>
      <div class="notificationsTitle">Latest Notifications</div>
      <div class="notificationsPagination">
        <ng-container *ngFor="let page of pages">
          <div class="pageNumber" [ngClass]="{'activePage': page == currentPage}" (click)="fetchNotifications(page)">
            {{page}}</div>
        </ng-container>
      </div>
      <div class="notificatins">
        <ng-container *ngFor="let notification of notifications;let i=index">
          <div class="notificationCard">
            New order <span class="fw-bold fs-6">{{notification?.orderNo}}</span> placed. Order amount is Rs. <span
              class="fw-bold fs-6">{{notification?.total}}</span>. <a
              routerLink="{{appRoutes.orders.UPDATE_ORDER_LIST}}" [queryParams]="{ order: notification?.refid }">Click
              here</a> to view
          </div>
        </ng-container>
      </div>
    </div>
  </div>

  <div class="cursor-pointer symbol" [ngClass]="toolbarUserAvatarHeightClass" data-kt-menu-trigger="click"
    data-kt-menu-attach="parent" data-kt-menu-placement="bottom-end" data-kt-menu-flip="bottom">
    <img src="./assets/media/avatars/DummyAvatar.svg" alt="avatar" />
  </div>
  <app-user-inner></app-user-inner>
</div>
<ng-container *ngIf="headerLeft === 'menu'">
  <div class="d-flex align-items-center d-lg-none ms-2 me-n3" title="Show header menu">
    <div class="btn btn-icon btn-active-light-primary w-30px h-30px w-md-40px h-md-40px"
      id="kt_header_menu_mobile_toggle">
      <span [inlineSVG]="'./assets/media/icons/duotune/text/txt001.svg'" class="svg-icon svg-icon-1"></span>
    </div>
  </div>
</ng-container>
