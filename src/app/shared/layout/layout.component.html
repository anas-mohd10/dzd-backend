<ng-container *ngIf="isReady && checkStoreLive() == true">

  <div class="d-flex flex-column flex-root">
    <div class="page d-flex flex-row flex-column-fluid">
      <app-aside *ngIf="asideDisplay" id="kt_aside" data-kt-drawer="true" data-kt-drawer-name="aside"
        data-kt-drawer-activate="{default: true, lg: false}" data-kt-drawer-overlay="true"
        data-kt-drawer-width="{default:'200px', '300px': '250px'}" data-kt-drawer-direction="start"
        data-kt-drawer-toggle="#kt_aside_mobile_toggle" class="aside" [ngClass]="asideCSSClasses"></app-aside>
      <div class="wrapper d-flex flex-column flex-row-fluid " id="kt_wrapper">
        <app-header id="kt_header" [ngClass]="headerCSSClasses" class="header align-items-stretch"
          style="height: auto !important; z-index: 100 !important;" #ktHeader></app-header>
        <div id="kt_content" class="content d-flex flex-column flex-column-fluid">
          <div class="post d-flex flex-column-fluid" id="kt_post">
            <app-content id="kt_content_container" [ngClass]="contentContainerClasses"></app-content>
          </div>
        </div>
      </div>
    </div>
  </div>
  <app-scripts-init></app-scripts-init>
</ng-container>

<ng-container *ngIf="checkStoreLive() == false">
  <div style="height: 100vh; width: 100%;" class="d-flex flex-column align-items-center justify-content-center gap-8">
    <img src="/assets/icons/closed.png" alt="closed" class="img-fluid" style="width: 200px;">
  </div>
</ng-container>
