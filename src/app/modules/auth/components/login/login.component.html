<div class="loginContainer">
  <div class="loginLeft">
    <div class="login_img">
      <img src="assets/images/LoginImg.png" alt="Storedada">
    </div>
  </div>
  <div class="loginRight">
    <div class="login-logo">
      <img alt="Logo" src="assets/images/storedada.jpg" />
    </div>
    <form class="form w-100" [formGroup]="form" novalidate="novalidate" id="kt_login_signin_form" (ngSubmit)="submit()">
      <div class="fv-row mb-5">
        <label class="login_label" for="">
          Email
        </label>
        <input class="form-control fs-6" placeholder="Email address" type="email" formControlName="email"
          autocomplete="off" [ngClass]="{
          'is-invalid':
          (formControls.email.touched || isSubmitted) &&
          formControls.email.errors?.required
        }" />
      </div>
      <div class="fv-row mb-5">
        <label class="login_label" for="">
          Password
        </label>
        <div class="position-relative">
          <input class="form-control fs-6" placeholder="Password" type="{{isPassword ? 'password': 'text'}}"
            autocomplete="off" formControlName="password"
            [ngClass]="{'is-invalid': (formControls.password.touched || isSubmitted) && formControls.password.errors?.required}" />
          <div class="position-absolute top-50 end-0 translate-middle-y mx-2">
            <div (click)="togglePassword()" class="bg-secondary password-icon rounded" *ngIf="!isPassword">
              <svg height="18" width="18" data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z">
                </path>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"></path>
              </svg>
            </div>
            <div (click)="togglePassword()" class="bg-secondary password-icon rounded" *ngIf="isPassword">
              <svg height="18" width="18" data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88">
                </path>
              </svg>
            </div>
          </div>
        </div>
        <a class="forgot" (click)="forgotPassword(template)">
          Forgot Password?
        </a>
      </div>
      <div class="text-center">
        <button type="submit" id="kt_sign_in_submit" class="btn btn-lg btn-primary w-100" [disabled]="form.invalid">
          <span class="indicator-label">Continue</span>
        </button>
      </div>
    </form>
  </div>
</div>

<ng-template #template>
  <div class="modal-header">
    <h4 class="fs-2 fw-bold pull-left">Enter your email to reset password</h4>
    <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="modalRef?.hide()">
      <span aria-hidden="true" class="visually-hidden">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <div class="form-group">
      <input type="text" name="email" id="email" [formControl]="email" class="form-control" placeholder="Email"
        [ngClass]="{
          'is-invalid': (email.touched || isValidated) && email.errors?.['required']}">
    </div>
    <div class="mt-3 d-flex flex-column">
      <button class="btn btn-primary" (click)="confirm()">Reset Password</button>
      <button class="btn btn-link me-2" (click)="modalRef?.hide()">Cancel</button>
    </div>
  </div>
</ng-template>
