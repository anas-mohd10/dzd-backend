<div class="d-flex justify-content-center align-items-center">
  <div class="login-logo">
    <img alt="Logo" src="../../../assets/media/logos/cc-logo.png" class="h-60px" />
  </div>
  <form class="form w-100" [formGroup]="loginForm" novalidate="novalidate" id="kt_login_signin_form"
    (ngSubmit)="submit()">
    <div class="mb-10">
      <h1 class="mb-3 fs-2" style="font-weight: 800;">Login to dashboard</h1>
    </div>
    <div class="fv-row mb-10">
      <label class="form-label fs-5 text-dark">Email</label>
      <input class="form-control fs-5" type="email" formControlName="email" autocomplete="off" [ngClass]="{
          'is-invalid':
          (af.email.touched || isSubmitted) &&
          af.email.errors?.required
        }" />
      <span class="text-danger error-msg fs-5" *ngIf="
        (af.email.touched || isSubmitted) &&
        af.email.errors?.required
      ">Email is required</span>
    </div>
    <div class="fv-row mb-10">
      <div class="d-flex justify-content-between mt-n5">
        <div class="d-flex flex-stack mb-2">
          <label class="form-label text-dark fs-5 mb-0">Password</label>
        </div>
      </div>
      <input class="form-control" type="password" autocomplete="off" formControlName="password" [ngClass]="{
          'is-invalid':
          (af.password.touched || isSubmitted) &&
          af.password.errors?.required
        }" />
      <span class="text-danger error-msg fs-5" *ngIf="
        (af.password.touched || isSubmitted) &&
        af.password.errors?.required
      ">Password is required</span>
    </div>
    <div class="text-center">
      <button type="submit" id="kt_sign_in_submit" class="btn btn-lg btn-primary w-100 mb-5"
        [disabled]="loginForm.invalid">
        <span class="indicator-label">Continue</span>
      </button>
    </div>
  </form>
</div>
