<div class="loginContainer">
  <div class="loginLeft">
    <!-- <div class="loginLeftTitle">Ecommerce, so what!</div>
    <div class="loginLeftSubTitle">Login to access the dashboard</div> -->
    <div class="login_img">
      <img src="../../../assets/images/LoginImg.png" alt="">
    </div>
  </div>
  <div class="loginRight">
    <div class="login-logo">
      <img alt="Logo" src="../../../assets/media/logos/cc-logo.png" />
    </div>
    <form class="form w-100" [formGroup]="loginForm" novalidate="novalidate" id="kt_login_signin_form"
      (ngSubmit)="submit()">
      <div class="fv-row mb-5">
        <label  class="login_label" for="">
          Email 
        </label>
        <input class="form-control fs-6" placeholder="Email address" type="email" formControlName="email"
          autocomplete="off" [ngClass]="{
          'is-invalid':
          (af.email.touched || isSubmitted) &&
          af.email.errors?.required
        }" />
      </div>
      <div class="fv-row mb-5">
        <label class="login_label" for="">
          Password 
        </label>
        <input class="form-control fs-6" placeholder="Password" type="password" autocomplete="off"
          formControlName="password" [ngClass]="{
          'is-invalid':
          (af.password.touched || isSubmitted) &&
          af.password.errors?.required
        }" />
        <a class="forgot" href="">
          forgot password?
        </a>
      </div>
      <div class="text-center">
        <button type="submit" id="kt_sign_in_submit" class="btn btn-lg btn-primary w-100"
          [disabled]="loginForm.invalid">
          <span class="indicator-label">Continue</span>
        </button>
      </div>
    </form>
  </div>
</div>
