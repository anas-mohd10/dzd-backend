server {
    listen       80;
    server_name  localhost;

    # The default root for all requests
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Route /admin/ requests to the Angular app
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Optional: Redirect root to admin (if needed)
    location = / {
        return 301 /admin/;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
